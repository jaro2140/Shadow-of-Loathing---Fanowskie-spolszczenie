- kolejnosc_w_danych_gry: 3266
  skrypt: re_region2_companion_obie_misc
  pomieszczenie: null
  zagadka: false
  minigra_lub_feature: false
  liczba_wpisow: 4
  sekcje:
  - etykieta: start
    wpisy:
    - id: sol_8cb15d9f4230bb3f2540
      kontekst: textscripts.re_region2_companion_obie_misc:line:3
      linia: 3
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: A break in the trees reveals that you and Obie have wandered near to the edge of the eponymous Crystaldream Lake (and if that doesn't
        make any sense based on the map, well, I guess you're lost).
      pl: Przerwa w drzewach ukazuje, że ty i Obie zawędrowaliście w pobliże brzegu jeziora, od którego nazwano region — Jeziora Kryształowych Snów (a jeśli to nie ma sensu na podstawie mapy, cóż, chyba się zgubiłeś).
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_8911290451173c7f773a
      kontekst: textscripts.re_region2_companion_obie_misc:line:4
      linia: 4
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Rather than being a sandy beach, the lake shore is composed of rocks and small stones. The weather isn't 'nice' per se, but it's not
        too cold and there isn't much wind, so the two of you decide to take a break for a bit. Obie sits down on a rock and noodles away on his
        oboe, while you spend some time skimming stones across the water.
      pl: Zamiast piaszczystej plaży brzeg jeziora składa się z kamieni i drobnych kamyków. Pogoda nie jest »ładna« per se, ale nie jest zbyt
        zimno i nie ma wiele wiatru, więc we dwójkę postanawiacie zrobić sobie chwilę przerwy. Obie siada na kamieniu i pobrzdąka na oboju, a
        ty przez chwilę puszczasz kaczki po wodzie.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_b154ae94e5280d2dac6a
      kontekst: textscripts.re_region2_companion_obie_misc:line:5
      linia: 5
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: That probably counts as fighting practice to some degree, right? You throw a thing at a guy once in a while. I'll go ahead and count
        it.
      pl: To pewnie w jakimś stopniu liczy się jako trening walki, prawda? Rzucasz czymś w kogoś raz na jakiś czas. Zaliczę to.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_a92bdb016fb6c4b53100
      kontekst: textscripts.re_region2_companion_obie_misc:line:7
