      linia: 17
      sekcja_skryptu: e
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: There are some filthworm larvae wriggling around in the planter!  You milk them.
      pl: W donicy wiją się larwy brudorobaków! Wyciskasz z nich mleczko.
