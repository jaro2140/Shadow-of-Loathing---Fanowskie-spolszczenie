      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Let's do some bean-shooter practice! Every little bit helps, an' anyway my finger's gettin' itchy.
      pl: Poćwiczmy trochę strzelania z grochownicy! Każda odrobina się liczy, a poza tym palec mi się rwie.
