      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Gabby pushes some Meat into the slot, and claps her hands excitedly as the displays beep and flash. The robot arms whirr into action,
        opening the cooler lid and handing Gabby two bottles of soda.
      pl: Gabby wpycha trochę Mięsa do szczeliny i klaszcze podekscytowana, gdy wyświetlacze piszczą i migają. Robotyczne ramiona uruchamiają
        się z warkotem, otwierając wieczko chłodziarki i podając Gabby dwie butelki napoju.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
