      kontekst: textscripts.re_region3_companion_obie_misc:line:5
      linia: 5
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Well now! My finely-tuned jazz-man senses are registering a golden opportunity.
      pl: No, no! Moje wyczulone zmysły jazzmana wykrywają złotą okazję.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_8c2dfbf3574ab8f6da8e
      kontekst: textscripts.re_region3_companion_obie_misc:line:7
      linia: 7
      sekcja_skryptu: start
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: What? ...Oh, you mean busking? You think you'll get much from a bunch of college kids?
      pl: Co? ...A, masz na myśli granie na ulicy? Myślisz, że dużo zbierzesz od bandy studentów?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_175b18067af2193eac0e
      kontekst: textscripts.re_region3_companion_obie_misc:line:8
      linia: 8
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Kid, if I know three things about college students, it's that they like good music, they have beer money even if they don't have rent
        money, and they're happy to help alleviate a social injustice if a way to do that without spending any extra effort presents itself.
      pl: Dzieciaku, jeśli znam trzy rzeczy o studentach, to że lubią dobrą muzykę, mają kasę na piwo, nawet jeśli nie mają na czynsz, i chętnie
        pomogą złagodzić niesprawiedliwość społeczną, jeśli nadarzy się okazja zrobienia tego bez dodatkowego wysiłku.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_6f237d2236afac58322e
      kontekst: textscripts.re_region3_companion_obie_misc:line:9
      linia: 9
      sekcja_skryptu: start
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: I'm hip, let's go.
      pl: Jestem za, chodźmy.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: next
