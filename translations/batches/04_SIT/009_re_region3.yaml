      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: As you're desperately trying to keep your cool and figure your way out of here, an office door opens and a cloud of irrational numbers
        seeps out -- so irrational that you might as well call them insane.
      pl: Gdy desperacko próbujesz zachować spokój i wykombinować, jak się stąd wydostać, otwierają się drzwi do biura i wysącza się z nich chmura liczb niewymiernych — tak niewymiernych, że równie dobrze można by je nazwać obłąkanymi.
      status: do_korekty
      wspoldzielony_rekord: false
