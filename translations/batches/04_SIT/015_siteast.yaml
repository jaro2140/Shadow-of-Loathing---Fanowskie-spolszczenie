    - id: sol_2f919715ddae1b378a8a
      kontekst: textscripts.siteast_astronomyteacher:line:30
      linia: 30
      sekcja_skryptu: two
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Come again?
      pl: Słucham?
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 5
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_a6569bc9c0b683088dd2
      kontekst: textscripts.siteast_astronomyteacher:line:31
      linia: 31
      sekcja_skryptu: two
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: There's a telescope on the roof of S.I.T.'s Spider Wing. You can get there through the Scalar Wing.
      pl: Na dachu Skrzydła Pająka S.I.T. znajduje się teleskop. Dotrzesz tam przez Skrzydło Skalarne.
      status: do_korekty
      wspoldzielony_rekord: false
