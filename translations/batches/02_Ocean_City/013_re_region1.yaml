      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Instead of being repulsed by this, like a normal person would be, you are excited, because you recognize the worms as <i>annelida grodicus</i>
        -- the Western Jungle Filthworm!
      pl: Zamiast czuć odrazę, jak zrobiłaby normalna osoba, jesteś podekscytowany, bo rozpoznajesz te robaki jako <i>annelida grodicus</i> — Zachodniego Dżunglowego Plugawca!
