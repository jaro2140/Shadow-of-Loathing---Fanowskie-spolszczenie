      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: If it seems improbable to you that you would know enough about this stuff to figure that out, just assume it was written in a notebook
        someone left on the table.
      pl: Jeśli wydaje ci się nieprawdopodobne, żebyś wiedział na tyle dużo o tych sprawach, żeby to rozgryźć, po prostu załóż, że było to napisane
        w notatniku, który ktoś zostawił na stole.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
