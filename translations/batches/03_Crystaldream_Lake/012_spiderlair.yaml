    - id: sol_ae14e15402181bd9433f
      kontekst: textscripts.spiderlair_plaque:line:10
      linia: 10
      sekcja_skryptu: readit
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: He managed to dig one decent-sized pit, but before he could fill it up with sharks, it filled itself up with spiders, or perhaps it
        would be more accurate to say that spiders filled it up with themselves.  And their offspring.  Their teeming hordes of awful, venomous
        offspring.
      pl: Udało mu się wykopać dół przyzwoitych rozmiarów, lecz zanim zdążył napełnić go rekinami, dół sam napełnił się pająkami. A może trafniej
        byłoby powiedzieć, że pająki napełniły go sobą. Oraz swoim potomstwem. Mrowiem okropnego, jadowitego potomstwa.
      status: do_korekty
