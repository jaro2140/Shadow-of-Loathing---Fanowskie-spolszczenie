- kolejnosc_w_danych_gry: 3251
  skrypt: re_region2_companion_adams_misc
  pomieszczenie: null
  zagadka: false
  minigra_lub_feature: false
  liczba_wpisow: 9
  sekcje:
  - etykieta: start
    wpisy:
    - id: sol_714c62cf51f1d754f978
      kontekst: textscripts.re_region2_companion_adams_misc:line:3
      linia: 3
      sekcja_skryptu: start
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: There sure are a lot of different plants out here. Do you know about herbs and stuff, Professor? Is any of this useful?
      pl: Jest tu naprawdę mnóstwo różnych roślin. Zna się pan na ziołach i takich tam, profesorze? Czy coś z tego jest przydatne?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_35fa238224ccf0227f66
      kontekst: textscripts.re_region2_companion_adams_misc:line:5
      linia: 5
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Well, my main focus in the Diſcipline of Alchemy is on raw Elements, not Herbology, but I ſuppoſe I know a thing or two. See you that
        Willow tree in the diſtance? Its bark is uſeful as a cure for head-aches. Ah, and theſe little white and yellow Flowers are called Feverfew.
      pl: Cóż, moim głównym obszarem w Dyscyplinie Alchemii są surowe Pierwiastki, nie Zielarstwo, ale przypuszczam, że wiem to i owo. Widzi pan
        tę wierzbę w oddali? Jej kora jest przydatna jako lekarstwo na bóle głowy. Ach, a te małe białe i żółte Kwiaty nazywają się wrotycz maruna.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_e490ff62750e2d85e776
      kontekst: textscripts.re_region2_companion_adams_misc:line:6
      linia: 6
      sekcja_skryptu: start
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: For curing fevers?
      pl: Na leczenie gorączki?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_9defe0a4e33c591b6b14
      kontekst: textscripts.re_region2_companion_adams_misc:line:7
      linia: 7
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: One might aſsume ſo, but actually it's for head-aches. ...Moſt Herbs are for head-aches, now that I think about it.
      pl: Można by tak Przypuszczać, ale w rzeczywistości to na bóle głowy. ...Większość Ziół jest na bóle głowy, teraz kiedy o tym myślę.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
