      kontekst: textscripts.re_region3_shadowcompass2:line:6
      linia: 6
      sekcja_skryptu: start
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Follow the compass
      pl: Podążaj za kompasem
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 3
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: open
    wpisy:
    - id: sol_a5fc97da88bac5482676
      kontekst: textscripts.re_region3_shadowcompass2:line:10
      linia: 10
      sekcja_skryptu: open
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The compass leads you through the halls of a quiet dorm, walls adorned with football trophies and letterman jackets. As you approach
        a red door at the end of the hall, you are conscious of feeling warmer and warmer.
      pl: Kompas prowadzi cię przez korytarze cichego akademika, ściany ozdobione trofeami futbolowymi i kurtkami sportowymi. Gdy zbliżasz się
        do czerwonych drzwi na końcu korytarza, jesteś świadomy, że robi ci się coraz cieplej.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_fc2e00a87493868f6865
      kontekst: textscripts.re_region3_shadowcompass2:line:11
      linia: 11
      sekcja_skryptu: open
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The needle is telling you to open that door.
      pl: Igła mówi ci, żeby otworzyć te drzwi.
