      linia: 104
      sekcja_skryptu: church
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Hmm? Sure, usedta go an' pay my respects once in a while. Back afore my knee started actin' up. Got plenty'a urns ta talk to right here
        though, har!
      pl: Hm? Jasne, kiedyś chadzałem tam co jakiś czas oddać cześć. Jeszcze zanim kolano zaczęło mi dokuczać. Ale tutaj też mam mnóstwo urn do gadania, har!
      status: do_korekty
