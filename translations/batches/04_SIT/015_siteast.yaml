    - id: sol_803bf4d3b95f64c55d67
      kontekst: textscripts.siteast_astronomyteacher:line:33
      linia: 33
      sekcja_skryptu: two
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Oh okay. I thought you were gonna teach me how to do astral travel or something.
      pl: Aha, dobrze. Myślałem, że nauczysz mnie podróży astralnych albo czegoś w tym rodzaju.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_b8cb9d2ebf17419f6302
      kontekst: textscripts.siteast_astronomyteacher:line:34
      linia: 34
      sekcja_skryptu: two
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: No, I save that for the 201.
      pl: Nie, to zostawiam na kurs 201.
