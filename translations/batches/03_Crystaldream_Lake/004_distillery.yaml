      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Wow, maybe it wasn't Prohibition that put this place out of business.
      pl: Rany, może to nie prohibicja doprowadziła to miejsce do ruiny.
