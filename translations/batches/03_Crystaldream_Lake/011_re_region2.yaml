      linia: 2
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The future version of yourself strolls up to you and hands you a fat wad of Meat (you know it's the future version and not the past
        version, because you don't remember this happening before).
      pl: Przyszła wersja ciebie podchodzi i wręcza ci gruby plik Mięsa (wiesz, że to przyszła wersja, a nie przeszła, bo nie pamiętasz, żeby
        to się już wcześniej wydarzyło).
