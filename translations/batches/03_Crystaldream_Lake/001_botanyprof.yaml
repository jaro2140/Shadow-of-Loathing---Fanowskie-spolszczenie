      linia: 24
      sekcja_skryptu: read2
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: <i>"I'm certain that I've finally got this right, but the woman at the pet store refuses to sell me any more rats until I explain what
        I've done with the last dozen, and I don't think she'll like the answer. I hesitate to use my loyal companion Barker for this purpose,
        but he's all that I've got left. Anyway, there's nothing to worry about. It will definitely work this time."</i>
      pl: <i>„Mam pewność, że tym razem wszystko będzie dobrze, ale kobieta ze sklepu zoologicznego nie chce sprzedać mi kolejnych szczurów, dopóki nie wyjaśnię, co stało się z poprzednim tuzinem, a odpowiedź raczej jej się nie spodoba. Nie chcę wykorzystywać do tego mojego wiernego Szczekory, lecz nic innego mi nie zostało. Zresztą nie ma powodów do obaw. Tym razem na pewno się uda”.</i>
