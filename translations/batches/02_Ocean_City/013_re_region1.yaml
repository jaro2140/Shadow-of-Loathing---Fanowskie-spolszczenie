      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_f3ad44d31dfdcaf4f95d
      kontekst: textscripts.re_region1_companion_gabby_levelup:line:8
      linia: 8
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: City trash take-awayers are all contractors now, and who wanted to pay for it? Nobody! So the car waits there, and people put junk there
        because that's a place where junk is.
      pl: Miejscy wywożatele śmieci są teraz wszyscy kontraktorami, a kto by za to chciał płacić? Nikt! Więc samochód tam czeka, a ludzie zostawiają
        tam śmieci, bo to jest takie miejsce, gdzie są śmieci.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_d9255589ce5391ef5c88
