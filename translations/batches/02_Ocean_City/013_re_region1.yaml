      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: As the two of you are strolling down the city sidewalks, Professor Adams occasionally stops to make a quick sketch of some modern thing
        that you totally take for granted.
      pl: Gdy we dwójkę spacerujecie chodnikami miasta, profesor Adams od czasu do czasu przystaje, żeby naszkicować jakąś nowoczesną rzecz, którą
        ty zupełnie bierzesz za pewnik.
