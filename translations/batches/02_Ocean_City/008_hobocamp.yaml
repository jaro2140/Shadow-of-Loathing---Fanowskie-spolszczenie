      sekcja_skryptu: letters
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: I'm an expert in migrocryptography -- a.k.a. "hobo code." Are you familiar with it?
      pl: Specjalizuję się w migrokryptografii, znanej też jako „kod włóczęgów”. Znasz go?
      status: do_korekty
      wspoldzielony_rekord: false
