      linia: 4
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: It looks like the abandoned factory has been occupied by one of Ocean City's various gangs of street hoodlums, namely the Doughboys.
        They're hanging out here in their leather jackets and white aprons, bragging about their sourdough starters and using rude words like
        "foccacia" and "son of a brioche."
      pl: Wygląda na to, że opuszczoną fabrykę zajął jeden z licznych gangów ulicznych opryszków Ocean City, a konkretnie Ciastochłopcy. Kręcą
        się tu w skórzanych kurtkach i białych fartuchach, przechwalają zakwasami i rzucają ordynarnymi słowami w rodzaju „focaccia” oraz „syn
        drożdżówki”.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
