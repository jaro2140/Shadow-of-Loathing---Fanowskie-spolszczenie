      kontekst: textscripts.botanyprof_bossdown:line:25
      linia: 25
      sekcja_skryptu: signo
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You pick through the tattered remnants of the professor's lab coat, and find his faculty ID and pen.
      pl: Przeszukujesz strzępy fartucha laboratoryjnego profesora i znajdujesz jego legitymację pracowniczą oraz pióro.
      status: do_korekty
      wspoldzielony_rekord: false
