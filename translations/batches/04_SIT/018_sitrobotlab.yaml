      linia: 43
      sekcja_skryptu: hard
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Aw, it's a breeze! Are you not the technical sort?
      pl: Ech, to pestka! Technika nie jest twoją mocną stroną?
