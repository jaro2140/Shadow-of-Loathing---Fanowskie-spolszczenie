      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Nothing happens when you pull the book off the shelf, so you flip it open and page through it a little.
      pl: Kiedy zdejmujesz książkę z półki, nic się nie dzieje, więc otwierasz ją i trochę kartkujesz.
