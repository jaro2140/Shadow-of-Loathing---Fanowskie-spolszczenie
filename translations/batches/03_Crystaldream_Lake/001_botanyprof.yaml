      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The blue cheese dressing has completely solidified, but you manage to pry a handful of slightly-fuzzy lumps out of the bottle with the
        handle of a spoon. If you squint a little, you can pretend that they're feta crumbles. That's nice.
      pl: Sos z sera pleśniowego całkowicie zastygł, ale rączką łyżki udaje ci się wydłubać z butelki garść lekko włochatych grudek. Po zmrużeniu
