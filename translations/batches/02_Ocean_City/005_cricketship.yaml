        this ending, our home planet of New Yecchia is destroyed by an unimaginable force of darkness.</i>
      pl: <i>Byliśmy świadkami... zakończenia. Nie jedynego możliwego, bo jest ich kilka, ale chyba najbardziej prawdopodobnego. W tym zakończeniu
        naszą ojczystą planetę, Nową Yecchię, niszczy niewyobrażalna siła ciemności.</i>
