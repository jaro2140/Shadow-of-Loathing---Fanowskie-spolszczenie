    - id: sol_65f8219aad318e17490c
      kontekst: textscripts.sitwest_geologysign5:line:11
      linia: 11
      sekcja_skryptu: read
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: \"Even a small hexrock of the correct composition, when placed in a Morton Engine such as this one, can be used to generate an almost
        unlimited amount of electricity -- albeit of low to middling voltage. This particular sample, for instance, powers the elevator down to
        the department quarry. Unfortunately, attempts to artificially synthesize this type of hexrock have not yet been fruitful."
      pl: \"Nawet niewielki heksokamień o odpowiednim składzie, po umieszczeniu w Silniku Mortona takim jak ten, może wytwarzać niemal nieograniczoną
        ilość energii elektrycznej — choć o niskim lub średnim napięciu. Ta konkretna próbka zasila na przykład windę prowadzącą do wydziałowego
        kamieniołomu. Niestety próby sztucznego wytworzenia tego typu heksokamienia dotąd nie przyniosły owoców."
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_4d9cfa82b44da9a61220
      kontekst: textscripts.sitwest_geologysign5:line:14
