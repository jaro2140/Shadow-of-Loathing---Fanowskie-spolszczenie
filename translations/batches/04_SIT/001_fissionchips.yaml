      linia: 22
      sekcja_skryptu: intro
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Nope. I thought this was a real good plan, too! College kids always need pencils, right? But I can't sell a dang one of the things.
      pl: Ano. Myślałem, że to naprawdę dobry plan! Studenci zawsze potrzebują ołówków, prawda? Ale nie mogę sprzedać ani jednego.
