      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You discover a small clearing in the woods, where several shadow cows are grazing idly around a large shadowy bell. Every now and then
        one of them moos, except it sounds like "oooomm" with a lot of bass and reverb. How did they get all the way here from the farmlands?
        That probably isn't good news. They certainly aren't good moos. Ha ha.
      pl: Odkrywasz małą polanę w lesie, gdzie kilka cienistych krów bezczynnie się pasie wokół wielkiego, cienistego dzwonu. Co jakiś czas jedna
        z nich muczy, tyle że brzmi to jak »oooomm«, z mnóstwem basu i pogłosu. Jak one w ogóle dotarły tu z terenów rolniczych? To pewnie niedobra
        wiadomość. Z pewnością nie są to dobre muuu-wieści. Ha ha.
