      mowca_lub_kanal: postac_po_prawej
      en: '<i>Buying new textbooks!</i> It''s a scam! There''s no reason to buy a textbook new. Spare your wallet and spoil yourself, my friend:
        buy your textbooks used! May I tempt you?'
      pl: '<i>Kupowanie nowych podręczników!</i> To szwindel! Nie ma powodu, żeby kupować podręcznik nowy. Oszczędź swój portfel i rozpieść siebie,
        przyjacielu: kupuj podręczniki używane! Czy mogę cię skusić?'
