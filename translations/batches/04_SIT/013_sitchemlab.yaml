      pl: \"<i>Witamy na Wydziale Chemikaliów S.I.T. Być może zainteresuje cię fakt, że cały ten budynek wykonano z litej miedzi przekazanej S.I.T.
        przez Skarb Federalny, który nie potrafił wymyślić dla niej żadnego zastosowania.</i>"
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
