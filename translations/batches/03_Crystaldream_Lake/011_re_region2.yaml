      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You pull up short, having nearly walked straight into a huge spiderweb while you weren't paying attention. Although, I guess some part
        of you <i>was</i> paying attention. Good job, whatever part that was.
      pl: Zatrzymujesz się gwałtownie, prawie wchodząc prosto w wielką pajęczynę, kiedy nie uważałeś. Chociaż, jak sądzę, jakaś twoja część <i>uważała</i>.
        Dobra robota, którakolwiek to była część.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
