      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You spend ten minutes or so going over the basics of hobo code with Letters -- he teaches you some of the most common glyphs.
      pl: Przez około dziesięć minut Letters omawia z tobą podstawy kodu włóczęgów i uczy najpopularniejszych glifów.
