    - id: sol_7763b20f0471854f040d
      kontekst: textscripts.re_region2_companion_adams_levelup:line:6
      linia: 6
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Ah, moſt excellent! My calculations were accurate! Good afternoon, Dr. Adams!
      pl: Ach, wyśmienicie! Moje obliczenia były trafne! Dzień dobry, doktorze Adams!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_f49ceb7545990b2bc73a
      kontekst: textscripts.re_region2_companion_adams_levelup:line:8
      linia: 8
      sekcja_skryptu: start
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: How extraordinary! Good afternoon to you -- Future Dr. Adams, I preſume?
      pl: Cóż za niezwykłość! Dzień dobry i panu -- Przyszły Doktorze Adams, jak mniemam?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_c52a57a8613733c50fad
      kontekst: textscripts.re_region2_companion_adams_levelup:line:9
      linia: 9
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: 'Indeed! I''m afraid I have little time in which to converſe, but I muſt give you a Warning: before bronzing yourself for the third
        time, remember to unplug your Microwave-Oven!'
      pl: 'Istotnie! Obawiam się, że mam mało czasu na rozmowę, ale muszę pana Ostrzec: zanim po raz trzeci pokryje się pan brązem, proszę pamiętać, by odłączyć swoją Kuchenkę Mikrofalową!'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_6ba91c02f1077b474663
