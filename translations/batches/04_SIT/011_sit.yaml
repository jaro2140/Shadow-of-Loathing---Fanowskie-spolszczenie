      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: I'm not working <i>for</i> the Shadow, you idiot! I'm working <i>against</i> it! I've been down here for a hundred and twenty years,
        defending my school and its students from corruption! Ever since the day of the Black Fire, I've been in this basement keeping these protective
        wards going!
      pl: Nie pracuję <i>dla</i> Cienia, idioto! Pracuję <i>przeciwko</i> niemu! Od 120 lat siedzę tutaj i bronię szkoły oraz studentów przed
