      sekcja_skryptu: reminisce
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Yeah, my bus stalled out on the way to the city, and I met him while I was looking for gas.
      pl: Tak, autobus zepsuł się w drodze do miasta i spotkaliśmy się podczas poszukiwań benzyny.
