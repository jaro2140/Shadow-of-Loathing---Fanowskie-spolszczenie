  - etykieta: next
    wpisy:
    - id: sol_05b98b2eb7667852a546
      kontekst: textscripts.re_region2_companion_simone_levelup:line:10
      linia: 10
      sekcja_skryptu: next
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Simone unlimbers her rifle, levels her sights at the tree, licks a finger and holds it up to test the wind, puts down the rifle and
        fashions a makeshift anemometer out of some sticks and discarded paper cups, studies that for a minute, makes some her notes in her notebook
        and does some calculations, and then picks her rifle back up and shoots the tree.
      pl: Simone odbezpiecza karabin, celuje w drzewo, liże palec i unosi go, żeby sprawdzić wiatr, odkłada karabin i sporządza prowizoryczny
        anemometr z paru patyków i porzuconych papierowych kubków, przez chwilę go analizuje, robi notatki w notesie i wykonuje obliczenia, po
        czym ponownie chwyta karabin i strzela w drzewo.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_4cfe86ce8ca88a423326
      kontekst: textscripts.re_region2_companion_simone_levelup:line:12
      linia: 12
      sekcja_skryptu: next
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Simone picks up a rock, examines it for a moment, pulls a file and some sandpaper out of her toolkit and makes a few minute ajdustments
        to it, licks a finger and holds it up to test the wind, puts down the rock and fashions a makeshift anemometer out of some sticks and
        discarded paper cups, studies that for a minute, makes some her notes in her notebook and does some calculations, and then picks her rock
        back up and lobs it at the tree.
      pl: Simone podnosi kamień, przez chwilę go ogląda, wyciąga z zestawu narzędzi pilnik i papier ścierny i wykonuje kilka drobnych poprawek,
        liże palec i unosi go, żeby sprawdzić wiatr, odkłada kamień i sporządza prowizoryczny anemometr z paru patyków i porzuconych papierowych
        kubków, przez chwilę go analizuje, robi notatki w notesie i wykonuje obliczenia, po czym ponownie chwyta kamień i ciska nim w drzewo.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_e2bd0893c58c4bb71710
      kontekst: textscripts.re_region2_companion_simone_levelup:line:14
      linia: 14
      sekcja_skryptu: next
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: A perfect hit! How about that for winnitude?
      pl: Idealne trafienie! Co powiesz na taką zwyciężliwość?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_c12df0d64705758837db
      kontekst: textscripts.re_region2_companion_simone_levelup:line:15
      linia: 15
      sekcja_skryptu: next
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: That was good, but in a real fight you'll need to be a bit quicker.
      pl: Było dobrze, ale w prawdziwej walce będziesz musiała być trochę szybsza.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
