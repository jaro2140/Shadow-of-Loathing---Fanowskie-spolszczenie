      en: You turn and run. The faeries give chase, but apparently don't care enough to either chase you for very long, or to waste bullets on
        you. I guess they were basically satisfied with the bear.
      pl: Odwracasz się i uciekasz. Wróżki rzucają się w pogoń, ale najwyraźniej nie zależy im na tyle, żeby gonić cię długo albo marnować na
        ciebie naboje. Chyba w zasadzie zaspokoił je już niedźwiedź.
