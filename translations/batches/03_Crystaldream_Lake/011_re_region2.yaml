  skrypt: re_region2_fight_faerie2
  pomieszczenie: null
  zagadka: false
  minigra_lub_feature: true
  liczba_wpisow: 13
  sekcje:
  - etykieta: start
    wpisy:
    - id: sol_9f3c2411787fcc4bbaa0
      kontekst: textscripts.re_region2_fight_faerie2:line:4
      linia: 4
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You hear some growling and shrieking and laughing nearby, and despite it being a bad idea because it's probably more of those horrible
        fairies, you go to check it out.
      pl: Słyszysz w pobliżu warczenie, wrzaski i śmiech, i mimo że to zły pomysł, bo to pewnie kolejne z tych okropnych wróżek, idziesz to sprawdzić.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: true
      uwagi: []
    - id: sol_d77ee02a6333facab0f9
      kontekst: textscripts.re_region2_fight_faerie2:line:5
      linia: 5
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: It does in fact turn out to be more of those horrible fairies. These ones are tormenting a badger, which is backed up into a shallow
        burrow and frantically swatting at them as they poke at it with little knives.
      pl: Faktycznie okazuje się, że to kolejne z tych okropnych wróżek. Te dręczą borsuka, który wycofał się do płytkiej nory i rozpaczliwie
        je odgania, gdy dźgają go małymi nożykami.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: true
      uwagi: []
    - id: sol_48673112d83255e8f1f6
      kontekst: textscripts.re_region2_fight_faerie2:line:6
      linia: 6
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Just as you're starting to back away, grateful that they haven't noticed you, you step on a dry twig. It cracks noisily, and the faeries
        all turn around. Dang it, twig!
      pl: Właśnie gdy zaczynasz się wycofywać, wdzięczny, że cię nie zauważyły, nadeptujesz na suchą gałązkę. Trzaska głośno, a wszystkie wróżki
        się odwracają. A niech to, gałązka!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: true
      uwagi: []
