      linia: 51
      sekcja_skryptu: notstupid
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Well, I read a magazine article about it once. A lot of it went over my head, but basically, since goblins are fungal creatures instead
        of mammals, their brains work pretty differently, and they find it really hard to extrapolate from familiar experiences to unfamiliar
        ones. So when they're dealing with novel situations, they tend to just make wild guesses about how they're supposed to behave.
      pl: Czytałem kiedyś artykuł w czasopiśmie. Wiele rzeczy było ponad moją głową, ale zasadniczo gobliny są stworzeniami grzybowymi, a nie ssakami, więc ich mózgi działają inaczej i bardzo trudno im przenosić znane doświadczenia na nieznane sytuacje. Dlatego w nowych okolicznościach po prostu dziko zgadują, jak powinny się zachować.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
