      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: You'll be making Meat more easily later, so this won't seem like as much then. Just think of it as a no-interest loan.
      pl: Później będziesz zarabiać Mięso łatwiej, więc wtedy nie wyda ci się to aż tyle. Po prostu pomyśl o tym jak o pożyczce bez odsetek.
