- kolejnosc_w_danych_gry: 4763
  skrypt: zimmerhouse_beast
  pomieszczenie:
    id: zimmerhouse_shadowzone
    nazwa_en: Shadow Rift (@map1_name_zimmerhouse@ Cellar)
  zagadka: false
  minigra_lub_feature: false
  liczba_wpisow: 27
  sekcje:
  - etykieta: starthere
    wpisy:
    - id: sol_8b7e4944e182215dbb91
      kontekst: textscripts.zimmerhouse_beast:line:9
      linia: 9
      sekcja_skryptu: starthere
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: This creature is built more-or-less like a large muscular person -- if you built a large muscular person out of some kind of writhing
        black ooze and/or smoke and/or just plain raw darkness.
      pl: Budową to stworzenie z grubsza przypomina wielką, umięśnioną osobę — o ile wielką, umięśnioną osobę zbudować z wijącej się czarnej mazi
        i/lub dymu, i/lub po prostu surowej ciemności.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_c9cc2439b61f8acc3c58
      kontekst: textscripts.zimmerhouse_beast:line:10
      linia: 10
      sekcja_skryptu: starthere
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: It has a fist-sized glowing crystal embedded in its chest, about where its sternum would be, and as you draw near you can feel it radiating
        invisible waves of energy -- kind of like heat coming off of a radiator, except also the opposite of that, and also not at all related
        to that. Look, incomprehensible forces are tricky to describe, okay?
      pl: W klatce piersiowej, mniej więcej tam, gdzie znajdowałby się mostek, tkwi świecący kryształ wielkości pięści. Gdy się zbliżasz, czujesz
        bijące od niego niewidzialne fale energii — trochę jak ciepło od kaloryfera, tylko że również dokładnie odwrotnie i zarazem zupełnie bez
        związku z kaloryferem. Słuchaj, niepojęte siły trudno się opisuje, dobrze?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_eea609871c560bed18b1
      kontekst: textscripts.zimmerhouse_beast:line:11
      linia: 11
      sekcja_skryptu: starthere
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The creature shambles back and forth, waving its arms in a way that almost looks like it's dancing, or praying, or maybe just absent-mindedly
        flailing. It seems oblivious to your presence, although that will probably change pretty quickly if you try to interfere with it.
      pl: Stworzenie szura tam i z powrotem, wymachując rękami w sposób przypominający taniec, modlitwę albo zwyczajne bezmyślne machanie. Najwyraźniej
        nie zauważa twojej obecności, choć to pewnie szybko się zmieni, jeśli spróbujesz mu przeszkodzić.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_1f12c00e085f13203171
      kontekst: textscripts.zimmerhouse_beast:line:12
      linia: 12
      sekcja_skryptu: starthere
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Like say, if you tried to pry the glowing crystal out of its chest.
      pl: Na przykład próbując wyrwać świecący kryształ z jego piersi.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_707d42097f8277116edd
      kontekst: textscripts.zimmerhouse_beast:line:13
      linia: 13
      sekcja_skryptu: starthere
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Size it up
      pl: Oceń przeciwnika
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: return
    wpisy:
    - id: sol_c1319230cd01dd028026
      kontekst: textscripts.zimmerhouse_beast:line:17
      linia: 17
      sekcja_skryptu: return
      typ: say
