      linia: 6
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The dinner meal is on the table.
      pl: Na stole stoi danie obiadowe.
      status: do_korekty
