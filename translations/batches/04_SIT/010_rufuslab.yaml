      pl: Kurczę
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_0effb2a68c55dd078070
      kontekst: textscripts.sit_rufus_arcanehotplate:line:18
      linia: 18
      sekcja_skryptu: take
      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: Sure, I've got plenty, and having access to that level of technology will increase the odds that you'll survive helping me.
      pl: Jasne, mam ich dużo, a dostęp do takiej technologii zwiększy prawdopodobieństwo, że przeżyjesz pomaganie mi.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_3eede8df5d0d9b4df83c
      kontekst: textscripts.sit_rufus_arcanehotplate:line:19
      linia: 19
      sekcja_skryptu: take
      typ: leftspeak
      mowca_lub_kanal: postac_po_lewej
