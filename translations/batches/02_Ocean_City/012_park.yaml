      pl: Hm? Och, eee — wybacz, @p|fella,miss,pal@, nie chcę być niegrzeczny, ale jestem o wiele za bardzo zajęty na pogawędki. Prowadzę to miejsce zupełnie sam, a roboty jest z milion rzeczy.
