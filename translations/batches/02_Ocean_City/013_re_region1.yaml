      en: You shake the old soda can until the ball starts to rattle, then pop the tab and hurl it at the fishmen. It explodes in a spray of sweet
        carbonated water -- which they like -- and glittering aluminum shrapnel -- which they don't. The confluence of these two conflicting emotions
        confuses them plenty enough for you to make your escape.
      pl: Potrząsasz starą puszką po napoju, aż kulka zaczyna grzechotać, po czym odrywasz zawleczkę i rzucasz nią w ryboludzi. Wybucha bryzgiem słodkiej, gazowanej wody — co im się podoba — i błyszczącym aluminiowym odłamkami — co im się nie podoba. Zbieg tych dwóch sprzecznych emocji dostatecznie ich dezorientuje, żebyś mógł uciec.
