      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_0a9e855c062bad9363be
      kontekst: textscripts.re_region1_companion_gabby_levelup:line:7
      linia: 7
      sekcja_skryptu: start
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: That explains the car and lamppost, but why are they still here? And what's with all this other junk?
      pl: To tłumaczy samochód i latarnię, ale czemu one tu nadal są? I co z całą resztą tych śmieci?
