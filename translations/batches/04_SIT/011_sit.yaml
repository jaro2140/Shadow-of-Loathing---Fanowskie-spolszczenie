      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: As you enter the library, an elderly man -- presumably the librarian -- waves you over to his desk.
      pl: Gdy wchodzisz do biblioteki, starszy mężczyzna — zapewne bibliotekarz — przywołuje cię do biurka.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_c177e6bf72ed717c3910
      kontekst: textscripts.sit_libraryenter:line:5
      linia: 5
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Hello, I'm afraid I don't recognize you. Are you a student here?
      pl: Dzień dobry. Obawiam się, że cię nie poznaję. Studiujesz tutaj?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_0a145994976d0ba076a1
