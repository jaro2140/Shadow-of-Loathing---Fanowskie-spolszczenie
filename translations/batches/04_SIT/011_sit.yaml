      linia: 120
      sekcja_skryptu: jbew
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: What you're doing is <i>suspicious</i>, Wormwood. I know about the Black Fire Incident that killed Jeffy, and I think it's connected
        to the weird shadow stuff that's going on, and I want answers. And with all the bus trips I had to make between here and the newspaper
        office to look up all this stuff, I think I'm owed some!
      pl: To, co robisz, jest <i>podejrzane</i>, Wormwood. Wiem o Incydencie Czarnego Ognia, w którym zginął Jeffy, i myślę, że ma związek z dziwną
        sprawą Cienia. Żądam odpowiedzi. Po tych wszystkich podróżach autobusem między kampusem a redakcją gazety chyba mi się należą!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
