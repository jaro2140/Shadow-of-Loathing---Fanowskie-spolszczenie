      linia: 121
      sekcja_skryptu: funeral
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: I'm sorry, I hardly think I'd be able to tell you much about one from so long ago.
      pl: Wybacz, ale wątpię, bym pamiętał wiele o pogrzebie sprzed tak dawna.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
