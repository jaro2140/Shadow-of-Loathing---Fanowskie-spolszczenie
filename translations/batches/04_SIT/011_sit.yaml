      linia: 68
      sekcja_skryptu: major2
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Well, I don't know how they've arranged the courses this semester, so I can only give you general advice. Mainly, just experiment! Different
        robot parts are effective at overcoming different obstacles, and many obstacles can be overcome in more than one way. Just try a variety
        of things, and I'm sure you'll figure it out.
      pl: Nie wiem, jak ułożyli zajęcia w tym semestrze, więc mogę dać tylko ogólne rady. Przede wszystkim eksperymentuj! Różne części robotów
        nadają się do różnych przeszkód, a wiele przeszkód da się pokonać na więcej niż jeden sposób. Próbuj rozmaitych rzeczy, a na pewno sobie
        poradzisz.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
