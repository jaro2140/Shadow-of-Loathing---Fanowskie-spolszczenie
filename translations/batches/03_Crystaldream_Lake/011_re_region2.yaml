    - id: sol_24ecda0a5d887e9fccd3
      kontekst: textscripts.re_region2_salesman1:line:19
      linia: 19
      sekcja_skryptu: buy
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You drop your Meat into the slot and turn the crank. The door pops open, granting access to your prize, such as it is. It's a shame
        the war prompted the big soda companies to start putting their drinks in cheap tin cans instead of the nice glass bottles they used to
        use -- they tasted much better that way.
      pl: Wrzucasz swoje Mięso do szczeliny i przekręcasz korbkę. Drzwiczki się otwierają, dając dostęp do twojej nagrody, takiej, jaka jest. Szkoda, że wojna skłoniła wielkie firmy od napojów gazowanych, żeby zaczęły wlewać swoje napoje do tanich puszek zamiast porządnych szklanych butelek, których kiedyś używały -- smakowały w nich dużo lepiej.
      status: do_korekty
