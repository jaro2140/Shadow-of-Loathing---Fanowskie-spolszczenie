      linia: 6
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Oh! Gabby has a memory of it! There was an accident a coupling of weeks ago -- that car had a tire break and smashed on the lamppost!
      pl: O! Gabby to pamięta! Był wypadek parę tygodni temu — temu samochodowi pękła opona i rozbił się o latarnię!
