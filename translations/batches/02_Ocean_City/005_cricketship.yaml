      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: <i>You will know. There will be a climactic event -- what you might call a Final Boss -- and at that time there will be a machine that
        you will need to destroy, to prevent the destruction of Earth.</i>
      pl: <i>Będziesz wiedzieć. Nastąpi kulminacyjne wydarzenie — coś, co możesz nazwać Finałowym Bossem — i pojawi się maszyna, którą trzeba
        zniszczyć, aby zapobiec zagładzie Ziemi.</i>
