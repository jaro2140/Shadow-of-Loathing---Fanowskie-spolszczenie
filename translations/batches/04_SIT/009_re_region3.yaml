      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: This must be S.I.T.'s math department. You can tell, because there's a bunch of loose math flying around, making a ruckus. And I mean
        a <i>physical</i> ruckus, not the sort of ruckus you get when someone tries to argue that .999 repeating doesn't equal 1.
      pl: To musi być wydział matematyki S.I.T. Poznajesz po tym, że lata tu naokoło mnóstwo luźnej matematyki, robiąc raban. I mam na myśli <i>fizyczny</i>
        raban, nie taki raban, jaki powstaje, gdy ktoś próbuje twierdzić, że 0,999 okresowe nie równa się 1.
      status: do_korekty
