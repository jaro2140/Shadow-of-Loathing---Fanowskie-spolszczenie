  sekcje:
  - etykieta: start
    wpisy:
    - id: sol_163dff4c186ca6eed3db
      kontekst: textscripts.re_region3_shadowcompass1:line:3
      linia: 3
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: 'The cursed compass'' needle wriggles into action, jabbing directions violently: south, north, southnorth. You arrive after a minute
        at a small bridge between campuses. After another minute, you realize the compass is telling you to look <i>under</i> the bridge.'
      pl: 'Igła przeklętego kompasu wije się w akcji, gwałtownie wskazując kierunki: południe, północ, południopółnoc. Po minucie docierasz do
        małego mostu między kampusami. Po kolejnej minucie zdajesz sobie sprawę, że kompas każe ci spojrzeć <i>pod</i> most.'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
