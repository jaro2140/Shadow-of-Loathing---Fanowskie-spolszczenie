    - id: sol_1b1ad855bb3306f35a00
      kontekst: textscripts.sit_librarian1:line:219
      linia: 219
      sekcja_skryptu: elective2
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: I do a fair amount of cooking, and rather well if you'll excuse me saying so myself. But I've never used S.I.T.'s classroom kitchen
        -- I understand it's rather more extreme than usual.
      pl: Sporo gotuję i — wybacz brak skromności — całkiem dobrze. Nigdy jednak nie korzystałem z kuchni dydaktycznej S.I.T. Podobno jest znacznie
        bardziej ekstremalna niż zwykle.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_d9a4f62d437361fe2413
      kontekst: textscripts.sit_librarian1:line:220
      linia: 220
      sekcja_skryptu: elective2
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: If you require protection from the elements, I would suggest that a fire -- such as the barrels that hoboes use to warm themselves --
        might prove a reliable source of protection against the cold. And the furniture found in some of our more disorderly fraternities would
        certainly inure you to stench.
      pl: Jeśli potrzebujesz ochrony przed żywiołami, ogień — choćby w beczkach, przy których ogrzewają się włóczędzy — może zapewnić odporność
        na zimno. A meble z bardziej nieporządnych bractw z pewnością uodpornią cię na smród.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
