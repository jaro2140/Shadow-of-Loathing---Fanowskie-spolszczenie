    - id: sol_edb28216cf0b2286cd3c
      kontekst: textscripts.boardwalk_mobquest:line:17
      linia: 17
      sekcja_skryptu: two
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You hand Don Toblerone the Baron's gold fang, and he examines it briefly before tucking it away in his jacket pocket.
      pl: Wręczasz Donowi Toblerone złoty kieł barona. Ogląda go krótko, po czym chowa do kieszeni marynarki.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_4eea6206c00d5abd2da1
      kontekst: textscripts.boardwalk_mobquest:line:19
      linia: 19
      sekcja_skryptu: two
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: He snaps his fingers, and the two goons pat their pockets, becoming more and more flustered, until finally one of them finds what he's
        looking for and hands it to Don Toblerone with a relieved sigh.
      pl: Pstryka palcami, a obaj oprychowie przeszukują kieszenie, coraz bardziej spanikowani. W końcu jeden znajduje właściwy przedmiot i z westchnieniem ulgi podaje go Donowi Toblerone.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_bdb4aece3657cfa1d3f1
      kontekst: textscripts.boardwalk_mobquest:line:20
      linia: 20
      sekcja_skryptu: two
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: 'Don looks at them askance, then rolls his eyes and hands you the object: a small black velvet ring box, which proves to contain a gold
        signet ring. The crest on it appears to be a silhouette of a penguin.'
      pl: 'Don spogląda na nich z ukosa, przewraca oczami i podaje ci przedmiot: małe pudełeczko z czarnego aksamitu, zawierające złoty sygnet.
        Herb przedstawia chyba sylwetkę pingwina.'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
