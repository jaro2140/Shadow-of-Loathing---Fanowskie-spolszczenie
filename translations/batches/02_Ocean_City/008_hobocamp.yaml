      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: It <i>is</i> nice. I do enjoy the rain, but I also enjoy dry clothing.
      pl: <i>Rzeczywiście</i> dobrze. Lubię deszcz, ale lubię też suche ubrania.
