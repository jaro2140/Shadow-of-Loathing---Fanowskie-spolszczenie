  - etykieta: read
    wpisy:
    - id: sol_7f33794c407a5f5adcaa
      kontekst: textscripts.sitwest_geologysign1:line:11
      linia: 11
      sekcja_skryptu: read
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: \"One of the main projects of S.I.T.'s Geology department is the study of hypercrystalline thaumomorphic diorites, known to the layman
        as 'hexrock.' Hexrock has many fascinating properties."
      pl: \"Jednym z głównych projektów Wydziału Geologii S.I.T. jest badanie hiperkryształowych diorytów taumomorficznych, znanych laikom jako
        „heksokamienie”. Heksokamień ma wiele fascynujących właściwości."
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_09f7779d00c90cce5a32
      kontekst: textscripts.sitwest_geologysign1:line:12
      linia: 12
      sekcja_skryptu: read
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: \"For more information, continue to the right and read the rest of the plinths."
      pl: \"Aby uzyskać więcej informacji, przejdź w prawo i przeczytaj pozostałe cokoły."
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
