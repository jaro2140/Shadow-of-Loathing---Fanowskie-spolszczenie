  - etykieta: tribute1
    wpisy:
    - id: sol_29ddafcfb1f67436eda0
      kontekst: textscripts.re_region1_tinlizzytribute:line:15
      linia: 15
      sekcja_skryptu: tribute1
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: We got the proceeds from the last shipment of "found" parts we sold. After overhead and taxes an' all, this is your cut.
      pl: Otrzymaliśmy wpływy z ostatniej dostawy „znalezionych” części, które sprzedaliśmy. Po odliczeniu kosztów i podatków i tak dalej, to twoja działka.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_6abcae2b92a29b6cdb14
      kontekst: textscripts.re_region1_tinlizzytribute:line:18
      linia: 18
      sekcja_skryptu: tribute1
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: You pay taxes? I mean, we. We pay taxes?
      pl: Płacicie podatki? To znaczy, my. Płacimy podatki?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_ba2b86ee82e0f21a755b
      kontekst: textscripts.re_region1_tinlizzytribute:line:19
      linia: 19
      sekcja_skryptu: tribute1
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Gotta keep up appearances. Don't want the Feds breathing down our necks, right?
      pl: Trzeba dbać o pozory. Nie chcemy, żeby federalni dyszeli nam w kark, prawda?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_d300968889544baff6eb
      kontekst: textscripts.re_region1_tinlizzytribute:line:20
      linia: 20
      sekcja_skryptu: tribute1
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Okay yeah, that sounds pretty gross.
      pl: Dobra, ta, brzmi to dość obrzydliwie.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_c1ecb24dc540369c22a7
      kontekst: textscripts.re_region1_tinlizzytribute:line:23
      linia: 23
      sekcja_skryptu: tribute1
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: All right, thanks.
      pl: No dobra, dzięki.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: tribute2
    wpisy:
    - id: sol_89de096f237c146828d5
      kontekst: textscripts.re_region1_tinlizzytribute:line:28
      linia: 28
      sekcja_skryptu: tribute2
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: We just sent out another shipment of spare parts. There were some leftovers that weren't quite up to our standards of unrustedness and
        no-cracks-having, but we thought you might be able to use them for... whatever it is that you use this stuff for.
      pl: Właśnie wysłaliśmy kolejną dostawę części zamiennych. Zostało kilka sztuk, które nie spełniały całkiem naszych standardów braku rdzy
        i braku pęknięć, ale pomyśleliśmy, że może przydałyby ci się do... czegokolwiek tam używasz tych rzeczy.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_41e175d5ae6df5c30020
      kontekst: textscripts.re_region1_tinlizzytribute:line:30
      linia: 30
      sekcja_skryptu: tribute2
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: Neat! Thanks!
      pl: Super! Dzięki!
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: tribute3
    wpisy:
    - id: sol_61af43a8821e8f07dbd8
      kontekst: textscripts.re_region1_tinlizzytribute:line:35
      linia: 35
      sekcja_skryptu: tribute3
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Nothing in particular, I just happened to see you and thought I'd say hey. Go get 'em, great job, keep it up! That sort of thing.
      pl: Nic konkretnego, po prostu cię zobaczyłam i pomyślałam, że się przywitam. Dawaj im popalić, świetna robota, tak trzymaj! Coś w tym stylu.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_967fdee2a6cb70bc5cee
      kontekst: textscripts.re_region1_tinlizzytribute:line:36
      linia: 36
      sekcja_skryptu: tribute3
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Gosh!
      pl: Ojej!
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_aaa5ab3d86a7a015a87d
      kontekst: textscripts.re_region1_tinlizzytribute:line:37
      linia: 37
      sekcja_skryptu: tribute3
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: I literally have zero idea what it is you're doing, though.
      pl: Dosłownie nie mam pojęcia, co ty właściwie robisz.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_fd8312a3022aea5bce9b
      kontekst: textscripts.re_region1_tinlizzytribute:line:38
      linia: 38
      sekcja_skryptu: tribute3
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Well, me neither, but it hasn't stopped me.
      pl: No, ja też nie, ale to mnie nie powstrzymało.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_685e5fef28acbde21d01
      kontekst: textscripts.re_region1_tinlizzytribute:line:39
      linia: 39
      sekcja_skryptu: tribute3
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: You're an inspiration to us all.
      pl: Jesteś inspiracją dla nas wszystkich.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_997c78b93c8019f68a48
      kontekst: textscripts.re_region1_tinlizzytribute:line:41
      linia: 41
      sekcja_skryptu: tribute3
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: Thanks!
      pl: Dzięki!
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 67
      tokeny_techniczne: []
      zagadka: false
