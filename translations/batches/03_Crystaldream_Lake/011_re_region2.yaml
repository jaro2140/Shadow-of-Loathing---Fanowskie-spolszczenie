      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You have about three seconds before they figure a way out of their Laurel & Hardy-esque predicament.
      pl: Masz jakieś trzy sekundy, zanim wykombinują, jak wydostać się z tej sytuacji rodem z Flipa i Flapa.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
