      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: I'm sure you do think it's important, Doc, but you know how it looks to me? It looks like a crazed old man is up to some bad occult
        stuff, while outside there's a whole lotta weird shadowy goings-on that are <i>very</i> reminiscent of the Black Fire Incident that killed
        someone in this same old man's office a hundred and twenty years ago.
      pl: Na pewno uważasz to za ważne, doktorku, ale wiesz, jak to wygląda? Jakby szalony staruszek odprawiał jakieś paskudne okultystyczne rytuały,
        podczas gdy na zewnątrz dzieją się dziwne rzeczy związane z Cieniem, <i>bardzo</i> podobne do Incydentu Czarnego Ognia, który 120 lat
        temu zabił kogoś w gabinecie tego samego staruszka.
