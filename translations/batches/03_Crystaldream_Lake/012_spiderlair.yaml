      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: It is the opinion of the Crystaldream Lake Historical Society that Beppo's Hole should be avoided at all costs.  In fact, we probably
        shouldn't have put this placard here, or included it on any of our maps.  May those you leave behind forgive us.
      pl: Towarzystwo Historyczne Jeziora Kryształowych Snów stoi na stanowisku, że Dziury Beppa należy unikać za wszelką cenę. Właściwie to nie powinniśmy byli stawiać tej tablicy ani umieszczać jej na żadnej z map. Niech wybaczą nam ci, których po sobie zostawisz.
      status: do_korekty
