      kontekst: textscripts.sit_rufus_arcanehotplate:line:14
      linia: 14
      sekcja_skryptu: take
      typ: leftspeak
      mowca_lub_kanal: postac_po_lewej
      en: Because... charity begins at... the lab?
      pl: Bo... dobroczynność zaczyna się w domu... albo w laboratorium?
