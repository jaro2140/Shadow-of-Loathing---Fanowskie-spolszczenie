      linia: 46
      sekcja_skryptu: four
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Sure. In fact, there's something I think you might be able to help me with.
      pl: Jasne. Właściwie jest coś, w czym może mi pan pomóc.
