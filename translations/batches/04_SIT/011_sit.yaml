      sekcja_skryptu: cowbook3
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: There's a description of a ritual to summon him, which involves standing in a circle drawn with chalk mixed with virgin blood, burning
        a beef-tallow candle, scattering cowsbane, and reciting a complex incantation (which you dutifully copy down, just in case).  It also
        notes that regularly reciting the incantation backward serves as a charm to prevent Bovicus from finding you, if you're worried about
        that for some reason.
      pl: Opisano tu rytuał przywołania go — należy stanąć w kręgu narysowanym kredą zmieszaną z krwią dziewicy, zapalić świecę z wołowego łoju,
        rozsypać krowojad i wypowiedzieć złożoną inkantację, którą na wszelki wypadek sumiennie przepisujesz. Książka dodaje, że regularne recytowanie
        inkantacji od tyłu działa jak zaklęcie uniemożliwiające Bovicusowi odnalezienie cię, jeśli z jakiegoś powodu budzi to obawy.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi:
      - '[DO PÓŹNIEJSZEJ WERYFIKACJI] Roślinę „cowsbane” przełożono żartobliwie jako „krowojad”; sprawdzić nazwę odpowiadającego przedmiotu lub
        składnika.'
