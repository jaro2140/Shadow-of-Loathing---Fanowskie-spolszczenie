      linia: 166
      sekcja_skryptu: intro4
      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: Man, I'd kill for a jellied eel. Noël brings these sandwiches that are just a bunch of peppermint sticks between two big bland sugar
        cookies. You can get a stomachache just watching someone <i>else</i> eat one. Blech.
      pl: Za galaretowatego węgorza dałbym się zabić. Noël przynosi kanapki złożone z garści lasek miętowych wsadzonych między dwa wielkie, mdłe
        ciastka cukrowe. Można dostać bólu brzucha od samego patrzenia, jak ktoś <i>inny</i> je taką kanapkę. Ble.
