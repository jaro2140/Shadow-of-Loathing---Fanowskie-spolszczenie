  sekcje:
  - etykieta: start
    wpisy:
    - id: sol_79e27ea048706cc2ac33
      kontekst: textscripts.re_region1_fight_shadowadd4:line:4
      linia: 4
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Your route through the city takes you past a small park. The park doesn't have any people in it, probably because what it <i>does</i>
        have in it is a big black bell and a bunch of cows. Well, the shadows of cows. Although that implies the existence of cows that are casting
        the shadows, so I guess they're just shadows <i>shaped like</i> cows? For some reason?
      pl: Twoja trasa przez miasto prowadzi cię obok małego parku. W parku nie ma nikogo, pewnie dlatego, że <i>faktycznie</i> jest w nim wielki
        czarny dzwon i grupa krów. No, cieni krów. Choć to sugerowałoby istnienie krów, które rzucają te cienie, więc chyba to po prostu cienie
        <i>w kształcie</i> krów? Z jakiegoś powodu?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: true
      uwagi: []
    - id: sol_a358e6702c3618e330c7
      kontekst: textscripts.re_region1_fight_shadowadd4:line:5
      linia: 5
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Isn't that a little weird? I mean, it makes sense to a degree, since the time The Cows Came Home was a pretty dark day in the history
        of humanity, and even before then people told tales of evil cows that grazed the fiery pastures of Hell. But they only Came Home a little
        over forty years ago. You'd think, if some dark alien entity wanted to tap into the primal fears of humanity's collective unconscious,
        it would reach back a little farther than that.
      pl: Czyż to nie trochę dziwne? To znaczy, ma to pewien sens, bo czas, kiedy Krowy Wróciły Do Domu, był dość mrocznym dniem w historii ludzkości,
        a nawet wcześniej ludzie opowiadali historie o złych krowach pasących się na ognistych pastwiskach Piekła. Ale Wróciły Do Domu ledwie
        jakieś czterdzieści lat temu. Można by pomyśleć, że jeśli jakaś mroczna, obca istota chciała sięgnąć do pierwotnych lęków zbiorowej podświadomości
        ludzkości, sięgnęłaby nieco dalej wstecz.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: true
      uwagi: []
