    - id: sol_2346eb3f1d205c451ece
      kontekst: textscripts.sit_library_stacksboss:line:22
      linia: 22
      sekcja_skryptu: intro
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Wha? What do you want? Can't you see I'm busy!
      pl: Co? Czego chcesz? Nie widzisz, że jestem zajęty?!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
