      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: Man, I'd kill for a jellied eel. Nah, it's old Cola War MREs. More like MCWDWEs, if you ask me.
      pl: Za galaretowatego węgorza dałbym się zabić. Nie, to stare racje polowe z Wojen Coli. Raczej BRTN-y, jeśli mam być szczery.
