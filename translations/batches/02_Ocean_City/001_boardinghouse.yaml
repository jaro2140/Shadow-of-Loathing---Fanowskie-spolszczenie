      linia: 13
      sekcja_skryptu: e
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: There's some invasive mana-lichen growing at the base of the flowers.  You scrape it off.
      pl: U podstawy kwiatów rośnie trochę inwazyjnego porostu manowego. Zeskrobujesz go.
