      linia: 12
      sekcja_skryptu: two
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: That is Poison Ivy, don't-- you've already eaten it. Why would you <i>do</i> that?
      pl: To Bluszcz Trujący, nie-- już go zjadłeś. Czemu <i>to</i> zrobiłeś?
