      linia: 58
      sekcja_skryptu: who
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: <i>Our story is long and complicated, so I will spare you most of the details. What is relevant to you is that we have the power to
        send our minds through time and space, and in doing so we have forseen our demise.</i>
      pl: <i>Nasza historia jest długa i skomplikowana, więc oszczędzę ci większości szczegółów. Dla ciebie istotne jest to, że potrafimy wysyłać
        umysły przez czas i przestrzeń, dzięki czemu przewidzieliśmy własną zagładę.</i>
