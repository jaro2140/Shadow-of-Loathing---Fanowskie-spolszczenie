      sekcja_skryptu: right
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The strange men look somewhat mollified. They hold a short, whispered conference, and then one of them nods to you.
      pl: Dziwni mężczyźni wyglądają na nieco udobruchanych. Odbywają krótką, szeptaną naradę, po czym jeden z nich kiwa ci głową.
