      uwagi: []
  - etykieta: fight2
    wpisy:
    - id: sol_e6b74146fdd6d095e626
      kontekst: textscripts.dam_guardblocker:line:79
      linia: 79
      sekcja_skryptu: fight2
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Well, the first reason is that he seems like a pretty decent guy.
      pl: 'Pierwszy powód: wydaje się całkiem porządnym facetem.'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: sol_95565a9a2a145ae93109
      kontekst: textscripts.dam_guardblocker:line:80
      linia: 80
      sekcja_skryptu: fight2
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: And the second reason is that while you've been doing whatever it is you've been doing with your life, he's been swinging iron beams
        around, driving posts into the ground with sledgehammers, lugging sacks of concrete, and stuff like that.
      pl: 'A drugi: kiedy ty zajmujesz się tym, czym zajmujesz się w życiu, on wymachuje żelaznymi belkami, wbija młotami słupy w ziemię, nosi
        worki cementu i robi inne takie rzeczy.'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: sol_c6e75b425368842f60db
      kontekst: textscripts.dam_guardblocker:line:81
      linia: 81
      sekcja_skryptu: fight2
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: So?
      pl: No i?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
  - etykieta: fight3
    wpisy:
    - id: sol_e984991b3572c5547d14
      kontekst: textscripts.dam_guardblocker:line:84
      linia: 84
      sekcja_skryptu: fight3
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: So he could probably crush you into a paste with a single finger.
      pl: Mógłby cię pewnie jednym palcem rozgnieść na miazgę.
