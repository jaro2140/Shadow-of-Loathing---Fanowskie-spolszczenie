      sekcja_skryptu: askcompass
      typ: leftspeak
      mowca_lub_kanal: postac_po_lewej
      en: But...
      pl: Ale...
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
