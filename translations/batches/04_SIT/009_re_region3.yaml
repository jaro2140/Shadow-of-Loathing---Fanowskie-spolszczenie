      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You decide to take a shortcut down an alley between two buildings... er, as opposed to any other kind of alley, I guess... but find
        your path blocked by an open manhole spewing thick greenish-brown steam. It smells about like you'd expect.
      pl: Postanawiasz skrócić sobie drogę przez alejkę między dwoma budynkami... eee, w przeciwieństwie do jakiegokolwiek innego rodzaju alejki,
        jak sądzę... ale znajdujesz drogę zablokowaną przez otwarty właz, z którego bucha gęsta, zielonkawo-brązowa para. Pachnie mniej więcej
        tak, jak można by się spodziewać.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
