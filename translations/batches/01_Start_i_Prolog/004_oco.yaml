      sekcja_skryptu: moving
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Ayep. I finished packin', so now I'm just waitin' for the movers to come and take this last load of stuff.
      pl: Ano. Pakowanie skończone, czekam tylko na ekipę, która zabierze ostatnie rzeczy.
