      sekcja_skryptu: popup
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You've already translated this code.  It says $message$
      pl: 'Ten kod już przetłumaczyłeś. Brzmi: $message$'
