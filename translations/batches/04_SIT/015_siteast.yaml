  - etykieta: best
    wpisy:
    - id: sol_7cb312bf8214a4761609
      kontekst: textscripts.siteast_cookingstation5:line:51
      linia: 51
      sekcja_skryptu: best
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You fish around in the cupboard some more, and find a bottle of fresh cream and a flask of liquid nitrogen. With the addition of a vanilla
        bean and some legitimate culinary science, you produce a bowl of the freshest, smoothest ice cream imaginable, and garnish it with curls
        of shaved chocolate and an artistic drizzle of strawberry purée. Then a light dusting of cinnamon and some coarse-grained sugar to add
        sparkle, and crown it with a fresh, ruby-red cherry on top.
      pl: Grzebiesz dalej w szafce i znajdujesz butelkę świeżej śmietanki oraz kolbę ciekłego azotu. Z dodatkiem laski wanilii i odrobiny prawdziwej
        nauki kulinarnej tworzysz miskę najświeższych, najgładszych lodów, jakie można sobie wyobrazić, po czym przybierasz je wiórkami czekolady
        i artystyczną strużką truskawkowego purée. Jeszcze lekka warstwa cynamonu i gruboziarnistego cukru dla blasku, a na sam szczyt świeża,
        rubinowoczerwona wisienka.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
