      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Hmph. One thing this school has always excelled in is training know-it-alls. Well, you may have done your home- work, but you've gotten
        one very important thing wrong.
      pl: Hmf. Ta szkoła zawsze celowała w kształceniu przemądrzalców. No cóż, odrabiasz pracę domową, ale mylisz się w jednej bardzo ważnej sprawie.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
