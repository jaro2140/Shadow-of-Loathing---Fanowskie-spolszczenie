      linia: 20
      sekcja_skryptu: intro
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Um, excuse me...
      pl: Eee, przepraszam...
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
