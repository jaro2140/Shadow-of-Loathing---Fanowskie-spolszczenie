    - id: sol_f0c6300da0eacdba05c3
      kontekst: textscripts.lighthouse_keeper_stage2:line:59
      linia: 59
      sekcja_skryptu: askthree
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Here, maybe this'll help you -- most've the old compasses got radium paint on the dials so you can read 'em at night. This ol' geiger
        counter oughta be able to pick up the radiation from that.
      pl: Może to pomoże — większość starych kompasów miała na tarczach farbę radową, żeby można je było odczytać nocą. Ten stary licznik Geigera
