    - id: sol_f6160ca66cfec6717f47
      kontekst: textscripts.sitwest_geologysign2:line:11
      linia: 11
      sekcja_skryptu: read
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: \"Like other diorites, the specific mineral composition and configuration of hexrock varies from sample to sample. Some of these configurations
        have been observed to violate the known laws of physics, such as gravity (see display). Other configurations have been observed to violate
        the known laws of this state, such as aggravated assault (sample not available for safety reasons)."
      pl: \"Podobnie jak w innych diorytach, dokładny skład i układ minerałów w heksokamieniu różnią się w zależności od próbki. Zaobserwowano,
        że niektóre układy naruszają znane prawa fizyki, takie jak grawitacja (patrz eksponat). Inne naruszają znane prawa tego stanu, na przykład
        dopuszczając się napaści z użyciem niebezpiecznego narzędzia (próbka niedostępna ze względów bezpieczeństwa)."
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
