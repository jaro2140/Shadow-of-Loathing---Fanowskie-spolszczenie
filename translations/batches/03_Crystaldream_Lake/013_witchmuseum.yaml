      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_77096f5ebeafc757b35a
      kontekst: textscripts.witchmuseum_mayor:line:30
      linia: 30
      sekcja_skryptu: hub
      typ: sayoption_once
      mowca_lub_kanal: opcja_gracza
      en: Do you know anything about witchcraft?
      pl: Wiesz coś o czarach?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_96e8ed56bc2147f3a3cb
      kontekst: textscripts.witchmuseum_mayor:line:31
      linia: 31
      sekcja_skryptu: hub
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: Thanks, talk to you later.
      pl: Dzięki. Porozmawiamy później.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
