      sekcja_skryptu: two
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Wellll, I'ma have to check my schedule...
      pl: No cóż, muszę sprawdzić swój grafik...
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_5a3a35d462358a7e9d38
      kontekst: textscripts.re_region3_companion_obie_levelup:line:20
      linia: 20
      sekcja_skryptu: two
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: All you have to do is phone me if you get any side-effects. I have the shot right here, and I'll pay you fifty Meat.
      pl: Wszystko, co musisz zrobić, to zadzwonić do mnie, jeśli wystąpią jakieś skutki uboczne. Mam tu zastrzyk i zapłacę ci pięćdziesiąt Mięsa.
