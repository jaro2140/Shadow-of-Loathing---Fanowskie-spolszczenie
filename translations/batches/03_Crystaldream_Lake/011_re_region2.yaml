  skrypt: re_region2_deliakey
  pomieszczenie: null
  zagadka: false
  minigra_lub_feature: false
  liczba_wpisow: 7
  sekcje:
  - etykieta: start
    wpisy:
    - id: sol_cf41cc71331740e3e6c9
      kontekst: textscripts.re_region2_deliakey:line:5
      linia: 5
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You spend some time poking around in the woods near Sandwich Village with Rufus' metal detector, and unearth a nearly-impressive pile
        of trash before finally finding what you hope is Delia's house key.
      pl: Spędzasz trochę czasu, szukając w lasach koło Wioski Sandwich za pomocą wykrywacza metalu Rufusa, i wykopujesz niemal imponującą stertę śmieci, zanim w końcu znajdujesz co — jak masz nadzieję — jest kluczem do domu Delii.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
