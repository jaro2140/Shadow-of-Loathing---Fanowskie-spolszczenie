    - id: sol_995e393acece7afac35f
      kontekst: textscripts.sit_rufus_arcanehotplate:line:13
      linia: 13
      sekcja_skryptu: take
      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: Why would I give you, a complete stranger, a very expensive piece of technology?
