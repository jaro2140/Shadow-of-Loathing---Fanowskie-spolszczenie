    - id: sol_a07c0d162811ae8c8950
      kontekst: textscripts.sit_library_stacksboss:line:23
      linia: 23
      sekcja_skryptu: intro
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Well, it's just that I'm looking for a certain book, and I'll be frankly amazed if it isn't the one you've got on that pedestal there.
      pl: Chodzi o to, że szukam pewnej książki i szczerze się zdziwię, jeśli to nie ta na postumencie.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_3f877bcb44da81c59027
      kontekst: textscripts.sit_library_stacksboss:line:24
      linia: 24
      sekcja_skryptu: intro
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
