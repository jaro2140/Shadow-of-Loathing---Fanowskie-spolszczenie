    - id: sol_be4eac3f44eddd8f39ad
      kontekst: textscripts.botanyprof_bossdown:line:27
      linia: 27
      sekcja_skryptu: signo
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Hmm. Well, a signature written with the professor's pen should be just as good as if it was signed by the professor himself, right?
        Nobody could possibly dispute that. You sign your transcript with a reasonable approximation of the signature on his ID.
      pl: Hm. Podpis złożony piórem profesora powinien być równie dobry jak podpis samego profesora, prawda? Nikt nie zdoła tego podważyć. Podpisujesz wykaz zaliczeń rozsądną imitacją podpisu z legitymacji.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_72ba73afd238250d0b71
