      kontekst: textscripts.re_region2_companion_simone_levelup:line:5
      linia: 5
      sekcja_skryptu: start
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: Sure. Think you can hit that tree over there?
      pl: Jasne. Myślisz, że trafisz w tamto drzewo?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
