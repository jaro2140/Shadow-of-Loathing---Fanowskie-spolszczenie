      linia: 57
      sekcja_skryptu: tellcamp
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: I wouldn't expect a woman who owns her own still to have issues with self-confidence.
      pl: Nie spodziewałbym się problemów z pewnością siebie u kobiety, która ma własny aparat destylacyjny.
