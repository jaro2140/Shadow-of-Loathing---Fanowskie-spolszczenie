      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: This time, as he's taking out his notebook, a little paper envelope falls out of his pocket.
      pl: Tym razem, gdy wyciąga notes, z kieszeni wypada mu mała papierowa koperta.
      status: do_korekty
      wspoldzielony_rekord: false
