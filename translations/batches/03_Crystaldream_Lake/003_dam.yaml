      kontekst: textscripts.dam_guardblocker:line:87
      linia: 87
      sekcja_skryptu: fight3
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: I'm not scared. Bring it on! [fight]
      pl: Nie boję się. Dawaj! [walka]
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
