      sekcja_skryptu: popup
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: If the label is to be believed, this is a crate of arcane hot plates.
      pl: Jeśli wierzyć etykiecie, to skrzynia magicznych płyt grzejnych.
