      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Gabby points out an elaborate contraption nearby. It takes you a second to recognize it, but it turns out to be a Meat-operated soda
        cooler, which some enterprising S.I.T. student has modified with robot arms, a receipt printer, and a light-up panel of statistical information.
        Plus it has a cable running out of it into a nearby payphone for some reason.
      pl: Gabby wskazuje na wymyślną konstrukcję w pobliżu. Zajmuje ci chwilę, żeby ją rozpoznać, ale okazuje się to być chłodziarką na napoje
        zasilaną Mięsem, którą jakiś przedsiębiorczy student S.I.T. zmodyfikował robotycznymi ramionami, drukarką paragonów i świecącym panelem
        informacji statystycznych. Poza tym z jakiegoś powodu wychodzi z niej kabel prowadzący do pobliskiego automatu telefonicznego.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
