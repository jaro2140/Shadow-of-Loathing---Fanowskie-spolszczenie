      linia: 114
      sekcja_skryptu: jbrag
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Hmph. Don't go thinking you can intimidate me! You may have done your homework, but you've gotten one very important point wrong.
      pl: Hmf. Nie myśl, że mnie zastraszysz! Odrabiasz pracę domową, ale jeden bardzo ważny punkt jest błędny.
      status: do_korekty
      wspoldzielony_rekord: false
