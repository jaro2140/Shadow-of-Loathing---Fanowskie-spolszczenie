      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You turn and head in another direction, and soon find yourself stopped by another big spiderweb. So you turn around and try another
        direction -- nope, that path ends in a big spiderweb as well. Looks like the attention-paying part of you wasn't paying enough of it to
        keep you from getting lost in a huge spiderweb maze.
      pl: Odwracasz się i idziesz w innym kierunku, po czym wkrótce zatrzymuje cię kolejna wielka pajęczyna. Więc odwracasz się i próbujesz innego
        kierunku -- nie, ta ścieżka też kończy się wielką pajęczyną. Wygląda na to, że ta uważająca część ciebie nie uważała dość, żeby uchronić
        cię przed zgubieniem się w ogromnym labiryncie pajęczyn.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
