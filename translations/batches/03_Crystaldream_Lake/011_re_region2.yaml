      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The extremely large spider sitting in the corner of the web looks delighted to see you, and inasmuch as a spider can smile, this one's
        smile has poison dripping off of it.
      pl: Niezwykle wielki pająk siedzący w rogu sieci wygląda na zachwyconego twoim widokiem, i o ile pająk w ogóle może się uśmiechać, z tego
