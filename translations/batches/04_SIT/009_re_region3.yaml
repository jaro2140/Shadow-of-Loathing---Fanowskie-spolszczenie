      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You have absolutely no idea what you're doing. Still, in your desperate fiddling with the device, you manage to open it and release
        the irradiated wisps that were locked inside. This is bad, but it's better than the reactor exploding and blowing up half the building.
      pl: Nie masz absolutnie pojęcia, co robisz. Mimo to, w swoim desperackim majstrowaniu przy urządzeniu, udaje ci się je otworzyć i uwolnić
        napromieniowane ogniki, które były w nim zamknięte. To złe, ale lepsze niż eksplozja reaktora i wysadzenie połowy budynku.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
