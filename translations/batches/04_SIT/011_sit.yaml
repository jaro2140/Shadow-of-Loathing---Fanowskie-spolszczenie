      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Apart from that, I'm afraid you're on your own, but there should be plenty of sources to be found.
      pl: Poza tym musisz radzić sobie samodzielnie, ale odpowiednich źródeł powinno być mnóstwo.
      status: do_korekty
      wspoldzielony_rekord: false
