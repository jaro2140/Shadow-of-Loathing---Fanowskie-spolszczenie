    - id: sol_6ef11f309c482ccc3671
      kontekst: textscripts.re_region1_companion_obie_levelup:line:6
      linia: 6
      sekcja_skryptu: start
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: I don't hear anything.
      pl: Nic nie słyszę.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_6e38c31ba15d45ecea12
      kontekst: textscripts.re_region1_companion_obie_levelup:line:7
      linia: 7
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: I mean in a metaphorical sorta way. Somethin' I'm right on the edge of rememberin'.
      pl: To znaczy w taki metaforyczny sposób. Coś, co mam na końcu języka.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_a71ca0f2876040a05fcc
      kontekst: textscripts.re_region1_companion_obie_levelup:line:8
      linia: 8
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: He taps one foot in thought for a moment, then his eyes brighten and he snaps his fingers. Climbing up onto some trash bins, he pulls
        down a box that was wedged behind some drainpipes.
      pl: Przez chwilę stuka stopą w zamyśleniu, po czym jego oczy się rozjaśniają i strzela palcami. Wspinając się na kosze na śmieci, ściąga
        pudełko wciśnięte za rurami spustowymi.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_4aeef204c65dbc47b126
      kontekst: textscripts.re_region1_companion_obie_levelup:line:9
      linia: 9
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Hah! What a thing to forget! Come to papa, baby.
      pl: Ha! Co za rzecz, żeby zapomnieć! Chodź do tatusia, kochanie.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_1d901d51b418666fdb26
      kontekst: textscripts.re_region1_companion_obie_levelup:line:10
      linia: 10
      sekcja_skryptu: start
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: What's that?
      pl: Jakie?
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 6
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: two
    wpisy:
    - id: sol_f4a45939fb6f01cbed5a
      kontekst: textscripts.re_region1_companion_obie_levelup:line:15
      linia: 15
      sekcja_skryptu: two
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: He opens the box, revealing some smaller boxes and some tin cans.
      pl: Otwiera pudełko, odsłaniając mniejsze pudełka i parę puszek.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_31c23cd6b8d332df7455
      kontekst: textscripts.re_region1_companion_obie_levelup:line:16
      linia: 16
      sekcja_skryptu: two
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Genuine Cola Wars rations. Pork 'n' beans, hardtack bread, a whole can of cola syrup, and carbonation tablets.
      pl: Prawdziwe racje z Wojen Coli. Wieprzowina z fasolą, suchary, cała puszka syropu colowego i tabletki gazujące.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_26bee00d1045b491a26f
      kontekst: textscripts.re_region1_companion_obie_levelup:line:17
      linia: 17
      sekcja_skryptu: two
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: You were in the war?
      pl: Byłeś na wojnie?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_5f86b47e54697723c2e9
      kontekst: textscripts.re_region1_companion_obie_levelup:line:18
      linia: 18
      sekcja_skryptu: two
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Nope. I can carry a tune, but my feet are flat. Plus I got conscientious objector status, on account'a bein' a Pepper.
      pl: Nie. Umiem trafić w nutę, ale mam płaskostopie. Poza tym dostałem status odmówcy sumienia, bo jestem Pepperem.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_ac0aa3fa7490f23b6d92
      kontekst: textscripts.re_region1_companion_obie_levelup:line:19
      linia: 19
      sekcja_skryptu: two
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: This stuff is army surplus I stashed away against leaner times.
      pl: To wojskowa nadwyżka, którą chowałem na chudsze czasy.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_9c61577cb135c47a3845
      kontekst: textscripts.re_region1_companion_obie_levelup:line:20
      linia: 20
      sekcja_skryptu: two
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: You aren't planning on eating that, are you?
      pl: Nie planujesz chyba tego zjeść, prawda?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: three
    wpisy:
    - id: sol_58f256cf3037535e223c
      kontekst: textscripts.re_region1_companion_obie_levelup:line:24
      linia: 24
      sekcja_skryptu: three
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: You aren't planning on eating that, are you? Even in cans, it's still ten years old at least.
      pl: Nie planujesz chyba tego zjeść, prawda? Nawet w puszkach to ma co najmniej dziesięć lat.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_388959fd4f49f326760c
      kontekst: textscripts.re_region1_companion_obie_levelup:line:25
      linia: 25
      sekcja_skryptu: three
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: The beans and bread, no. This syrup though -- this stuff don't go bad. It goes <i>good</i>.
      pl: Fasola i chleb, nie. Ale ten syrop — to coś się nie psuje. Ono się <i>polepsza</i>.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_d460510109ff8b3e8f9e
      kontekst: textscripts.re_region1_companion_obie_levelup:line:26
      linia: 26
      sekcja_skryptu: three
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: He pulls out a church-key and punches a hole in the can (nice hiss), and takes a swig. His eyes go wide.
      pl: Wyciąga otwieracz i przebija puszkę (miły syk), po czym pociąga łyk. Jego oczy robią się wielkie.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_e4f50f75edbc85ce1e0e
      kontekst: textscripts.re_region1_companion_obie_levelup:line:27
      linia: 27
      sekcja_skryptu: three
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Whoo! Now that is what I'm <i>talkin'</i> about!
      pl: Ho! No to właśnie o tym <i>mówię!</i>
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_4f0baca59eafefe1e53b
      kontekst: textscripts.re_region1_companion_obie_levelup:line:29
      linia: 29
      sekcja_skryptu: three
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: I'll take your word for it.
      pl: Uwierzę ci na słowo.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
