      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: About your nickname... is it just short for Dorothy, or is it because of actual dolls?
      pl: Co do twojego przezwiska... To tylko skrót od Dorothy czy ma związek z prawdziwymi lalkami?
