    - id: sol_6b25acbb8c64ad63de1d
      kontekst: textscripts.distillery_garlicvat:line:28
      linia: 28
      sekcja_skryptu: garlicblast
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The vampires completely flip their collective shinola. Some of them turn into bats and fight each other to be the first out of the hole
        in the wall. Some turn into mist and shoot out of cracks in the ceiling. A couple of them just kick the front door until the lock breaks
        and run out of the place.
      pl: Wampiry dostają zbiorowego fioła. Niektóre zmieniają się w nietoperze i walczą o pierwszeństwo do dziury w ścianie. Inne zmieniają się
