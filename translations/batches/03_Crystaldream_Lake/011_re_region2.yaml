    - id: sol_5455bca5f582a96e86e9
      kontekst: textscripts.re_region2_shadowcompass1:line:3
      linia: 3
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The cursed compass pulls you west and westeast deep into the heart of the forest, the trees expanding fast in size and number. All around
        you are trees, trees and more trees -- until, like the popping of an ear, all noise ceases, and there is quiet.
      pl: Przeklęty kompas ciągnie cię na zachód i zachódwschód głęboko w serce lasu, drzewa szybko stają się większe i liczniejsze. Wszędzie wokół ciebie są drzewa, drzewa i jeszcze więcej drzew -- aż nagle, jak przy odetkaniu ucha, wszelki hałas ustaje i zapada cisza.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_495a704121f71b07322f
