      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: There's only one reason a mushroom like that would be glowing, and that reason starts with M and ends with AGIC.
      pl: Jest tylko jeden powód, dla którego taki grzyb by świecił, i ten powód zaczyna się na M i kończy na AGIA.
