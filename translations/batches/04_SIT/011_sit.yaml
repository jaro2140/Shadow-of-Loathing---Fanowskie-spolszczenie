    - id: sol_8c7faf19fdd5f63832bd
      kontekst: textscripts.sit_librarian1:line:231
      linia: 231
      sekcja_skryptu: elective3
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: I've read a book or two on the topic. One thing I've noticed is that they aren't exactly subtle creatures. For many of them, their name
        is a dead giveaway for their abilities -- the Arctic Ankle-biting Spider is quite resistant to cold for example, and uses cold-based attacks,
        while the Cthonian Magma Spider breathes fire, so you would do well to be able to resist and douse flames when fighting one.
      pl: Czytałem na ten temat książkę lub dwie. Pająki zdecydowanie nie należą do subtelnych stworzeń. W wielu przypadkach już nazwa zdradza
        ich zdolności — Arktyczny Pająk Kostkogryz jest odporny na zimno i atakuje zimnem, a Chtoniczny Pająk Magmowy zieje ogniem, więc w walce
        warto odpierać i gasić płomienie.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_bea09c05976029c3da28
      kontekst: textscripts.sit_librarian1:line:232
      linia: 232
      sekcja_skryptu: elective3
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: For the ones not so transparently named, well, all you have to do is fight them and see what they do. Then you can be prepared for that
        next time.
      pl: W przypadku tych o mniej oczywistych nazwach wystarczy z nimi powalczyć i zobaczyć, co robią. Następnym razem będziesz już przygotowany.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
