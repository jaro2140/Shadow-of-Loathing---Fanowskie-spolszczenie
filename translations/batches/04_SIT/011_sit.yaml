      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: I have been known to dabble. The telescope on the roof of S.I.T. has a beautiful view.
      pl: Zdarza mi się nią parać. Teleskop na dachu S.I.T. zapewnia piękny widok.
