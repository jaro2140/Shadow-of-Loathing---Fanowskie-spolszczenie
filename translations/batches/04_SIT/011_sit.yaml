      linia: 61
      sekcja_skryptu: major2
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Ah! Well, you've come to the right place! I spend quite a lot of time at the Robotechtronics department. Have they got you running the
        robot obstacle course?
      pl: Ach! W takim razie trafiasz pod właściwy adres! Spędzam dużo czasu na wydziale Robotechtroniki. Kazali ci już przejść robotyczny tor
        przeszkód?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_373552288a606c598eab
