- kolejnosc_w_danych_gry: 3993
  skrypt: sit_fountain1
  pomieszczenie:
    id: sitwest_spiderwing
    nazwa_en: S.I.T. (Spider Wing)
  zagadka: false
  minigra_lub_feature: false
  liczba_wpisow: 7
  sekcje:
  - etykieta: popup
    wpisy:
    - id: sol_f27e4cee114d3ccea936
      kontekst: textscripts.sit_fountain1:line:4
      linia: 4
      sekcja_skryptu: popup
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: This drinking fountain is filled with spider eggs, making it the second-grossest drinking fountain you've ever seen.
      pl: To poidełko jest pełne pajęczych jaj, przez co zajmuje drugie miejsce na liście najobrzydliwszych poidełek, jakie zdarzyło ci się widzieć.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: check
    wpisy:
    - id: sol_da269385c8669ecc0636
      kontekst: textscripts.sit_fountain1:line:12
      linia: 12
      sekcja_skryptu: check
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You peer behind the fountain and see a massive spider with human teeth.  Every inch of your skin suddenly trades places with a different
        inch.
      pl: Zaglądasz za poidełko i widzisz olbrzymiego pająka z ludzkimi zębami. Każdy centymetr twojej skóry nagle zamienia się miejscem z innym
        centymetrem.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_cbe88e45ee95b0830452
      kontekst: textscripts.sit_fountain1:line:16
      linia: 16
      sekcja_skryptu: check
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Leave, and fast
      pl: Odejdź. Szybko
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: grab
    wpisy:
    - id: sol_6d4a50e30f246413d330
      kontekst: textscripts.sit_fountain1:line:20
      linia: 20
      sekcja_skryptu: grab
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You steel your nerves and reach for the teeth.  The spider is motionless.
      pl: Zbierasz się na odwagę i sięgasz po zęby. Pająk się nie porusza.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_677c1817ddbf427c2874
      kontekst: textscripts.sit_fountain1:line:21
      linia: 21
      sekcja_skryptu: grab
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The spider remains motionless as you grab the teeth, and continues to remain motionless until you wrench the teeth out of its mouth,
        at which point it crumbles to dust.
      pl: Pająk pozostaje nieruchomy, gdy chwytasz zęby, i pozostaje nieruchomy nadal, aż wyrywasz mu je z paszczy. Wtedy rozsypuje się w pył.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_510a4b73bdb689d27827
      kontekst: textscripts.sit_fountain1:line:23
      linia: 23
      sekcja_skryptu: grab
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Apparently it wasn't a live spider after all, but a molted spider skin.  That spider is going to be really annoyed with himself when
        he realizes he left his teeth in his other skin.
      pl: Najwyraźniej to wcale nie był żywy pająk, tylko zrzucony pancerz. Pająk będzie na siebie naprawdę zły, kiedy odkryje, że zostawił zęby
        w swojej drugiej skórze.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_0c33f075a73f25e21869
      kontekst: textscripts.sit_fountain1:line:24
      linia: 24
      sekcja_skryptu: grab
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Yeah, what an embarrassing mistake
      pl: No tak, co za żenująca pomyłka
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
