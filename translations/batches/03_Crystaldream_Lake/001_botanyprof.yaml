      kontekst: textscripts.botanyprof_fridge:line:97
      linia: 97
      sekcja_skryptu: salad6b
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: It turns out that the berries are firmly attached to the stem, and as you pull on them the skins slide off of the berry cores with thin
        slurping sounds, leaving behind wet round nodules like peeled grapes, each with a large circular black spot at the end. These spots weep
        milky-white fluid as the nodules deflate. You arrange the skins on your salad in an aesthetically-pleasing pattern.
      pl: Jagody są mocno przytwierdzone do łodygi, a przy pociągnięciu skórki zsuwają się z rdzeni z cichym siorbaniem, odsłaniając mokre, okrągłe
        guzki podobne do obranych winogron, każdy z wielką czarną plamą na końcu. Plamy sączą mlecznobiały płyn, gdy guzki wiotczeją. Układasz
        skórki na sałatce w estetyczny wzór.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
