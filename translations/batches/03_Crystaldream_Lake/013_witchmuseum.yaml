      sekcja_skryptu: judge
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: He's a judge for the county. Most of the little towns out this way are too small to have their own courthouse and judge, so they save
        up their legal matters and Clarence rides around to settle things once a month or so.
      pl: Jest sędzią hrabstwa. Większość okolicznych miasteczek jest zbyt mała na własny sąd i własnego sędziego, więc gromadzą sprawy prawne,
        a Clarence objeżdża je mniej więcej raz w miesiącu i wszystko rozstrzyga.
