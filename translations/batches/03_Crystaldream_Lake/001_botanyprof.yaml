    - id: sol_e226c7a62bd9b1ed870d
      kontekst: textscripts.botanyprof_fridge:line:13
      linia: 13
      sekcja_skryptu: getit
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Oooof. It's even wilder in here than expected. Half of the vegetables have rotted and turned into muck and mold, and the other half
        appear to be mutated experimental plants that have rapidly acclimated themselves to the environment and are using the rot as fertilizer.
        It's like a small foul-smelling alien jungle in this fridge.
      pl: Ufff. Jest tu jeszcze dziczej, niż można było oczekiwać. Połowa warzyw zgniła i zmieniła się w breję oraz pleśń, a druga połowa to chyba
        zmutowane rośliny eksperymentalne, które błyskawicznie przystosowały się do środowiska i używają zgnilizny jako nawozu. To jak mała, cuchnąca,
        obca dżungla w lodówce.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
