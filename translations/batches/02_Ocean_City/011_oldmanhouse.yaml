      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: They do. An' I can see from yer face that ya don't believe me, so you can ask 'em yerself, landlubber!
      pl: Odpowiadają. A widzę po twojej minie, że mi nie wierzysz, więc zapytaj je sam, szczurze lądowy!
