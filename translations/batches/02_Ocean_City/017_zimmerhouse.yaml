      linia: 46
      sekcja_skryptu: second2
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Except for you. You'll know.
      pl: Poza tobą. Ty będziesz wiedzieć.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
