      uwagi: *id003
  - etykieta: read
    wpisy:
    - id: sol_96164e0b4e539e884652
      kontekst: textscripts.sitwest_geologysign4:line:11
      linia: 11
      sekcja_skryptu: read
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: \"Perhaps most interestingly, some hexrock samples have been observed to be thaumically entangled with other, larger samples in such
        a way as to cause the larger hexrocks to materialize or dematerialize when the smaller 'switch' hexrocks are interacted with (see display).
        This appears to work regardless of distance or intervening obstruction, and sometimes a single 'switch' hexrock exerts control over more
        than one 'target' hexrock."
      pl: \"Co być może najciekawsze, niektóre próbki heksokamienia są taumicznie splątane z innymi, większymi próbkami w taki sposób, że oddziaływanie
        na mniejszy heksokamień-„przełącznik” powoduje materializację lub dematerializację większego heksokamienia (patrz eksponat). Zjawisko
        działa niezależnie od odległości i przeszkód po drodze, a czasami jeden heksokamień-„przełącznik” steruje więcej niż jednym heksokamieniem-„celem”."
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_99ec24b9a8d356e33919
      kontekst: textscripts.sitwest_geologysign4:line:12
      linia: 12
      sekcja_skryptu: read
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: \"I'll be honest with you, we haven't got the foggiest idea how this works, and some of us are kind of freaked out by it."
      pl: \"Szczerze mówiąc, nie mamy bladego pojęcia, jak to działa, i niektórych z nas trochę to przeraża."
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
