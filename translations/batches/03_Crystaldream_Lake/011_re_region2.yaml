      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: You know, if I'm going to be providing ranged support, maybe I should practice a bit while we're somewhere relatively uninhabited.
      pl: Wiesz, skoro mam zapewniać wsparcie z dystansu, to może powinnam trochę poćwiczyć, póki jesteśmy gdzieś stosunkowo bezludnie.
      status: do_korekty
