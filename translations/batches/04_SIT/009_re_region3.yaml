      kontekst: textscripts.re_region3_companion_obie_levelup:line:15
      linia: 15
      sekcja_skryptu: two
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: What gave me away, baby? The roguish ne'er-do-well good looks? The fashionably rumpled clothing?
      pl: Co mnie zdradziło, laluniu? Ta łobuzersko-nicponiowata uroda? Modnie pomięte ubranie?
