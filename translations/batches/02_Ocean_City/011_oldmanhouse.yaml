    - id: sol_74ddb2c7e87839a6cadd
      kontekst: textscripts.oldmanhouse_secretdoor:line:55
      linia: 55
      sekcja_skryptu: book3
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: So, you pull the book all the way off the shelf, and... nothing happens.
      pl: Zdejmujesz więc książkę całkiem z półki i... nic się nie dzieje.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_9bb6ce0e2e8a621841af
      kontekst: textscripts.oldmanhouse_secretdoor:line:56
      linia: 56
      sekcja_skryptu: book3
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: So, you flip the book open and start riffling through the pages, until you find one with the page-corner turned down. A diagram on the
        page shows the three most common unobtrusive latch mechanisms for bookshelf-based secret doors, and on closer inspection, this bookcase
        is using the second one.
      pl: Otwierasz więc książkę i zaczynasz kartkować, aż trafiasz na stronę z zagiętym rogiem. Schemat na tej stronie pokazuje trzy najpowszechniejsze dyskretne mechanizmy zatrzaskowe do tajnych drzwi ukrytych w regałach, a po bliższych oględzinach okazuje się, że ten regał korzysta z drugiego.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_4dd3e7294926a5f0253d
      kontekst: textscripts.oldmanhouse_secretdoor:line:58
      linia: 58
      sekcja_skryptu: book3
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Now you can open the secret door, whenever you're ready.
      pl: Teraz możesz otworzyć tajne drzwi, kiedy tylko będziesz gotów.
