    - id: sol_0ca1df82c992213f9353
      kontekst: textscripts.sitrobotlab_simone:line:27
      linia: 27
      sekcja_skryptu: intro
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Oh, it's pretty straightforward. You just have to build a robot from scratch, and then program it to successfully run a series of obstacle
        courses.
      pl: Och, to całkiem proste. Musisz zbudować robota od zera, a potem zaprogramować go tak, by pomyślnie pokonał serię torów przeszkód.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_45d53567078ccd42280e
      kontekst: textscripts.sitrobotlab_simone:line:28
      linia: 28
      sekcja_skryptu: intro
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: That sounds fun!
