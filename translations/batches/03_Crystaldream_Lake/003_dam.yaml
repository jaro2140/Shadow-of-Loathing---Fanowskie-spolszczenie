      linia: 75
      sekcja_skryptu: fight
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: What are the reasons?
      pl: Jakie?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
