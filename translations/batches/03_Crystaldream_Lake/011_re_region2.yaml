      sekcja_skryptu: three
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You have to yell at them pretty loud to get their attention, but eventually you do.
      pl: Musisz na nich nieźle wrzasnąć, żeby zwrócić ich uwagę, ale w końcu ci się udaje.
