      sekcja_skryptu: talk
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Well hello! Welcome to Sandwich! My name's Phil Proctor, I'm the mayor here. Any questions you might have about our little historical
        village, I'll be happy to answer as best I can!
      pl: Dzień dobry! Witaj w Sandwich! Nazywam się Phil Proctor i jestem tutejszym burmistrzem. Z przyjemnością odpowiem najlepiej, jak potrafię,
        na wszystkie pytania o naszą małą historyczną wioskę!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
