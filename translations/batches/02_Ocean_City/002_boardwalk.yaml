      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi:
      - '[DO PÓŹNIEJSZEJ WERYFIKACJI] Techniczna instrukcja skoku, niewidoczna dla gracza; pozostawiono bez zmian.'
    - id: sol_8c00506b2406f42ea2f3
      kontekst: textscripts.boardwalk_mobquest:line:10
      linia: 10
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You hear someone clapping, and turn to see a man in an expensive suit leaning against a nearby lamppost, flanked by two burly goons.
        Even if you didn't recognize him from your bedroom %misc_numwords/$dayssince$% days ago, you'd know him as soon as he opened his mouth.
      pl: Słyszysz oklaski i odwracasz się. O pobliską latarnię opiera się mężczyzna w drogim garniturze, a po bokach stoi dwóch rosłych oprychów. Nawet gdyby nie udało ci się go rozpoznać z własnej sypialni sprzed %misc_numwords/$dayssince$% dni, pierwsze słowa rozwiałyby wątpliwości.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - '%misc_numwords/$dayssince$%'
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_6a1d32eb7cab1f0d4a26
      kontekst: textscripts.boardwalk_mobquest:line:11
      linia: 11
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: A marvellious outcome, @firstname@, truly marvellious. You accomplishized the task at hand with finesse and aplomb in equal measurement.
      pl: Cudowniasty rezultat, @firstname@, doprawdy cudowniasty. Dokonałeś zrealizowania zadaniowego celu z finezją oraz w równym pomiarze z aplombem.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - '@firstname@'
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_4cd1158005e4854c0e2e
      kontekst: textscripts.boardwalk_mobquest:line:12
      linia: 12
      sekcja_skryptu: start
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: Hi, Don.
      pl: Cześć, Don.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: two
