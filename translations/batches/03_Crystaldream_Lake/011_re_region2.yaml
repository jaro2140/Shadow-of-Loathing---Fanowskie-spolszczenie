      linia: 9
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: And that's how, staggering blindly, you got yourself tangled up in a <i>third</i> spiderweb -- this one much larger and stronger, and
        made to trap prey of more or less your size.
      pl: I tak właśnie, potykając się na oślep, zaplątałeś się w <i>trzecią</i> pajęczynę -- tę dużo większą i mocniejszą, zrobioną, żeby złapać
        zdobycz mniej więcej twojego rozmiaru.
