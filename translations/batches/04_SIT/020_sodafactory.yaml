      linia: 51
      sekcja_skryptu: bewitch
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You solve the lock with magic. More specifically, you conjure a small cheese elemental to try every possible combination for you while
        you take a short nap.
      pl: 'Rozwiązujesz problem zamka za pomocą magii. Dokładniej: przywołujesz małego serowego żywiołaka, który sprawdza za ciebie wszystkie
        możliwe kombinacje, podczas gdy ty urządzasz sobie krótką drzemkę.'
