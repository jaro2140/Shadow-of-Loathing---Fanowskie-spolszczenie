      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: A pleaſure indeed. 1928, you ſay? That would make it, hmm... 205 years. So much for the Faculty Luncheon.
      pl: Niezmiernie mi miło. Rok 1928, powiadasz? To by znaczyło... hm... 205 lat. A więc nici z Wydziałowego Luncheonu.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_ef1aa3018d618f83b5e6
      kontekst: textscripts.sitchemlab_statue:line:27
      linia: 27
      sekcja_skryptu: two
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Did you... bronze yourself? Deliberately?
      pl: Czy pan... sam pokrył się brązem? Umyślnie?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_8ca163133716c080df13
      kontekst: textscripts.sitchemlab_statue:line:28
      linia: 28
      sekcja_skryptu: two
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Yes, quite ſo. My new Formula required teſting, you ſee, and as I had no plans of particular import for the Week-end, I thought perhaps
        I would ſkip ahead a bit.
      pl: Owszem, właśnie tak. Moja nowa Formuła wymagała próby, rozumiesz, a jako że na Week-end nie miałem planów szczególnej wagi, pomyślałem,
        iż przeskoczę nieco naprzód.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_8de079de3ca8235e11bb
      kontekst: textscripts.sitchemlab_statue:line:29
      linia: 29
      sekcja_skryptu: two
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: A graduate ſtudent was inſtructed to awaken me. If he comes aſking me for a Letter of Recommendation, I ſhall have ſome rather ſtern
        words for him.
      pl: Poleciłem pewnemu magistrantowi, by mnie obudził. Jeśli zgłosi się po List Polecający, czeka go z mej strony nader surowa reprymenda.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_69526ffd087d3a04a98c
      kontekst: textscripts.sitchemlab_statue:line:30
      linia: 30
      sekcja_skryptu: two
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: He's... probably dead.
      pl: On... prawdopodobnie nie żyje.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_211177b1d6b73b93b709
      kontekst: textscripts.sitchemlab_statue:line:31
      linia: 31
      sekcja_skryptu: two
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Ah, of courſe. Well then, I ſhall call that his Juſt Deſserts.
      pl: Ach, naturalnie. W takim razie uznam to za jego Zasłużoną Odpłatę.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_5332a83ffd82f9b568bb
      kontekst: textscripts.sitchemlab_statue:line:32
      linia: 32
      sekcja_skryptu: two
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: Anyway, welcome to the future!
      pl: Tak czy inaczej — witamy w przyszłości!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: three
    wpisy:
    - id: sol_5953b238fa4fe37e0bc1
      kontekst: textscripts.sitchemlab_statue:line:37
      linia: 37
      sekcja_skryptu: three
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Thank you, yes indeed! I find myſelf rather excited for the proſpect, you know. Has anything good been invented?
      pl: Dziękuję, doprawdy! Muszę przyznać, że perspektywa ta wielce mnie ekscytuje. Wynaleziono coś dobrego?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_ab0fc0a0d19cd2c35af4
      kontekst: textscripts.sitchemlab_statue:line:38
      linia: 38
      sekcja_skryptu: three
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: They're working on something called 'television.' Apparently it's like the moving pictures, except you'll be able to have one in your
        own home?
      pl: Pracują nad czymś, co nazywa się „telewizją”. Podobno to coś jak ruchome obrazy, tylko każdy będzie mógł mieć taki we własnym domu?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_400639a386eb3b56812c
      kontekst: textscripts.sitchemlab_statue:line:39
      linia: 39
      sekcja_skryptu: three
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Well, I muſt ſay that ſounds ridiculous. Who-ever heard of a moving picture?
      pl: Muszę przyznać, że brzmi to niedorzecznie. Któż słyszał o ruchomym obrazie?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_a5910aa5a590744735f3
      kontekst: textscripts.sitchemlab_statue:line:40
      linia: 40
      sekcja_skryptu: three
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Wow, yeah, you've missed a lot.
      pl: No tak. Sporo pana ominęło.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_e7c99c98cdc69c44dc56
      kontekst: textscripts.sitchemlab_statue:line:41
      linia: 41
      sekcja_skryptu: three
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: I ſuppoſe I am in need of a Guide. Might I impoſe to accompany you?
      pl: Przypuszczam, iż potrzebuję Przewodnika. Czy mógłbym się narzucić i ci towarzyszyć?
      status: do_korekty
      wspoldzielony_rekord: false
