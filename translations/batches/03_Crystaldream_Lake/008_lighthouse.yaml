      kontekst: textscripts.lighthouse_keeper_stage2:line:55
      linia: 55
      sekcja_skryptu: askthree
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Okay... well, how about I find you another old one then?
