      linia: 175
      sekcja_skryptu: minor3
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Half? ...Oh, of course. It seems that way to you because you only have one face.
      pl: Połowę? ...Och, oczywiście. Tak ci się wydaje, bo masz tylko jedną twarz.
