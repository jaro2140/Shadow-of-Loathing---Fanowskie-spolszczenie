      linia: 54
      sekcja_skryptu: book3
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You tilt the book forward, and... nothing happens.
      pl: Przechylasz książkę do przodu i... nic się nie dzieje.
