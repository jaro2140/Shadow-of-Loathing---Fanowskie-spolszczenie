      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: \"This arras* appears to depict several important ancestors of the Proctor family line, though due to the low resolution of embroidery
        used at the time, it's impossible to discern exactly who."
      pl: \"Ten arras* najwyraźniej przedstawia kilku ważnych przodków z rodu Proctorów, lecz z powodu niskiej rozdzielczości ówczesnego haftu
        nie sposób ustalić, kogo dokładnie."
