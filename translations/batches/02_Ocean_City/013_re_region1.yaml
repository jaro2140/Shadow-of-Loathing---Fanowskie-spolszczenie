      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: '"Vespula Capillifluidus!" you exclaim, to nobody in particular.  You remember learning about these things in college, and how their
        nests are a good source of hair gel if you ever find yourself lost in the woods without enough hair gel to last until you''re rescued.'
      pl: „Vespula Capillifluidus!” wykrzykujesz, do nikogo konkretnego. Przypominasz sobie, jak uczyłeś się o nich na studiach, i że ich gniazda są dobrym źródłem żelu do włosów, gdybyś kiedyś zgubił się w lesie bez wystarczającej ilości żelu, żeby przetrwać do ratunku.
