      kontekst: textscripts.oco_farmer_talk:line:28
      linia: 28
      sekcja_skryptu: two
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Well, my daughter went off to college, so there's nothin' keepin' me here. I never partic'ly cared for farmin' anyhow -- just kinda
        fell into it, y'know? So I reckoned I'd take the opportunity to retire and travel a bit. See what kinda trouble I can get up to, heh.
      pl: Córka poszła na studia, więc nic mnie tu nie trzyma. Nigdy nie lubiłem rolnictwa, jakoś w nie wpadłem. Pora przejść na emeryturę, podróżować
        i zobaczyć, w jakie kłopoty uda się wpaść, heh.
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
