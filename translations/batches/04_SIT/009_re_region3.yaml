    - id: sol_ed5327bcc140f19e7bf6
      kontekst: textscripts.re_region3_shadowcompass2:line:16
      linia: 16
      sekcja_skryptu: open2
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Hail to the make-out king, slumped on a tall throne at the head of a dining table. His head burns with clean eldritch fire, and the
        food and drink laid out before him sparkle like stars in a shadowblack sky.
      pl: Chwała królowi obściskiwania, rozwalonemu na wysokim tronie u szczytu stołu jadalnego. Jego głowa płonie czystym, upiornym ogniem, a
        jedzenie i napoje rozłożone przed nim skrzą się jak gwiazdy na cienioczarnym niebie.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_5ec139992f193d3eac3b
      kontekst: textscripts.re_region3_shadowcompass2:line:17
      linia: 17
      sekcja_skryptu: open2
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: His eyes have clouded over. He doesn't seem to understand that you are here.
      pl: Jego oczy zaszły mgłą. Nie wydaje się rozumieć, że tu jesteś.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
