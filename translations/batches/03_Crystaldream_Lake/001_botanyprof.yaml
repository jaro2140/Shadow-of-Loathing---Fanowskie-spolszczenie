      linia: 32
      sekcja_skryptu: signo
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You also find a pair of pants discarded in the corner -- guess the professor grew out of them. You take them for good measure, by which
        I mean you measure them and they fit you, which is good.
      pl: W kącie znajdujesz też porzucone spodnie — profesor najwyraźniej z nich wyrósł. Zabierasz je na miarę — to znaczy przymierzasz. Pasują, i dobrze.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
