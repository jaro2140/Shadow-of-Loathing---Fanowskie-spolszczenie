      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_360338789fc9078de78c
      kontekst: textscripts.sit_rufus_arcanehotplate:line:20
      linia: 20
      sekcja_skryptu: take
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You grab one of the hot plates before he does some more math and changes his mind.
      pl: Łapiesz jedną z płyt, zanim policzy coś jeszcze i zmieni zdanie.
