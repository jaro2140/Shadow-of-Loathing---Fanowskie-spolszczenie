  - etykieta: basic
    wpisy:
    - id: sol_8eb4db1698d05b274c3b
      kontekst: textscripts.siteast_cookingstation5:line:34
      linia: 34
      sekcja_skryptu: basic
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You plop a scoop each of vanilla, chocolate, and strawberry into a bowl, and add some sprinkles as an afterthought.
      pl: Wrzucasz do miski po gałce lodów waniliowych, czekoladowych i truskawkowych, a na koniec, od niechcenia, dorzucasz posypkę.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_544855d79197254badd5
      kontekst: textscripts.siteast_cookingstation5:line:35
      linia: 35
      sekcja_skryptu: basic
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: It's more of a tuesdae than a sundae, but ice cream is ice cream, right? Everyone screams for it regardless.
      pl: To bardziej deser wtorkowy niż niedzielny, ale lody to lody, prawda? I tak każdy o nie krzyczy.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi:
      - '[DO PÓŹNIEJSZEJ WERYFIKACJI] Oryginał gra sundae/Sunday/tuesdae/Tuesday oraz „I scream”; zastosowano polski odpowiednik opisowy, który
        warto ocenić w kontekście kolejnych wariantów deseru.'
    - id: sol_79a0b4c58c1a03b9b5d2
      kontekst: textscripts.siteast_cookingstation5:line:38
      linia: 38
      sekcja_skryptu: basic
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Good enough
      pl: Wystarczy
