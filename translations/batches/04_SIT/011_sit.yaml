      linia: 20
      sekcja_skryptu: talk
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Oh, I'm perfectly mobile! I have wheels, and the Robotechtronics department has provided me with some very nice telescoping arms. I'm
        just "sitting down" right now, because with the majority of students on break, I don't have any books that need shelving.
      pl: Och, jestem całkowicie mobilna! Mam kółka, a wydział Robotechtroniki wyposażył mnie w bardzo ładne teleskopowe ręce. Teraz po prostu
        „siedzę”, bo większość studentów ma przerwę i nie ma książek do odłożenia na półki.
      status: do_korekty
      wspoldzielony_rekord: false
