      kontekst: textscripts.re_region1_fight_shadow:line:7
      linia: 7
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: A couple of black orbs, or holes, or whatever these bizarre shadow monsters are made of, are drifting toward you.
      pl: Para czarnych kul, czy dziur, czy czegokolwiek tam są zrobione te dziwaczne cieniowe potwory, unosi się w twoją stronę.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: true
      uwagi: []
    - id: sol_c6e588debfc480f3a488
      kontekst: textscripts.re_region1_fight_shadow:line:8
      linia: 8
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You experiment with them a little bit -- walking around behind them, moving erratically to see how closely they track you, trying to
        get them to collide with each other, and so on -- but you can't really draw any conclusions from this.
      pl: Trochę z nimi eksperymentujesz — chodzisz za nimi, poruszasz się nieregularnie, żeby zobaczyć, jak dokładnie cię śledzą, próbujesz doprowadzić do ich zderzenia i tak dalej — ale nie potrafisz wyciągnąć z tego żadnych wniosków.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: true
      uwagi: []
    - id: sol_6b729396f3f74d803145
      kontekst: textscripts.re_region1_fight_shadow:line:9
      linia: 9
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Also, they seem to be getting annoyed with all your fooling around, although you aren't sure how you know that.
      pl: Poza tym wydają się irytować twoim wygłupianiem, choć nie jesteś pewien, skąd to wiesz.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: true
      uwagi: []
    - id: sol_da4ab423ead279446dbd
      kontekst: textscripts.re_region1_fight_shadow:line:12
      linia: 12
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Nothing hovers toward you. I mean, <i>something</i> hovers toward you, but that something is literally nothing.
      pl: Nic nie unosi się w twoją stronę. To znaczy, <i>coś</i> unosi się w twoją stronę, ale to coś jest dosłownie niczym.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
