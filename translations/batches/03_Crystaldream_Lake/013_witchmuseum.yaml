      uwagi: []
  - etykieta: peter
    wpisy:
    - id: sol_61a88c60e59cbe496937
      kontekst: textscripts.witchmuseum_mayor:line:35
      linia: 35
      sekcja_skryptu: peter
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Any relation to Peter Proctor?
      pl: Czy Peter Proctor jest twoim krewnym?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_511e715bec412f816938
      kontekst: textscripts.witchmuseum_mayor:line:36
      linia: 36
      sekcja_skryptu: peter
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Ah, you must have seen the graves in our cemetery. Yes, that Peter Proctor was my great-great-... I think it's five or six 'greats',
        grandfather. We don't know much about him, but judging from that headstone, he must've been a character.
      pl: Ach, pewnie widziałeś groby na naszym cmentarzu. Tak, tamten Peter Proctor był moim pra-pra-... Chyba pięć albo sześć razy „pra” — dziadkiem. Niewiele o nim wiemy, ale sądząc po nagrobku, musiał być niezłym oryginałem.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_e641201b6b457098617b
      kontekst: textscripts.witchmuseum_mayor:line:37
      linia: 37
      sekcja_skryptu: peter
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Yeah, you could say that. ...er, I assume.
      pl: Można tak powiedzieć. ...Eee, tak mi się przynajmniej wydaje.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: house
    wpisy:
    - id: sol_72005443a65e20db583c
      kontekst: textscripts.witchmuseum_mayor:line:43
      linia: 43
      sekcja_skryptu: house
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: I'm sorry, I'd love to show you the place -- we've got a beautiful tapestry featuring portraits of some of my ancestors, and a lot of
        other historical memorabilia -- but you've arrived at a bad time. We're doing some renovation and restoration work, and it's a real mess
        inside. That's why I'm standing out here -- I'm waiting for the electrician, or someone like him.
      pl: Przykro mi, chętnie pokazuję gościom dom — mamy piękny arras z portretami kilku moich przodków i mnóstwo innych historycznych pamiątek
        — ale trafiasz w złą porę. Trwa remont i renowacja, a w środku panuje straszny bałagan. Dlatego stoję tutaj — czekam na elektryka albo
        kogoś w tym rodzaju.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_cbcfa810a060626a5336
      kontekst: textscripts.witchmuseum_mayor:line:44
      linia: 44
      sekcja_skryptu: house
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: Electrician?
      pl: Elektryka?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: house2
    wpisy:
    - id: sol_dc4e3ff673c5ba3349f4
      kontekst: textscripts.witchmuseum_mayor:line:48
      linia: 48
      sekcja_skryptu: house2
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Electrician? I thought you were all eighteenth-century historical re-enactors here.
      pl: Elektryka? Myślałem, że wszyscy odtwarzacie tu życie z XVIII wieku.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_d5ae8753fb18ed689eee
      kontekst: textscripts.witchmuseum_mayor:line:49
      linia: 49
      sekcja_skryptu: house2
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Oh, well, yes. Technically. But I have a telephone for emergencies, and once a week after the patrons have left in the evening, we all
        get together in my parlor to listen to "The Loosner's Castor Oil Flakes Musical Variety Hour" on the radio.
      pl: No cóż, owszem. Technicznie rzecz biorąc. Ale mam telefon na nagłe wypadki, a raz w tygodniu, wieczorem po wyjściu gości, zbieramy się
        w moim salonie i słuchamy w radiu „Muzycznego Rewiowego Wieczoru Płatków z Olejem Rycynowym Loosnera”.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: witches
    wpisy:
    - id: sol_548f246c0557051c8c07
      kontekst: textscripts.witchmuseum_mayor:line:55
      linia: 55
      sekcja_skryptu: witches
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Witchcraft? Ha ha noooo, nope, no witches around here! We filled the root cellar up with concrete purely because the house's foundation
        was a little shaky.
      pl: Czary? Ha, ha, nieeee. Żadnych czarownic! Zapełniliśmy ziemiankę betonem wyłącznie dlatego, że fundamenty domu trochę się chwieją.
      status: do_korekty
      wspoldzielony_rekord: false
