      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You wander into a science lab, and see that someone has left some kind of experimental magical reactor running unattended. Maybe they
        realized it was in the process of explosively overloading and ran away?
      pl: Wędrujesz do laboratorium naukowego i widzisz, że ktoś zostawił działający bez nadzoru jakiś eksperymentalny magiczny reaktor. Może
        zorientowali się, że jest w trakcie wybuchowego przeciążenia i uciekli?
