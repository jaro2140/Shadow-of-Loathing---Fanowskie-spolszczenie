    - id: sol_038514ac46a22e1ed771
      kontekst: textscripts.dam_guardblocker:line:76
      linia: 76
      sekcja_skryptu: fight
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Yes, I'm sure [fight]
      pl: Tak, na pewno [walka]
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: true
