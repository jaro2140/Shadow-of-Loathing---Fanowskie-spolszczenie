      kontekst: textscripts.re_region1_fight_shadowadd4:line:6
      linia: 6
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: I guess I'm just blathering. Sorry, you're probably wanting to get on with the encounter.
      pl: Chyba po prostu bredzę. Wybacz, pewnie chcesz już przejść do samego starcia.
