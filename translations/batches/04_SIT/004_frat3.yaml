      kontekst: textscripts.frat3_f3onenter:line:3
      linia: 3
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Wow, this is incredible -- not only did this fraternity chisel a whole frat house out of stone and carve furniture to match, they even
        went so far as to sculpt a bunch of frat boy statues! Presumably they store them up here and haul them downstairs to fill out the space
        for parties?
      pl: Łał, niewiarygodne — bractwo nie tylko wykuło cały dom w kamieniu i wyrzeźbiło pasujące meble, ale stworzyło nawet mnóstwo posągów członków!
        Pewnie przechowują je na górze i znoszą na imprezy, żeby zapełnić przestrzeń?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_860dc97d834aa919f7ef
