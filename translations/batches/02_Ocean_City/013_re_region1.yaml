      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You spy a nest of pomade wasps underneath the awning of an abandoned storefront.
      pl: Dostrzegasz gniazdo os pomadowych pod markizą opuszczonego sklepu.
