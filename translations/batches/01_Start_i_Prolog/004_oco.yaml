      pl: Wkrótce przyjeżdża autobus. Deszcz zaczyna lać, gdy tylko wsiadasz. »No proszę — mówi kierowca — zdążam w samą porę. To musi być twoja
        szczęśliwa noc, dzieciaku«.
      status: zatwierdzono
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: &id011 []
    - id: sol_1279928860886ea8820a
      kontekst: textscripts.oco_busride:line:5
      linia: 5
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The bus is empty, so you take a seat in the middle as the driver shuts the doors and pulls away from the diner.
      pl: Autobus jest pusty, więc siadasz pośrodku, a kierowca zamyka drzwi i odjeżdża spod baru.
      status: zatwierdzono
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: &id012 []
    - id: sol_ab2ed7a0f5777f117807
      kontekst: textscripts.oco_busride:line:6
      linia: 6
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: '"You on vacation?" the driver asks. "Ocean City used to be a big tourist spot, but I don''t get so many passengers these days."'
      pl: »Jedziesz na wakacje? — pyta kierowca. — Ocean City było kiedyś kurortem, ale dziś mam niewielu pasażerów«.
      status: zatwierdzono
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: &id013 []
    - id: sol_ff1a4f099efa642da596
      kontekst: textscripts.oco_busride:line:7
      linia: 7
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: '"Kind of," you say. "I''m visiting my uncle."'
      pl: »Coś w tym rodzaju — odpowiadasz. — Odwiedzam wujka«.
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_93b2595e225ccfd6c5ca
      kontekst: textscripts.oco_busride:line:8
      linia: 8
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: '"Must be nice to have an uncle."'
      pl: »Miło mieć wujka«.
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_4f8039cee99e5805c6a0
      kontekst: textscripts.oco_busride:line:9
      linia: 9
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You lean against the window and listen to the spattering rain. Uncle Murray's letter didn't sound nice. It sounded like he was in some
        kind of trouble.
      pl: Opierasz się o okno i słuchasz deszczu. List wujka Murraya nie brzmiał dobrze. Wyglądało na to, że wpadł w jakieś kłopoty
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_00bb4567f9aab0c1c790
      kontekst: textscripts.oco_busride:line:10
      linia: 10
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Something he didn't want to talk about openly.
      pl: Coś, o czym nie chciał mówić otwarcie.
      status: zatwierdzono
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: &id014 []
    - id: sol_069bed8c1355e07bccc8
      kontekst: textscripts.oco_busride:line:11
      linia: 11
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Time passes as you think about Murray, and wonder what kind of trouble an antique dealer could get into, and why he'd need your help,
        of all people.
      pl: Czas mija na rozmyślaniach o Murrayu, kłopotach, w jakie może wpaść handlarz antykami, i powodach, dla których potrzebuje właśnie twojej
        pomocy.
      status: zatwierdzono
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: &id015 []
    - id: sol_e197c5981a028cb193d7
      kontekst: textscripts.oco_busride:line:12
      linia: 12
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: 'And then the bus stops. The driver gets off, grumbling, then calls to you: "Gonna need ya to step outside for a sec."'
      pl: 'Autobus się zatrzymuje. Kierowca wysiada, mamrocząc, po czym woła: »Musisz na chwilę wyjść«.'
