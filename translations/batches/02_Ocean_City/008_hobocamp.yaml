      kontekst: textscripts.hobocamp_king:line:164
      linia: 164
      sekcja_skryptu: plan3
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: 'Well, you have been very helpful. Very well, the general outline of my plan is this: I intend to found an entire city of, and for,
        hoboes. Too long have we chafed under the laws and economic pressures of this land, when what we truly desire is to live life free, to
        go where we please and do what we will. I will establish a city where the hobo lifestyle is not only possible, but celebrated.'
      pl: 'Cóż, okazałeś nam wielką pomoc. Dobrze, ogólny zarys planu jest taki: założę całe miasto włóczęgów i dla włóczęgów. Zbyt długo uwierały nas prawa i naciski gospodarcze tego kraju, podczas gdy naprawdę pragniemy żyć swobodnie, chodzić, dokąd chcemy, i robić, co chcemy. Założę miasto, w którym styl życia włóczęgi będzie nie tylko możliwy, lecz celebrowany.'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
