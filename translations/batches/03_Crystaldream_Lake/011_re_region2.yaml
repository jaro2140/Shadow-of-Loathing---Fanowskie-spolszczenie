      linia: 9
      sekcja_skryptu: two
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You cautiously poke your head around the side of a tree. You see three mob goons, who have set up a little shooting gallery -- taking
        pot-shots at empty tin cans for target practice.
      pl: Ostrożnie wychylasz głowę zza drzewa. Widzisz trzech mafijnych oprychów, którzy urządzili sobie małą strzelnicę -- strzelają do pustych
        puszek w ramach ćwiczeń celności.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: true
      uwagi: []
    - id: sol_42332a9a4f73679eaac5
      kontekst: textscripts.re_region2_fight_mob3:line:10
      linia: 10
      sekcja_skryptu: two
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Instead of pistols though, they're using tommyguns and shotguns, obliterating the cans and basically everything else nearby.
      pl: Zamiast pistoletów jednak używają pistoletów maszynowych Thompson i strzelb, unicestwiając puszki i w zasadzie wszystko inne w pobliżu.
