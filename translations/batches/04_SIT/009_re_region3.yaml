      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_53806865c85b0ef4af01
      kontekst: textscripts.re_region3_companion_obie_levelup:line:21
