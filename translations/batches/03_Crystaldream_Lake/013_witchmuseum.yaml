      uwagi: []
  - etykieta: hub
    wpisy:
    - id: sol_cc42278c05bf19637a0d
      kontekst: textscripts.witchmuseum_mayor:line:28
      linia: 28
      sekcja_skryptu: hub
      typ: sayoption_once
      mowca_lub_kanal: opcja_gracza
      en: Any relation to Peter Proctor?
