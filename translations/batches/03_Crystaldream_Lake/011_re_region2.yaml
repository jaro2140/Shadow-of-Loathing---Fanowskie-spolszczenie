  liczba_wpisow: 20
  sekcje:
  - etykieta: start
    wpisy:
    - id: sol_e7529992a8d2fbfa2a59
      kontekst: textscripts.re_region2_fight_mob3:line:3
      linia: 3
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You hear very loud repeated gunfire from somewhere nearby in the woods. Ordinarily, these random encounters start with you going to
        check out whatever's going on, and then dealing with the consequences of whatever you find -- this time, though, I'm gonna give you the
        option to <i>not</i> be the sort of person who walks <i>toward</i> the sound of an active warzone.
      pl: Słyszysz bardzo głośną, powtarzającą się strzelaninę gdzieś w pobliżu w lesie. Zwykle te losowe spotkania zaczynają się od tego, że
        idziesz sprawdzić, co się dzieje, a potem radzisz sobie z konsekwencjami tego, co znajdziesz -- tym razem jednak dam ci opcję, żeby <i>nie</i>
        być osobą, która idzie <i>w stronę</i> odgłosów aktywnej strefy wojennej.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
