  - etykieta: funeral
    wpisy:
    - id: sol_18c4cfc4a1941f041f40
      kontekst: textscripts.cathedral_vicar:line:120
      linia: 120
      sekcja_skryptu: funeral
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: This might be a weird question, Father, but I was reading about a funeral that happened here, eleven years ago -- could I ask you about
        it?
      pl: To może dziwne pytanie, ojcze, ale czytałem o pogrzebie, który odbył się tutaj jedenaście lat temu. Mogę o niego zapytać?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
