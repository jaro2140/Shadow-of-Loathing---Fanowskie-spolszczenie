      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: I didn't call it a <i>good</i> boy just now. I figure I need another... I dunno, 80 or 90 years to really get it right.
      pl: Nie nazwałem go przed chwilą <i>grzecznym</i> chłopcem. Chyba potrzebuję jeszcze... nie wiem, osiemdziesięciu lub dziewięćdziesięciu lat, żeby ją dopracować.
