      linia: 11
      sekcja_skryptu: repair
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: 'You inspect the reactor carefully, and discover the problem: it''s being powered by electrically overcharged will-o-the-wisps, and
        the field that keeps them contained isn''t running at full power due to some faulty soldering in the control circuits.'
      pl: 'Uważnie oglądasz reaktor i odkrywasz problem: jest zasilany elektrycznie przeładowanymi błędnymi ognikami, a pole, które je powstrzymuje,
        nie działa z pełną mocą z powodu wadliwego lutowania w obwodach kontrolnych.'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: true
