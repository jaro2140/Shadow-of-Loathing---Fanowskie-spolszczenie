      kontekst: textscripts.re_region3_shadowcompass1:line:9
      linia: 9
      sekcja_skryptu: look
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: This is so grim the Brothers Grimm wouldn't touch it. And they were <i>sick.</i>
      pl: To tak ponure, że nawet Bracia Grimm by tego nie tknęli. A byli <i>chorzy.</i>
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
