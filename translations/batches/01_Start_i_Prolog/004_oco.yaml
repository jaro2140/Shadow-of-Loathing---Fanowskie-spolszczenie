      kontekst: textscripts.oco_busride:line:13
      linia: 13
      sekcja_skryptu: start
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Disembark
      pl: Wysiądź
      status: zatwierdzono
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
