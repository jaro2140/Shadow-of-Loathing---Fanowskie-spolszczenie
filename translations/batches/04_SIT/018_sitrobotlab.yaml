      minigra_lub_feature: false
      uwagi: []
    - id: sol_2d031539907e5d522606
      kontekst: textscripts.sitrobotlab_simone:line:35
      linia: 35
      sekcja_skryptu: fun
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Well... shoot!
      pl: No... kurczę!
      status: do_korekty
