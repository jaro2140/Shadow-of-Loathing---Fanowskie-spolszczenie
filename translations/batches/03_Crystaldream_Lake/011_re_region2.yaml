      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: While flailing around, disgusted, trying to get it off of you, you stumble into a second spiderweb, which goes right across your face.
        Argh!
      pl: Miotając się, zniesmaczony, próbując ją z siebie zdjąć, wpadasz na drugą pajęczynę, która ląduje ci prosto na twarzy. Argh!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: true
