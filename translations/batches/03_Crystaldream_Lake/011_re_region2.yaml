- kolejnosc_w_danych_gry: 3264
  skrypt: re_region2_companion_obie_levelup
  pomieszczenie: null
  zagadka: false
  minigra_lub_feature: false
  liczba_wpisow: 14
  sekcje:
  - etykieta: start
    wpisy:
    - id: sol_5fc2ea6db094810af628
      kontekst: textscripts.re_region2_companion_obie_levelup:line:3
      linia: 3
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: After a lengthy interval of time spent trudging through gray, sullen woods, Obie makes a disgusted noise.
      pl: Po długim czasie spędzonym na mozolnym marszu przez szary, ponury las, Obie wydaje z siebie zniesmaczony dźwięk.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_2415bc7d199178bed922
      kontekst: textscripts.re_region2_companion_obie_levelup:line:5
      linia: 5
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Ugh. Can't say I'm a fan of this atmosphere.
      pl: Uch. Nie powiem, żebym był fanem tego klimatu.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_c1f1fb6cc4a1d2638e25
      kontekst: textscripts.re_region2_companion_obie_levelup:line:7
      linia: 7
      sekcja_skryptu: start
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: What, you aren't into oppressive gloom?
      pl: Co, nie kręci cię przytłaczający mrok?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_ecb3d9bbef04730b8204
      kontekst: textscripts.re_region2_companion_obie_levelup:line:8
      linia: 8
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Obie takes out his oboe and improvises a little tune as the two of you continue down the path -- a trilling, warbling, chirpy little
        melody that does a fair bit to lighten the mood. However, you eventually happen to glance behind you.
      pl: Obie wyjmuje obój i improwizuje melodyjkę — świergotliwą, trylującą — gdy we dwójkę idziecie dalej ścieżką, co całkiem sporo poprawia nastrój. Jednak w końcu rzucasz okiem za siebie.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_84ddc00e27e0b020ea37
      kontekst: textscripts.re_region2_companion_obie_levelup:line:9
      linia: 9
      sekcja_skryptu: start
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Uh. Obie?
      pl: Eee. Obie?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_21039d26e9023161cfe9
      kontekst: textscripts.re_region2_companion_obie_levelup:line:10
      linia: 10
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: 'The trees are absolutely filled with birds: sparrows, thrushes, miscellaneous songbirds. A whole bunch of crows. Even a couple of seagulls
        and one turkey buzzard. All staring at you with their beady black bird eyes.'
      pl: 'Drzewa są dosłownie pełne ptaków: wróble, drozdy, różnorakie śpiewające ptaszki. Cała masa wron. Nawet parę mew i jeden sęp indyczy.
        Wszystkie wpatrują się w ciebie swoimi paciorkowatymi, czarnymi, ptasimi oczami.'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_bee12c0a678e3ca98737
      kontekst: textscripts.re_region2_companion_obie_levelup:line:11
      linia: 11
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Uh...
      pl: Eee...
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_39f07f7dea592449c7db
      kontekst: textscripts.re_region2_companion_obie_levelup:line:12
      linia: 12
      sekcja_skryptu: start
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: What have you been <i>saying?</i>
      pl: Co ty <i>mówiłeś?</i>
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: two
    wpisy:
    - id: sol_6ca33c2a01d1ce149979
      kontekst: textscripts.re_region2_companion_obie_levelup:line:17
      linia: 17
      sekcja_skryptu: two
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: 'I dunno, kid, but right now I''m sayin'': run.'
      pl: 'Nie wiem, dzieciaku, ale w tej chwili mówię: uciekaj.'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_ecdb7dd93c06ef543d17
      kontekst: textscripts.re_region2_companion_obie_levelup:line:18
      linia: 18
      sekcja_skryptu: two
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The two of you dash off of the main path and scramble through the woods and brush, which fortunately are thick enough that the pursuing
        birds can't effectively mob you, and manage to escape with only superficial scratches.
      pl: We dwójkę zbaczacie z głównej ścieżki i przedzieracie się przez las i zarośla, które na szczęście są dość gęste, żeby ścigające was
        ptaki nie mogły skutecznie was osaczyć, i udaje wam się uciec tylko z powierzchownymi zadrapaniami.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_f0575dc5f198a08c4a9e
      kontekst: textscripts.re_region2_companion_obie_levelup:line:19
      linia: 19
      sekcja_skryptu: two
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Hoo-whee! And I thought I'd seen some tough crowds.
      pl: Ho-hej! A myślałem, że widziałem już wymagającą publiczność.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_f641bcb0d0394bf12f6a
      kontekst: textscripts.re_region2_companion_obie_levelup:line:20
      linia: 20
      sekcja_skryptu: two
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: You know that saying, how jazz is about the notes you don't play? Maybe we should have some more of those for a while.
      pl: Znasz to powiedzenie, że w jazzie chodzi o nuty, których nie grasz? Może powinniśmy przez chwilę zagrać więcej takich.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_36eac86f37531cb806c2
      kontekst: textscripts.re_region2_companion_obie_levelup:line:21
      linia: 21
      sekcja_skryptu: two
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Normally I would be offended, but under the circumstances I think that's a right good plan.
      pl: Normalnie bym się obraził, ale biorąc pod uwagę okoliczności, myślę, że to całkiem niezły plan.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_f933186b4a2ed3b85cc2
      kontekst: textscripts.re_region2_companion_obie_levelup:line:24
      linia: 24
      sekcja_skryptu: two
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Continue
      pl: Kontynuuj
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 78
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: *id001
- kolejnosc_w_danych_gry: 3265
  skrypt: re_region2_companion_obie_mapunlock
  pomieszczenie: null
  zagadka: true
  minigra_lub_feature: false
  liczba_wpisow: 16
  sekcje:
  - etykieta: start
    wpisy:
    - id: sol_47dc4be99a0f22120820
      kontekst: textscripts.re_region2_companion_obie_mapunlock:line:2
      linia: 2
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Obie stops walking and puts a hand to his ear.
      pl: Obie przestaje iść i przykłada dłoń do ucha.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: sol_99b68e4a29134b7cf42d
      kontekst: textscripts.re_region2_companion_obie_mapunlock:line:4
      linia: 4
      sekcja_skryptu: start
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: What's up, Obie?
      pl: Co jest, Obie?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: sol_9091698c9f7943bcc9ce
      kontekst: textscripts.re_region2_companion_obie_mapunlock:line:5
      linia: 5
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Shhh. You hear that?
      pl: Ciii. Słyszysz to?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: sol_140599d611f4dd5c43c4
      kontekst: textscripts.re_region2_companion_obie_mapunlock:line:6
      linia: 6
      sekcja_skryptu: start
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: I heard you go 'shhh', is that what you mean?
      pl: Słyszałem, jak mówisz »ciii«, o to ci chodzi?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: sol_c37496b4646dc8be6e01
      kontekst: textscripts.re_region2_companion_obie_mapunlock:line:7
      linia: 7
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Guess you ain't so musically inclined. There's some kinda weird... singin'. Off in that direction.
      pl: Chyba nie masz talentu muzycznego. Jest tam jakiś dziwny... śpiew. W tamtym kierunku.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: sol_0982280f6b393c89dea2
      kontekst: textscripts.re_region2_companion_obie_mapunlock:line:8
      linia: 8
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: He points deeper into the woods.
      pl: Wskazuje głębiej w las.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: sol_ac84c4e22a1919d44d5a
      kontekst: textscripts.re_region2_companion_obie_mapunlock:line:9
      linia: 9
      sekcja_skryptu: start
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: Nothing wrong with a quick detour, I guess.
      pl: Nic złego w krótkim zboczeniu z trasy, jak sądzę.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
  - etykieta: two
    wpisy:
    - id: sol_e4fc80ac307bf2c1b435
      kontekst: textscripts.re_region2_companion_obie_mapunlock:line:13
      linia: 13
      sekcja_skryptu: two
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Obie leads you off the path and into the forest. After a short time he gestures to you to be quiet, and the two of you crouch down behind
        a shrub and peek out at a small patch of wildflowers -- several large, brightly-colored butterflies are flitting among them. That's a
        word, right? Flitting?
      pl: Obie prowadzi cię ze ścieżki w głąb lasu. Po chwili daje ci znak, żebyś był cicho, i we dwójkę kucacie za krzakiem, zerkając na mały skrawek polnych kwiatów -- kilka wielkich, jaskrawo kolorowych motyli furkocze wśród nich. To chyba słowo, prawda? Furkotać?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: sol_89bdf7269d0b3f15e587
      kontekst: textscripts.re_region2_companion_obie_mapunlock:line:16
      linia: 16
      sekcja_skryptu: two
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: One of them is whistling merrily -- not quite a melody, it's more like a surprisingly accurate impression of some kind of songbird?
        It's very pretty... until it suddenly turns into a squawk, followed by a loud and unpleasant screech, followed by a wet gurgle.
      pl: Jeden z nich wesoło pogwizduje -- to niezupełnie melodia, bardziej jak zaskakująco trafna imitacja jakiegoś śpiewającego ptaka? Jest bardzo ładna... aż nagle zamienia się w skrzek, po którym następuje głośny i nieprzyjemny pisk, a potem mokre bulgotanie.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: sol_c55f63cf0c152ce1195a
      kontekst: textscripts.re_region2_companion_obie_mapunlock:line:17
      linia: 17
      sekcja_skryptu: two
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The other fairies laugh -- raucous piping little giggles. One of them makes a sound that, if you had to guess, would be the sound that
        a squirrel would make while being tortured to death. This sets off another round of shrill laughter.
      pl: Pozostałe wróżki się śmieją -- ochrypłe, piskliwe chichoty. Jedna z nich wydaje dźwięk, który, gdybyś miał zgadywać, brzmiałby jak wiewiórka
        torturowana na śmierć. To wywołuje kolejną rundę przenikliwego śmiechu.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: sol_3b08ca292a04fecd8d16
      kontekst: textscripts.re_region2_companion_obie_mapunlock:line:18
      linia: 18
      sekcja_skryptu: two
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: After this, the fairies flutter away. As they're leaving, one of them very clearly says, in a deep voice, "No, not my eye! Not my eye!
        Aaaaah!" The others find this extra-hilarious.
      pl: 'Potem wróżki odfruwają. Odlatując, jedna z nich bardzo wyraźnie mówi, głębokim głosem: »Nie, nie moje oko! Nie moje oko! Aaaaa!« Pozostałe
        uważają to za wyjątkowo zabawne.'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
  - etykieta: three
    wpisy:
    - id: sol_c794129c65272eaa05d5
      kontekst: textscripts.re_region2_companion_obie_mapunlock:line:24
      linia: 24
      sekcja_skryptu: three
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: You, uh... you think we should follow them?
      pl: Ty, eee... myślisz, że powinniśmy za nimi pójść?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: sol_57ae81e0f51e8a761234
      kontekst: textscripts.re_region2_companion_obie_mapunlock:line:25
      linia: 25
      sekcja_skryptu: three
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: We absolutely should not.
      pl: Absolutnie nie powinniśmy.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: sol_e340a51c01b106fa52b2
      kontekst: textscripts.re_region2_companion_obie_mapunlock:line:26
      linia: 26
      sekcja_skryptu: three
      typ: mapunlock
      mowca_lub_kanal: odblokowanie_mapy
      en: Faerie Lair
      pl: Matecznik Wróżek
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 4
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
