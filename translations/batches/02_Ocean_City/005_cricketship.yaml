        events, Gobulon Prime will be.</i>
      pl: <i>Nie martw się, nie jest to coś, co wy, ludzie, nazywacie „małpią łapką”. Wasza planeta nie zostanie poświęcona dla ratowania naszej
        ani nic w tym rodzaju. Lubimy waszą planetę. Jedyny haczyk polega na tym, że zamiast Nowej Yecchii 990 lat później jako skutek uboczny
        tych wydarzeń zostanie zniszczony Gobulon Prime.</i>
