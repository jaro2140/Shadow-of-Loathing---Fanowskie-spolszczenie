      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You hear raised voices and sounds of a commotion nearby, and head in that direction to check it out. As you get nearer, the voices become
        clearer -- someone's yelling for help! You pick up the pace and soon find a small glade in the middle of the woods, filled with odd little
        structures and large, beautifully-colored butterflies. Something feels a bit off about the whole scene though, so instead of rushing in,
        you crouch in the bushes and creep around the perimeter, looking for the source of the yelling.
      pl: Słyszysz podniesione głosy i odgłosy zamieszania w pobliżu, i ruszasz w tamtą stronę, żeby to sprawdzić. Im bliżej jesteś, tym wyraźniejsze
        stają się głosy -- ktoś woła o pomoc! Przyspieszasz kroku i wkrótce znajdujesz małą polanę pośrodku lasu, pełną dziwnych, małych konstrukcji
        i wielkich, pięknie kolorowych motyli. Coś jednak wydaje się nie tak z całą tą sceną, więc zamiast wpaść tam od razu, kucasz w krzakach
        i skradasz się wzdłuż obwodu, szukając źródła krzyków.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
