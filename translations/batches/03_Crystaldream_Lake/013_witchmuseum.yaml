      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: I ran into Tom at the church, playing with the other kids. He seems like a real smart cookie.
      pl: Spotkałem Toma w kościele, gdy bawi się z innymi dziećmi. Wygląda na naprawdę bystrego chłopaka.
