      linia: 17
      sekcja_skryptu: two
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Well, that's fair.
      pl: No, to akurat prawda.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_e193d6bd183f2be4948b
      kontekst: textscripts.re_region3_companion_obie_levelup:line:18
      linia: 18
      sekcja_skryptu: two
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: I'm working on my doctorate in Biosciences, and my thesis project is an experimental nutritional supplement. Would you be interested
        in volunteering for the clinical trial?
      pl: Pracuję nad doktoratem z nauk biologicznych, a mój projekt doktorski to eksperymentalny suplement odżywczy. Byłbyś zainteresowany zgłoszeniem się na ochotnika do badania klinicznego?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_95dcda1236993366ede8
      kontekst: textscripts.re_region3_companion_obie_levelup:line:19
