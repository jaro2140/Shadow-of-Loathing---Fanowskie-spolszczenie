      pl: Odwracasz się i uciekasz. Na szczęście dla ciebie borsuk też akurat w tej chwili postanawia dać drapaka. Na nieszczęście dla borsuka
        to właśnie jego wróżki postanawiają ścigać.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
