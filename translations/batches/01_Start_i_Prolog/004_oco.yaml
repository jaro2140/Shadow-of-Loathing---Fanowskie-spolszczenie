- kolejnosc_w_danych_gry: 2665
  skrypt: oco_intro
  pomieszczenie:
    id: oco
    nazwa_en: The Outskirts of Ocean City
  zagadka: false
  minigra_lub_feature: false
  liczba_wpisow: 10
  sekcje:
  - etykieta: start
    wpisy:
    - id: sol_52c161a381c38cb9ac63
      kontekst: textscripts.oco_intro:line:9
      linia: 9
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Before long, the bus arrives. The sky starts pouring rain as soon as you board. "Well now," the driver remarks, "looks like I made it
        just in time. Must be your lucky night, kiddo."
      pl: Wkrótce przyjeżdża autobus. Deszcz zaczyna lać, gdy tylko wsiadasz. »No proszę — mówi kierowca — zdążyłem w samą porę. To musi być twoja
        szczęśliwa noc, dzieciaku«.
      status: zatwierdzono
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: *id011
    - id: sol_1279928860886ea8820a
      kontekst: textscripts.oco_intro:line:13
      linia: 13
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The bus is empty, so you take a seat in the middle as the driver shuts the doors and pulls away from the diner.
      pl: Autobus jest pusty, więc siadasz pośrodku, a kierowca zamyka drzwi i odjeżdża spod baru.
      status: zatwierdzono
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: *id012
    - id: sol_ab2ed7a0f5777f117807
      kontekst: textscripts.oco_intro:line:16
      linia: 16
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: '"You on vacation?" the driver asks. "Ocean City used to be a big tourist spot, but I don''t get so many passengers these days."'
      pl: »Jedziesz na wakacje? — pyta kierowca. — Ocean City było kiedyś kurortem, ale dziś mam niewielu pasażerów«.
      status: zatwierdzono
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: *id013
    - id: sol_47a15a3ce37d07c27427
      kontekst: textscripts.oco_intro:line:17
      linia: 17
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: '"Kind of," you say. "I''m visiting an old friend."'
      pl: »Coś w tym rodzaju — mówisz. — Odwiedzam starego przyjaciela«.
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_1c8217a4a6a866ce87d1
      kontekst: textscripts.oco_intro:line:18
      linia: 18
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: '"Aw, that''s nice."'
      pl: »Och, to miłe«.
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_cf28e1c85ed52fa42f12
      kontekst: textscripts.oco_intro:line:19
      linia: 19
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You lean against the window and listen to the spattering rain. Murray's letter didn't sound nice. It sounded like he was in some kind
        of trouble.
      pl: Opierasz się o okno i słuchasz deszczu. List Murraya nie brzmiał dobrze. Wynikało z niego, że Murray wpadł w jakieś kłopoty.
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_00bb4567f9aab0c1c790
      kontekst: textscripts.oco_intro:line:22
      linia: 22
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Something he didn't want to talk about openly.
      pl: Coś, o czym nie chciał mówić otwarcie.
      status: zatwierdzono
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: *id014
    - id: sol_069bed8c1355e07bccc8
      kontekst: textscripts.oco_intro:line:26
      linia: 26
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Time passes as you think about Murray, and wonder what kind of trouble an antique dealer could get into, and why he'd need your help,
        of all people.
      pl: Czas mija na rozmyślaniach o Murrayu, kłopotach, w jakie może wpaść handlarz antykami, i powodach, dla których potrzebuje właśnie twojej
        pomocy.
      status: zatwierdzono
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: *id015
    - id: sol_e197c5981a028cb193d7
      kontekst: textscripts.oco_intro:line:27
      linia: 27
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: 'And then the bus stops. The driver gets off, grumbling, then calls to you: "Gonna need ya to step outside for a sec."'
      pl: 'Autobus się zatrzymuje. Kierowca wysiada, mamrocząc, po czym woła: »Musisz na chwilę wyjść«.'
      status: zatwierdzono
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: *id016
    - id: sol_f97a3de65a753c5f0c9c
      kontekst: textscripts.oco_intro:line:33
      linia: 33
      sekcja_skryptu: start
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Get off the bus
      pl: Wysiądź z autobusu
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
