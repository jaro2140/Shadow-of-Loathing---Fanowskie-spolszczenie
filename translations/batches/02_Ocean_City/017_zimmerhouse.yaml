      linia: 52
      sekcja_skryptu: secondno
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You've already spent all the time you care to devote to messing around with dust today.
      pl: Wyczerpałeś już dzienny limit czasu na zabawę kurzem.
