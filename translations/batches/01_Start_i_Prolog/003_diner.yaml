      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You shouldn't bother anybody until you get this magazine off your face.
      pl: Nie niepokój nikogo, dopóki nie zdejmiesz czasopisma z twarzy.
      status: zatwierdzono
      wspoldzielony_rekord: true
      liczba_wystapien: 3
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: *id001
    - id: sol_29c4f4903e51939e924c
      kontekst: textscripts.diner_convo3:line:7
      linia: 7
      sekcja_skryptu: popup
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: These two are still ranting about the problem with kids these days. Well, one of them is.
      pl: Wciąż trwa tyrada o dzisiejszej młodzieży. To znaczy tyrada jednej z tych osób.
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_2b35534d833cb328a881
      kontekst: textscripts.diner_convo3:line:10
      linia: 10
      sekcja_skryptu: popup
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: A couple of older folks are having an animated discussion. Well, one of them is.
      pl: Dwie starsze osoby prowadzą ożywioną dyskusję. A właściwie jedna z nich.
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_f48426500151fd9c0a95
      kontekst: textscripts.diner_convo3:line:11
      linia: 11
      sekcja_skryptu: popup
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Listen in
      pl: Podsłuchaj
      status: zatwierdzono
      wspoldzielony_rekord: true
      liczba_wystapien: 3
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: convo
    wpisy:
    - id: sol_0269a8708db78db75097
      kontekst: textscripts.diner_convo3:line:20
      linia: 20
      sekcja_skryptu: convo
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Hmph! The way these young women act these days, with their short hair and their sassy talk and their dresses that don't even cover their...
        their...
      pl: Hmpf! Jak te młode kobiety się dzisiaj zachowują, z krótkimi włosami, zuchwałymi odzywkami i sukienkami, które nie zasłaniają nawet...
        nawet ich...
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_b46905b4ab00f055d6ce
      kontekst: textscripts.diner_convo3:line:22
      linia: 22
      sekcja_skryptu: convo
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Ankles?
      pl: Kostek?
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_47336b790c531585d0e4
      kontekst: textscripts.diner_convo3:line:23
      linia: 23
      sekcja_skryptu: convo
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: It's scandalous! And those dances they do, flailin' around like I don't know what! I'd've thought Prohibition would've put the kibosh
        on that sort of tomfoolery, but nossir!
      pl: To skandal! A te ich tańce — wymachują kończynami jak opętane! Można by sądzić, że prohibicja ukróci takie błazeństwa, ale gdzie tam!
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_4e14232b2f92eaa13846
      kontekst: textscripts.diner_convo3:line:24
      linia: 24
      sekcja_skryptu: convo
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Can't imagine dancing a waltz to the music they're playing nowadays, though.
      pl: Choć trudno wyobrazić sobie walca do muzyki, którą grają w dzisiejszych czasach.
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_e69b45f51a42f4635052
      kontekst: textscripts.diner_convo3:line:25
      linia: 25
      sekcja_skryptu: convo
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: And that's the problem right there! This newfangled jazz music with all the drums and... and... clarinets and such. What kinda word
        is that, anyway? <i>Jazz.</i>
      pl: I w tym właśnie problem! Ta nowomodna muzyka jazzowa, te wszystkie bębny i... i... klarnety czy inne takie. Co to w ogóle za słowo?
        <i>Jazz.</i>
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_19aa65f2b40bde9fd9af
      kontekst: textscripts.diner_convo3:line:26
      linia: 26
      sekcja_skryptu: convo
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: I think our cups got switched. You're supposed to be drinking decaf.
      pl: Chyba zamieniono nam filiżanki. To ty masz pić bezkofeinową.
      status: zatwierdzono
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_4fd785f2d795c2e5b890
      kontekst: textscripts.diner_convo3:line:27
      linia: 27
      sekcja_skryptu: convo
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Leave
      pl: Odejdź
      status: zatwierdzono
      wspoldzielony_rekord: true
      liczba_wystapien: 435
      tokeny_techniczne: []
      zagadka: false
