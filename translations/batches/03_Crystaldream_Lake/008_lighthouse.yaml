      linia: 36
      sekcja_skryptu: askcompass
      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: What? No, certainly not. I need that.
      pl: Co? Nie, oczywiście, że nie. Potrzebuję go.
