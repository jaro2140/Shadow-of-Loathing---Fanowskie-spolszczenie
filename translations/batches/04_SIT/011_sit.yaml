      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: '@sit_librarythedean|This old man,Dean Wormwood@ is chanting something in a language you can''t understand, apparently conducting some
        kind of dark ritual -- with a rather important-looking book. Which, you''ll have already noticed, is generating some kind of ominous dark
        portal.'
