      kontekst: textscripts.re_region3_fight_math1:line:12
      linia: 12
      sekcja_skryptu: solution
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You take a deep breath, adjust your assumptions about geometry to accomodate a less Euclidian viewpoint, and manage to find a gap between
        two walls that's wide (or tall, or perhaps deep) enough to escape through. You emerge from the doorway you originally entered, and as
        far as you can tell, your heart is still on the correct side of your body.
      pl: Bierzesz głęboki oddech, dostosowujesz swoje założenia o geometrii do mniej euklidesowego punktu widzenia i udaje ci się znaleźć szczelinę między dwoma ścianami wystarczająco szeroką (albo wysoką, albo może głęboką), żeby przez nią uciec. Wychodzisz przez drzwi, którymi pierwotnie wszedłeś, i o ile możesz stwierdzić, twoje serce nadal jest po właściwej stronie ciała.
