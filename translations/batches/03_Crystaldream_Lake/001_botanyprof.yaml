      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: '<i>"New idea: the successful tomato/bone marrow transplant implies the possibility of the reverse procedure: transplanting plant organ
        structures into a mammalian subject. Must investigate."</i>'
      pl: '<i>„Nowy pomysł: udany przeszczep pomidor–szpik kostny sugeruje możliwość odwrócenia procedury, czyli przeszczepiania struktur organów
        roślinnych ssakowi. Koniecznie zbadać”.</i>'
