      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You quickly skim the experimenter's notes, grab a soldering iron, and make the necessary repairs. Even the wisps are impressed by your
        intelligence and handiness -- one of them gives you a grudging thumbs-up from behind the reactor's tempered glass window.
      pl: Szybko przeglądasz notatki eksperymentatora, chwytasz lutownicę i wykonujesz niezbędne naprawy. Nawet ogniki są pod wrażeniem twojej inteligencji i zręczności — jeden z nich daje ci niechętny kciuk w górę zza hartowanej szyby reaktora.
      status: do_korekty
      wspoldzielony_rekord: false
