      kontekst: textscripts.zimmerhouse_puddle:line:66
      linia: 66
      sekcja_skryptu: thirdno
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: There's nothing else of interest in the box of THINGS.
      pl: W pudle z RZECZAMI nie ma już nic ciekawego.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
