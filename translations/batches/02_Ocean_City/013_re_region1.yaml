      en: You shove past the fishmen, whose slimy hands can't find purchase to grab you, and stride away. They glurble angrily at you, but either
        they're too startled to make any further issue of it, or they're trying to basically keep a low profile. Either way, you make it out of
        there unscathed -- except for the fish slime.
