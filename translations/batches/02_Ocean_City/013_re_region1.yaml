  sekcje:
  - etykieta: start
    wpisy:
    - id: sol_4785d72ae09ffe411832
      kontekst: textscripts.re_region1_companion_adams_levelup:line:2
      linia: 2
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Dr. Adams spots an abandoned newspaper on a park bench and picks it up.
      pl: Dr Adams dostrzega na ławce parkowej porzuconą gazetę i ją podnosi.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_698ca2ea64ab1f8df268
      kontekst: textscripts.re_region1_companion_adams_levelup:line:4
      linia: 4
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Aha, a modern News-Paper! "Economy Soaring, with No End in Sight", it ſays. "Things Are Just Going to Keep Getting Better Forever."
        This is moſt encouraging!
      pl: Aha, nowoczesna Gazeta! „Gospodarka Wzlatuje, Bez Widoku na Koniec”, głosi. „Sprawy Będą się Już Tylko Wiecznie Polepszać”. To niezmiernie krzepiące!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_89d55063cec36dc1dfb8
      kontekst: textscripts.re_region1_companion_adams_levelup:line:6
      linia: 6
      sekcja_skryptu: start
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Yeah, things have been going really well since the end of the Cola War. Lots of advances in technology and infrastructure, tons of people
        are moving to the big cities, people are investing millions in the stock market and it just keeps going up and up... Basically, everything's
        going super well economically, and there's no sign that rampant unchecked speculation might ever cause any kind of problem.
      pl: Ta, sprawy idą naprawdę dobrze od zakończenia Wojen Coli. Mnóstwo postępu w technologii i infrastrukturze, masa ludzi przeprowadza się do wielkich miast, ludzie inwestują miliony na giełdzie i to po prostu wciąż rośnie i rośnie... W zasadzie wszystko idzie super dobrze pod względem ekonomicznym i nic nie wskazuje, żeby niepohamowana, niekontrolowana spekulacja mogła kiedykolwiek spowodować jakikolwiek problem.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_4cb12b3c74f4fa914161
      kontekst: textscripts.re_region1_companion_adams_levelup:line:7
      linia: 7
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: That is marvellous news. I muſt comment, however, that Ocean City does not appear to be benefiting from this increaſed Proſperity.
      pl: To wspaniała nowina. Muszę jednak zauważyć, że Ocean City nie zdaje się korzystać z tego zwiększonego Dobrobytu.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_c05817a5820555df0aa9
      kontekst: textscripts.re_region1_companion_adams_levelup:line:8
      linia: 8
      sekcja_skryptu: start
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: That's a little strange, isn't it?
      pl: To trochę dziwne, prawda?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: two
    wpisy:
    - id: sol_c1a2e21330cb152b8a61
      kontekst: textscripts.re_region1_companion_adams_levelup:line:12
      linia: 12
      sekcja_skryptu: two
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: That's a little strange, isn't it? I guess it's something going on with local government, but I don't really get it. The rest of the
        country's doing great.
      pl: To trochę dziwne, prawda? Chyba coś się dzieje w lokalnym samorządzie, ale niezupełnie to rozumiem. Reszcie kraju idzie świetnie.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_136f25ab86f68e77db91
      kontekst: textscripts.re_region1_companion_adams_levelup:line:13
      linia: 13
      sekcja_skryptu: two
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: A minor ſlump, undoubtedly. I'm ſure the ſituation will improve by and by.
      pl: Niewielkie Załamanie, bez wątpienia. Jestem pewien, że Sytuacja z czasem się poprawi.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_ac92dcffdfdf4148e5d9
      kontekst: textscripts.re_region1_companion_adams_levelup:line:14
      linia: 14
      sekcja_skryptu: two
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Yeah, you're probably right. It's the Roaring Twenties, a period of unlimited wealth and profound social liberation! What could possibly
        go wrong?
      pl: Ta, pewnie masz rację. To przecież szalone lata dwudzieste, okres nieograniczonego bogactwa i głębokiego wyzwolenia społecznego! Co może pójść źle?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_f933186b4a2ed3b85cc2
      kontekst: textscripts.re_region1_companion_adams_levelup:line:16
      linia: 16
      sekcja_skryptu: two
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Continue
      pl: Kontynuuj
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 78
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: &id001 []
- kolejnosc_w_danych_gry: 3183
  skrypt: re_region1_companion_adams_mapunlock
  pomieszczenie: null
  zagadka: true
  minigra_lub_feature: false
  liczba_wpisow: 6
  sekcje:
  - etykieta: start
    wpisy:
    - id: sol_ce90896be923cca76de5
      kontekst: textscripts.re_region1_companion_adams_mapunlock:line:3
      linia: 3
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Things have changed ſo much in the City ſince I was laſt here. I don't recognize any of theſe Buildings. And they are ſo tall!
      pl: Tyle się zmieniło w Mieście, odkąd byłem tu ostatnio. Nie rozpoznaję żadnego z tych Budynków. I są takie Wysokie!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: sol_4d772fac99b8bb079446
      kontekst: textscripts.re_region1_companion_adams_mapunlock:line:5
      linia: 5
      sekcja_skryptu: start
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: There's been a lot of advancement in architecture in the last two hundred years, yeah. Concrete, for example. And uh... rivets?
      pl: W ostatnich dwustu latach było mnóstwo postępu w architekturze, tak. Beton, na przykład. I, eee... nity?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: sol_3f65a6afa96e97edbec3
      kontekst: textscripts.re_region1_companion_adams_mapunlock:line:6
      linia: 6
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: As faſcinated as I am by theſe new experiences, I do find it mildly overwhelming. I believe there was a nice little Cathedral in this
        Neighborhood, is it ſtill there? A familiar ſight would do me ſome good.
      pl: Choć jestem tak zafascynowany tymi nowymi doświadczeniami, przyznaję, że przytłacza mnie to nieco. Wydaje mi się, że w tej Okolicy była
        miła, mała Katedra, czy nadal tam stoi? Znajomy widok dobrze by mi zrobił.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: sol_e266e11454f7b7cfe22e
      kontekst: textscripts.re_region1_companion_adams_mapunlock:line:7
      linia: 7
      sekcja_skryptu: start
      typ: mapunlock
      mowca_lub_kanal: odblokowanie_mapy
      en: St. Polycarp's Cathedral
      pl: Katedra św. Polikarpa
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 3
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: &id004 []
    - id: sol_00ccc631633c06bdde76
      kontekst: textscripts.re_region1_companion_adams_mapunlock:line:8
      linia: 8
      sekcja_skryptu: start
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: Sure, let's look for it.
      pl: Jasne, poszukajmy jej.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: sol_607c4abd21cc0f6069d3
      kontekst: textscripts.re_region1_companion_adams_mapunlock:line:9
      linia: 9
      sekcja_skryptu: start
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: We'll look on the way back.
      pl: Zajrzymy tam w drodze powrotnej.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
