      kontekst: textscripts.zimmerhouse_puddle:line:58
      linia: 58
      sekcja_skryptu: third
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: This shelf has a box labelled "THINGS." It's full of little screws, rubber bands, stuff like that. Looks like when Zimmer's kitchen
        junk drawer gets too full, he just dumps it in here.
      pl: Na półce stoi pudło z napisem „RZECZY”. Jest pełne śrubek, gumek recepturek i podobnych drobiazgów. Wygląda na to, że kiedy szuflada
        na szpargały w kuchni Zimmera się przepełnia, cała zawartość ląduje tutaj.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_ffa434e1f15629e15706
      kontekst: textscripts.zimmerhouse_puddle:line:59
      linia: 59
      sekcja_skryptu: third
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Since you're already looking, you sift through it for a second and find a fuse that still looks good. Zimmer probably won't mind --
        or ever even know -- if you pocket it.
      pl: Skoro już tu zaglądasz, przez chwilę grzebiesz w zawartości i znajdujesz bezpiecznik, który nadal wygląda na sprawny. Zimmer pewnie
        nie będzie mieć nic przeciwko — ani nawet nigdy się nie dowie — jeśli schowasz go do kieszeni.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: thirdno
