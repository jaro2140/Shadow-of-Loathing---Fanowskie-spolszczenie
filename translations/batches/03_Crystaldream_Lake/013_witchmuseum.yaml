    - id: sol_50c18b174de85c5f8ba1
      kontekst: textscripts.witchmuseum_missputnam:line:49
      linia: 49
      sekcja_skryptu: dolls
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: I've read her old diaries. Apparently, the three-arms thing took off after she and her friend Patricia got into a squabble of some kind,
        and a passing traveller helped them make up. They became best friends after that.
      pl: Czytałam jej stare pamiętniki. Najwyraźniej moda na trzy ręce zaczęła się po jakiejś sprzeczce z jej przyjaciółką Patricią i po tym,
        jak przejezdny pomógł im się pogodzić. Później zostały najlepszymi przyjaciółkami.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
