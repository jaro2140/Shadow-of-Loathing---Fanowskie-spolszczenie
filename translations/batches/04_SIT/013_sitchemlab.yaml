      sekcja_skryptu: e
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Unfortunately, the pages are so old and stiff, you can't even turn them. Well, shucks.
      pl: Niestety strony są tak stare i sztywne, że nie da się ich nawet przewrócić. No masz.
