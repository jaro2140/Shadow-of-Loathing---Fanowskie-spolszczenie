      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: And, just to make a bad scene even worse, it looks like a whole gang of those horrible little faeries have made a home in here.
      pl: Jakby sytuacja nie była dość zła, wygląda na to, że zamieszkała tu cała banda tych okropnych małych wróżek.
