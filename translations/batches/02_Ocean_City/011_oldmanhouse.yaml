- kolejnosc_w_danych_gry: 2753
  skrypt: oldmanhouse_thief
  pomieszczenie:
    id: oldmanhouse_secretroom
    nazwa_en: Captain Durch's House (Secret Room)
  zagadka: false
  minigra_lub_feature: false
  liczba_wpisow: 35
  sekcje:
  - etykieta: start
    wpisy:
    - id: sol_10630293e81df9191b3b
      kontekst: textscripts.oldmanhouse_thief:line:5
      linia: 5
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Hey! What are you doing in... um.
      pl: Hej! Co robisz w... eee.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_a403c343d3951ed35ee8
      kontekst: textscripts.oldmanhouse_thief:line:7
      linia: 7
      sekcja_skryptu: start
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Were you seriously about to ask <i>me</i> what <i>I'm</i> doing in here?
      pl: Naprawdę chciałeś zapytać <i>mnie</i>, co <i>ja</i> tu robię?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_c4a4bef1495f22bc354c
      kontekst: textscripts.oldmanhouse_thief:line:8
      linia: 8
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Yeah, even as I was saying it, it sounded stupid. How did you find me?
      pl: Tak, już podczas mówienia brzmiało głupio. Jak mnie znalazłeś?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_ba262a63a7c780179cd4
      kontekst: textscripts.oldmanhouse_thief:line:9
      linia: 9
      sekcja_skryptu: start
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: I hid and watched when you came out for your smokes.
      pl: Ukryłem się i patrzyłem, jak wychodziłeś po papierosy.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_8a0d9e135030b137dc6a
      kontekst: textscripts.oldmanhouse_thief:line:10
      linia: 10
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Ohh, that was you, huh? I thought the Cap'm's voice didn't sound quite right.
      pl: Ooo, więc to byłeś ty, tak? Zdawało mi się, że głos kapitana brzmi jakoś nie tak.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_193ab9a41c218a4017dc
      kontekst: textscripts.oldmanhouse_thief:line:11
      linia: 11
      sekcja_skryptu: start
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: So what's the deal?
      pl: O co chodzi?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: two
    wpisy:
    - id: sol_ae9078c45e7ae591236c
      kontekst: textscripts.oldmanhouse_thief:line:16
      linia: 16
      sekcja_skryptu: two
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Well, it's basically just what it looks like.
      pl: W zasadzie wszystko jest takie, jak wygląda.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_9c230eb8c02bdcba8fc3
      kontekst: textscripts.oldmanhouse_thief:line:17
      linia: 17
      sekcja_skryptu: two
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: It looks like you're hiding in this old man's house to rob him while he sleeps.
      pl: Wygląda, jakbyś ukrywał się w domu starca, żeby obrabować go podczas snu.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_98d7ab1a79c18992321e
      kontekst: textscripts.oldmanhouse_thief:line:18
      linia: 18
      sekcja_skryptu: two
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: In that case, it's not at all what it looks like.
      pl: W takim razie nic nie jest takie, jak wygląda.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_0f418dff9ca4f326af5a
      kontekst: textscripts.oldmanhouse_thief:line:19
      linia: 19
      sekcja_skryptu: two
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: I'm listening.
      pl: Słucham.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_fab66ad7fb6ae1e402ec
      kontekst: textscripts.oldmanhouse_thief:line:20
      linia: 20
      sekcja_skryptu: two
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: I'll admit, at first I was planning on robbing him. I figured an old sea captain must have a secret treasure, right?
      pl: Przyznaję, na początku planowałem go okraść. Pomyślałem, że stary kapitan żeglugi musi mieć jakiś ukryty skarb, nie?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_c674be3fd05fd4970f5b
      kontekst: textscripts.oldmanhouse_thief:line:21
      linia: 21
      sekcja_skryptu: two
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: He wasn't a <i>pirate!</i>
      pl: Nie był <i>piratem!</i>
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: three
    wpisy:
    - id: sol_cd202b13b5c79eece04c
      kontekst: textscripts.oldmanhouse_thief:line:26
      linia: 26
      sekcja_skryptu: three
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: No, it turned out he's just a lonely old man with nobody to talk to. Except, well, his old sailing buddies. So I started hanging out
        back here and chatting with him through the wall.
      pl: Nie, okazało się, że to po prostu samotny staruszek, który nie ma z kim rozmawiać. No, poza dawnymi kompanami z pokładu. Zacząłem więc przesiadywać tu z tyłu i gadać z nim przez ścianę.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_928c35c2157257c12052
      kontekst: textscripts.oldmanhouse_thief:line:27
      linia: 27
      sekcja_skryptu: three
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: He didn't find it strange?
      pl: Nie wydało mu się to dziwne?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_b41a0e986c8c75d3c0da
      kontekst: textscripts.oldmanhouse_thief:line:28
      linia: 28
      sekcja_skryptu: three
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: He was a little spooked at first, but once I'd gotten a handle on how the different voices should sound and learned enough to keep up
        with the anecdotes, he relaxed. It's nice to have someone to talk to, even if the situation is kind of weird, right?
      pl: Z początku trochę się spłoszył, ale kiedy już wyczułem, jak powinny brzmieć poszczególne głosy, i nauczyłem się dość, żeby nadążać za anegdotami, rozluźnił się. Miło mieć z kim porozmawiać, nawet jeśli sytuacja jest trochę dziwna, nie?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_8a0d5502bd77bf2f7691
      kontekst: textscripts.oldmanhouse_thief:line:29
      linia: 29
      sekcja_skryptu: three
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: So that's all? You do this just because you feel sorry for him?
      pl: To wszystko? Robisz to tylko dlatego, że ci go żal?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: four
    wpisy:
    - id: sol_7500084e183ccf9b82fe
      kontekst: textscripts.oldmanhouse_thief:line:34
      linia: 34
      sekcja_skryptu: four
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Yeah, well, I won't pretend I don't like having somewhere to stay rent-free. And his pension from the shipping company is pretty good,
        and his short-term memory is kinda bad, so he doesn't pay much attention to the fact that he's buying food for two people.
      pl: No tak, ale nie będę udawał, że nie odpowiada mi miejsce do spania bez czynszu. A emeryturę z firmy żeglugowej ma całkiem niezłą i kiepską pamięć krótkotrwałą, więc nie zwraca specjalnie uwagi na to, że kupuje jedzenie dla dwóch osób.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_a11d0c70d3c9a41591c3
      kontekst: textscripts.oldmanhouse_thief:line:35
      linia: 35
      sekcja_skryptu: four
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Hmm.
      pl: Hm.
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 5
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_9fedc97ffc483ac6c772
      kontekst: textscripts.oldmanhouse_thief:line:36
      linia: 36
      sekcja_skryptu: four
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: He's a good guy, and it's an easy life. Don't screw it up for us, okay?
      pl: To dobry człowiek, a życie tu jest łatwe. Nie zepsuj nam tego, dobra?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_0b5508cbf5d83fe83b07
      kontekst: textscripts.oldmanhouse_thief:line:37
      linia: 37
      sekcja_skryptu: four
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: '...Wait, what is it to you, anyway?'
      pl: '...Chwila, co cię to obchodzi?'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_0bcea846e699440e573f
      kontekst: textscripts.oldmanhouse_thief:line:38
      linia: 38
      sekcja_skryptu: four
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: I'm here about the stolen urn.
      pl: Chodzi o skradzioną urnę.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: five
    wpisy:
    - id: sol_f922a0961ce3ca3d272f
      kontekst: textscripts.oldmanhouse_thief:line:43
      linia: 43
      sekcja_skryptu: five
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Oh. Yeah, that was probably a mistake. He'd mentioned the fifth sailor a few times, so I thought he might like to have the whole crew
        together, you know? So I lifted a random urn from that little cathedral, to fill the spot. It seemed like a good idea at the time.
      pl: Och. No tak, to był chyba błąd. Kilka razy wspominał o piątym marynarzu, więc pomyślałem, że może chciałby mieć całą załogę w komplecie, wiesz? Zwinąłem więc przypadkową urnę z tej małej katedry, żeby zapełnić puste miejsce. Wtedy wydawało mi się to dobrym pomysłem.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_d08ef3e03a4f2624c51f
      kontekst: textscripts.oldmanhouse_thief:line:44
      linia: 44
      sekcja_skryptu: five
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: The vicar needs it back.
      pl: Wikariusz chce ją odzyskać.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_02a1243b8b729ffca835
      kontekst: textscripts.oldmanhouse_thief:line:45
      linia: 45
      sekcja_skryptu: five
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Okay. It'll be weird if it just vanishes, though. Can you swap it for another one? The Cap'm doesn't open them, so he won't notice if
        there's no ashes in it.
      pl: Dobra. Ale będzie dziwnie, jeśli po prostu zniknie. Możesz ją podmienić na inną? Kapitan ich nie otwiera, więc nie zauważy, że w środku nie ma prochów.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_c89e86f261ac8cc1b696
      kontekst: textscripts.oldmanhouse_thief:line:48
      linia: 48
      sekcja_skryptu: five
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: Fine, I'll see what I can do.
      pl: Dobrze, coś wymyślę.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: waiting
    wpisy:
    - id: sol_12e8fbf94a4626c1b253
      kontekst: textscripts.oldmanhouse_thief:line:54
      linia: 54
      sekcja_skryptu: waiting
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Did you switch out that fifth urn yet?
      pl: Podmieniłeś już piątą urnę?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
