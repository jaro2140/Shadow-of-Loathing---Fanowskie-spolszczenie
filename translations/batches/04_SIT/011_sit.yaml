      linia: 7
      sekcja_skryptu: start
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Oh, no, I'm just looking for a book.
      pl: Och, nie. Szukam tylko książki.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_664f4eaf82cd74dabae3
      kontekst: textscripts.sit_libraryenter:line:8
      linia: 8
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: I'm sorry, the Institute's library is only for students, alumni, and faculty.
      pl: Przykro mi, biblioteka Instytutu jest przeznaczona wyłącznie dla studentów, absolwentów i pracowników.
