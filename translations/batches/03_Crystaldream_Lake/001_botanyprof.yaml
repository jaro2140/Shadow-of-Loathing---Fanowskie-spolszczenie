      sekcja_skryptu: salad6
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: There's also a plant that has sprouted some berries of similar size and shape, except they're white. Well, not exactly white. Sort of
        off-white, except the 'off' part isn't quite the same color you get in normal off-white.
      pl: Jest też roślina z jagodami podobnej wielkości i kształtu, tyle że białymi. No, nie całkiem białymi. Raczej złamaną bielą, tylko część
        odpowiedzialna za „złamanie” ma inny kolor niż zwykle.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
