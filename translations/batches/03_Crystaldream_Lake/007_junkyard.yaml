      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You move toward them slowly so to not startle them, and as you get closer you realize that instead of having regular insect bodies,
        they're little people! Faeries! Wow!
      pl: Powoli podchodzisz, by ich nie spłoszyć, i z bliska odkrywasz, że zamiast zwykłych owadzich ciał mają maleńkich ludzi! Wróżki! Rany!
