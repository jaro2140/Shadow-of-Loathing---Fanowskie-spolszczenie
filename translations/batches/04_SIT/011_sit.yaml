      linia: 248
      sekcja_skryptu: pyramid2
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Consider yourself lucky. Shovel Balfour, the former archaeology professor, fled his office through the window one day, leaving a hundred
        students with ungraded term papers. Unable to advance to the next semester, those students are <i>stuck</i> in academic limbo! Some say
        they can still be heard wandering these halls at night, wailing like banshees.
      pl: Masz szczęście. Shovel Balfour, były profesor archeologii, pewnego dnia uciekł z gabinetu przez okno, zostawiając setkę studentów z
        nieocenionymi pracami semestralnymi. Nie mogą przejść do następnego semestru, więc <i>utknęli</i> w akademickim czyśćcu! Podobno nadal
        nocami błąkają się po korytarzach i zawodzą jak banshee.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
