      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Big Liz stands up, and you take her seat on the Crescent Throne. It's cold, and not very comfortable, but it does make you feel pretty
        powerful.
      pl: Wielka Liz wstaje, a ty zajmujesz jej miejsce na Półksiężycowym Tronie. Jest zimny i niezbyt wygodny, ale daje poczucie sporej władzy.
