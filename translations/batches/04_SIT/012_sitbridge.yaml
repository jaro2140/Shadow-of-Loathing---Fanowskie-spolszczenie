      kontekst: textscripts.fishnest_hole:line:32
      linia: 32
      sekcja_skryptu: e
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The hole ruminates on your presence for a moment, and then spits you back out. Guess you don't taste fishmanny enough. Fishmanly?
      pl: Dziura chwilę przeżuwa twoją obecność, po czym wypluwa cię z powrotem. Chyba nie smakujesz dostatecznie ryboludzko. Ryboludnie?
