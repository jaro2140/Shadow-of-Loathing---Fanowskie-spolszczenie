      linia: 13
      sekcja_skryptu: look
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: This ragdoll has a bunch of old pins and needles stuck into it, and for some reason has the word "BORING" embroidered across its front.
      pl: W tę szmacianą lalkę wbito mnóstwo starych szpilek i igieł, a z jakiegoś powodu na jej przodzie wyhaftowano słowo „NUDA”.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_abb68438830c3ae1dcf0
      kontekst: textscripts.witchmuseum_poppet:line:14
      linia: 14
      sekcja_skryptu: look
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The little plaque on the front of the plinth says, "Witches frequently used special dolls, called <i>poppets</i>, to curse their enemies.
        This one was apparently made to target a Mrs. or Miss Boring, though no one of that name is listed in the town records.\"
      pl: 'Mała tabliczka z przodu postumentu głosi: „Czarownice często używały specjalnych lalek zwanych <i>kukłami</i>, aby rzucać klątwy na
        swoich wrogów. Ta najwyraźniej miała za cel panią lub pannę Nuda, choć w miejskich rejestrach nie figuruje nikt o takim nazwisku.\"'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi:
      - '[DO PÓŹNIEJSZEJ WERYFIKACJI] Żart opiera się na napisie BORING jako rzekomym nazwisku; zastosowano „NUDA/pani Nuda”. Sprawdzić równocześnie
        haft na grafice lub modelu lalki.'
    - id: sol_7d40d2ca3579c765a388
      kontekst: textscripts.witchmuseum_poppet:line:15
      linia: 15
      sekcja_skryptu: look
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: 'And then in tiny text at the bottom of the plaque:'
      pl: 'A na samym dole tabliczki drobnym drukiem:'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
