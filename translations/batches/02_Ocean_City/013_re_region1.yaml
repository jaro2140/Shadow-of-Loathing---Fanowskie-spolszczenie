      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: A thing that appears to be a hole in physical space, the opposite not just of matter but of <i>existence</i>, hovers toward you. Through
        it, you can see the faint twinkling lights of ancient dying stars, and the black smoke drifting out of it appears to be more of itself
        -- more nothingness, or perhaps <i>antithing</i>-ness leaking into this world.
      pl: Rzecz, która wygląda jak dziura w fizycznej przestrzeni, przeciwieństwo nie tylko materii, ale i samego <i>istnienia</i>, unosi się w twoją stronę. Przez nią widać słabe migotanie starożytnych, umierających gwiazd, a czarny dym, który się z niej wydobywa, zdaje się być kolejną porcją tego samego — kolejną porcją nicości, a może <i>antyrzeczowości</i> przeciekającej do tego świata.
