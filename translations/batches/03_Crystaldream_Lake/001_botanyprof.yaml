      sekcja_skryptu: salad7
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: 'Now you just need some kind of dressing to top this all off. Luckily, there''s two bottles in the fridge door: one filled with something
        gray and labelled "Blue Cheese Dressing", and one filled with a bright pink liquid and a handwritten label that says "#3" with a skull
        and crossbones.'
      pl: 'Potrzebny już tylko sos wieńczący dzieło. Na szczęście w drzwiach lodówki są dwie butelki: jedna z szarą substancją, opisana „Sos z
        sera pleśniowego”, druga z jaskraworóżowym płynem i odręczną etykietą „Nr 3” z czaszką i piszczelami.'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
