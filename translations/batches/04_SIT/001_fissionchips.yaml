      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Huh? Oh, yeah, just... since all the students are gone, there practically hasn't been anyone in here all day except for that one guy
        gorging himself.
      pl: Co? Och, tak, tylko... odkąd wszyscy studenci zniknęli, przez cały dzień prawie nikogo tu nie było poza tamtym gościem, który się obżera.
