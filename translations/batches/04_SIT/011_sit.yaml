      linia: 177
      sekcja_skryptu: minor3
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: You've only been seeing the western hemisphere of the sky. You need to see the southern hemisphere as well.
      pl: Widzisz tylko zachodnią półkulę nieba. Potrzebna jest również południowa.
