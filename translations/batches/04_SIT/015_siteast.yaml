  - etykieta: better
    wpisy:
    - id: sol_3c7e0a7a9187a4f7310a
      kontekst: textscripts.siteast_cookingstation5:line:42
      linia: 42
      sekcja_skryptu: better
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You garnish a dish of ice cream with a sliced banana, pour on a layer of hot fudge, and top it with chopped nuts, whipped cream, and
        a maraschino cherry -- a pitch-perfect traditional ice cream sundae.
      pl: Przybierasz lody plasterkami banana, polewasz gorącym sosem czekoladowym, a na wierzch kładziesz siekane orzechy, bitą śmietanę i wisienkę
        koktajlową — bezbłędny, klasyczny deser lodowy.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_cf571818ec76c44772f5
      kontekst: textscripts.siteast_cookingstation5:line:43
      linia: 43
      sekcja_skryptu: better
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Now that's a dessert worth screaming about, or at least a loud gasp.
      pl: Oto deser, o którym warto krzyczeć. Albo przynajmniej głośno westchnąć.
      status: do_korekty
