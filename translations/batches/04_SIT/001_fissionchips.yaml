      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The mug has "I'm with stupid" printed on it, with an arrow pointing toward the handle.
      pl: Na kubku widnieje napis „Jestem z głupkiem”, a strzałka wskazuje uchwyt.
