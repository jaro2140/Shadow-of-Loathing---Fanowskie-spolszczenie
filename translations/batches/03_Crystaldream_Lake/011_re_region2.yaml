      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: It's a swarm of ultragnats!  You remember learning in college that their wings flap hundreds of times faster than the wings of normal
        gnats. Nobody knows why; the leading theory is that they're just overachievers.
      pl: To rój ultrameszek! Przypominasz sobie ze studiów, że ich skrzydła machają setki razy szybciej niż skrzydła zwykłych meszek. Nikt nie
        wie, czemu; wiodąca teoria mówi, że to po prostu nadgorliwcy.
