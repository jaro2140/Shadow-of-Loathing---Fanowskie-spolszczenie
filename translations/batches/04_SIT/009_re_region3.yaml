      linia: 16
      sekcja_skryptu: two
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Fail to outrun them
      pl: Nie zdołaj ich przegonić
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: true
      uwagi: []
  - etykieta: solution
    wpisy:
    - id: sol_1adb6a74dd9aa6b80734
      kontekst: textscripts.re_region3_fight_mob2:line:20
      linia: 20
      sekcja_skryptu: solution
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You take a sudden hard left turn and stop dead, with your back pressed up against the corner of the building. The mob guys shoot past
        you, too fast to react to your feint, and crash into a fruit cart, completely obliterating it.
      pl: Skręcasz nagle ostro w lewo i zatrzymujesz się gwałtownie, plecami przyciśnięty do rogu budynku. Mafijni goście przelatują obok ciebie,
        zbyt szybko, żeby zareagować na twój fortel, i wpadają na wózek z owocami, kompletnie go rozwalając.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: true
      uwagi: []
    - id: sol_7e12fdb1fb1fd48fd584
      kontekst: textscripts.re_region3_fight_mob2:line:21
      linia: 21
      sekcja_skryptu: solution
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: When they poke their heads up out of the pile of fruit and wreckage, they have bananas sticking out of their ears, eyes, and mouth,
        respectively, like those three monkeys in a cartoon. Which makes me wish this was a cartoon instead of purely textual, because I bet that
        would be pretty funny.
      pl: Kiedy wystawiają głowy ze sterty owoców i gruzu, mają banany wystające, odpowiednio, z uszu, oczu i ust, jak te trzy małpki z kreskówki.
        Co sprawia, że żałuję, że to nie jest kreskówka zamiast czystego tekstu, bo założę się, że byłoby to całkiem zabawne.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: true
      uwagi: []
    - id: sol_c7c85588c7943a81a127
      kontekst: textscripts.re_region3_fight_mob2:line:22
      linia: 22
      sekcja_skryptu: solution
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Except for the fact that the guy with bananas sticking out of his eye sockets is probably dead. That doesn't seem surviveable.
      pl: Pomijając fakt, że gość z bananami wystającymi z oczodołów jest prawdopodobnie martwy. To nie wygląda na coś, co da się przeżyć.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: true
      uwagi: []
    - id: sol_17b1796bbbf3f5afc7fe
      kontekst: textscripts.re_region3_fight_mob2:line:24
      linia: 24
      sekcja_skryptu: solution
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Yikes
      pl: O rety
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: true
      uwagi: []
