      linia: 3
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You wander through a doorway marked "Department of Esoteric and Forbidden Mathematics," and immediately get lost -- despite the fact
        that it was a single straight hallway without any intersections. The walls and floor meet at weird angles, and I didn't mention the ceiling
        because there isn't one, just another wall.
      pl: Wędrujesz przez drzwi oznaczone „Wydział Ezoterycznej i Zakazanej Matematyki” i natychmiast się gubisz — mimo że to pojedynczy, prosty korytarz bez żadnych skrzyżowań. Ściany i podłoga spotykają się pod dziwnymi kątami, a o suficie nie wspomniałem, bo go nie ma, jest tylko kolejna ściana.
      status: do_korekty
      wspoldzielony_rekord: false
