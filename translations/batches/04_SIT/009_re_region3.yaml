    - id: sol_00392a3b900645325e2a
      kontekst: textscripts.re_region3_fight_mob2:line:3
      linia: 3
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: So you're walking down a street on the S.I.T. campus, when suddenly three mob guys round the corner in front of you. They stare at you
        for a second, and then one of them points at you.
      pl: Więc idziesz ulicą przez kampus S.I.T., kiedy nagle zza rogu wychodzi trzech ludzi Mafii przed tobą. Patrzą na ciebie przez chwilę, po czym jeden z nich wskazuje na ciebie palcem.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
