- kolejnosc_w_danych_gry: 3284
  skrypt: re_region2_fight_shadow1
  pomieszczenie: null
  zagadka: false
  minigra_lub_feature: true
  liczba_wpisow: 83
  sekcje:
  - etykieta: start
    wpisy:
    - id: sol_260231427efea704c0a7
      kontekst: textscripts.re_region2_fight_shadow1:line:27
      linia: 27
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Two... things which are hard to describe but let's say they're more-or-less like smoking holes in space through which you can see the
        faint light of distant and dying stars, float up to you with an air of menace.
      pl: Dwie... rzeczy, które trudno opisać, ale powiedzmy, że są mniej więcej jak dymiące dziury w przestrzeni, przez które widać słabe światło
        odległych, umierających gwiazd, unoszą się w twoją stronę z aurą groźby.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: true
      uwagi: []
    - id: sol_3979da01821ebf9a0dcf
      kontekst: textscripts.re_region2_fight_shadow1:line:29
      linia: 29
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Two of those hovering shadow orbs float up to you. They look basically like the ones you saw before (that is, they look like nothing,
        or perhaps holes in <i>everything</i>), but these ones move with purpose, and that purpose is menace.
      pl: Dwie z tych unoszących się cienistych kul podpływają do ciebie. Wyglądają zasadniczo jak te, które widziałeś wcześniej (to znaczy, wyglądają
        jak nic, albo może dziury we <i>wszystkim</i>), ale te poruszają się z celem, a tym celem jest groźba.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: true
      uwagi: []
    - id: sol_a9b393b128bfaffc7629
      kontekst: textscripts.re_region2_fight_shadow1:line:31
      linia: 31
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The two orbs... <i>squint</i> at you, and @class|,General Bruise,Dark Noël,Mr. Poindexter@'s voice echoes inside your head in a way
