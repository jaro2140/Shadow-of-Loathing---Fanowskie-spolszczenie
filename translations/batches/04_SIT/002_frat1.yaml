      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: You know, there's a big hobo camp over near Ocean City. I bet your skills would be really popular there.
      pl: Wiesz, niedaleko Ocean City jest duży obóz włóczęgów. Założę się, że twoje umiejętności byłyby tam bardzo popularne.
