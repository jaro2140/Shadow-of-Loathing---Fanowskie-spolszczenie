      linia: 5
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The skeleton is immobile, bound to its chair by vines and drizzles of sap. In its hands are a knife and fork.
      pl: Szkielet jest nieruchomy, przywiązany do krzesła pnączami i strużkami żywicy. W dłoniach trzyma nóż i widelec.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
