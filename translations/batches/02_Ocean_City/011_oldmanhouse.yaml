      linia: 22
      sekcja_skryptu: convo
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Well uh, I'm from the Ocean City Watchful Eye. You know, the newspaper?
      pl: No więc, eee, jestem z Czujnego Oka Ocean City. No wiesz, z gazety?
