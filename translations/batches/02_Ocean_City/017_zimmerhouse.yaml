      kontekst: textscripts.zimmerhouse_ernstzimmer:line:88
      linia: 88
      sekcja_skryptu: whatsupmid
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Listen to me! I had a dream, a premonition, of a dark rift appearing in my basement and growing until it swallowed the entire house!
        And then the neighborhood, and then... the world!
      pl: Posłuchaj! Miałem sen, wizję mrocznej szczeliny, która pojawia się w mojej piwnicy i rośnie, aż pochłania cały dom! Potem dzielnicę,
