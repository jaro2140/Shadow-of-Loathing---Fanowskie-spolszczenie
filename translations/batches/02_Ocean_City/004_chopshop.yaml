      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: I don't have time to run a gang, I'm busy. But I'm busy with something kind of weird, and I think I might need your resources. So, you
        can run the gang same as always. All I need is for you gals to help me out if I need backup.
      pl: Nie mam czasu prowadzić gangu, mam zajęcie. Dość dziwne zajęcie, przy którym mogą mi się przydać wasze zasoby. Możesz więc prowadzić
