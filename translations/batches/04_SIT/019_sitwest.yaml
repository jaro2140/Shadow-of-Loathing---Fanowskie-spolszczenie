      pl: I jedno, i drugie. Najpierw zimno, potem ciepło, gdy opuchlizna zejdzie. Nie musimy się tym jednak martwić. Jest tu na dole rozrzucona masa zestawów zaopatrzenia medycznego — przynajmniej jeden z nich powinien zawierać eliksir regenerujący kostkę.
