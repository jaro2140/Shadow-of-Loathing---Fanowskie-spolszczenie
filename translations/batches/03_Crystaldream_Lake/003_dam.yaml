      sekcja_skryptu: win
      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: Alright, fine, ya nogoodnik. If you wanna look at the absence of a dam that bad, go ahead. $boss$ isn't paying me enough to deal with
