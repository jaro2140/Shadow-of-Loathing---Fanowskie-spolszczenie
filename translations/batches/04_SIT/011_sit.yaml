- kolejnosc_w_danych_gry: 4023
  skrypt: sit_library_jleave
  pomieszczenie:
    id: sit_library_stacks
    nazwa_en: S.I.T. (Library Stacks)
  zagadka: false
  minigra_lub_feature: false
  liczba_wpisow: 7
  sekcje:
  - etykieta: start
    wpisy:
    - id: sol_629b51c0f53acd82221c
      kontekst: textscripts.sit_library_jleave:line:3
      linia: 3
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: 'As you start to leave, the Dean notices the book in your hand and calls out:'
      pl: 'Gdy ruszasz do wyjścia, dziekan zauważa książkę w twojej dłoni i woła:'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_2da5052ea0b0292558e1
      kontekst: textscripts.sit_library_jleave:line:4
      linia: 4
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Wait a moment. <i>That</i> book? ...What are you up to?
      pl: Chwileczkę. <i>Ta</i> książka? ...Co zamierzasz?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_30b2840f1ce5d355cec0
      kontekst: textscripts.sit_library_jleave:line:5
      linia: 5
      sekcja_skryptu: start
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: I'm just trying to find my uncle. He's been looking for things like this and uncursing them, but he disappeared.
      pl: Próbuję tylko znaleźć wuja. Szukał takich rzeczy i zdejmował z nich klątwy, ale zniknął.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_9479282ef5600a1e3fab
      kontekst: textscripts.sit_library_jleave:line:6
      linia: 6
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: '...Here. Take this.'
      pl: '...Proszę. Weź to.'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_22a47d4d81be1a8dc01e
      kontekst: textscripts.sit_library_jleave:line:9
      linia: 9
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: It's a banishment incantation. A powerful one. You may need it more than me. It only works <i>once.</i> Don't waste it.
      pl: To inkantacja wygnania. Potężna. Może przydać ci się bardziej niż mnie. Działa tylko <i>raz</i>. Nie zmarnuj jej.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_d616ed9aa2b8c32155a5
      kontekst: textscripts.sit_library_jleave:line:10
      linia: 10
      sekcja_skryptu: start
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Well, you've basically just guaranteed I'll never use it.
      pl: Właściwie właśnie gwarantujesz, że nigdy jej nie użyję.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_f907346af2779ddcb07a
      kontekst: textscripts.sit_library_jleave:line:11
      linia: 11
      sekcja_skryptu: start
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: But thanks!
      pl: Ale dzięki!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
