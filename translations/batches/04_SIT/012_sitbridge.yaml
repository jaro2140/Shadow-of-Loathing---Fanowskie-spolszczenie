      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: It's a nasty mudhole. Is a cloaca covered in mud worse than a regular cloaca?
      pl: To paskudna dziura w błocie. Czy kloaka pokryta błotem jest gorsza od zwykłej kloaki?
