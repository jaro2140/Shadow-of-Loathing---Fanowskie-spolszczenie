      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: <i>If you are the one we seek, the one who will choose the ending -- and I'm <i>pretty sure</i> you are -- then I humbly request that
        you choose the one where our planet doesn't blow up.</i>
      pl: <i>Jeśli jesteś tym, którego szukamy, tym, który wybierze zakończenie — a jestem tego <i>niemal pewien</i> — pokornie proszę, wybierz
        takie, w którym nasza planeta nie wybuchnie.</i>
