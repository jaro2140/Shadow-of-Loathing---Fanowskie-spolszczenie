      sekcja_skryptu: intro
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Hi, are you taking this class? I'm new and I don't know what I'm supposed to be doing.
      pl: Cześć, chodzisz na te zajęcia? Dopiero zaczynam i nie mam pojęcia, co mam robić.
