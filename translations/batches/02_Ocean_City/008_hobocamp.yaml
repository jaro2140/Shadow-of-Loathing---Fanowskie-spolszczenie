      linia: 61
      sekcja_skryptu: weather
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Huh. That's real philosophical.
      pl: Hm. Naprawdę filozoficzne.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: sol_1027fa142802082baa93
      kontekst: textscripts.hobocamp_fromhub:line:62
      linia: 62
      sekcja_skryptu: weather
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Ol' Gus says, if you can find the pleasure in any circumstance, then you'll never be a sufferer of misfortune.
      pl: 'Stary Gus mówi: jeśli w każdych okolicznościach potrafisz znaleźć przyjemność, nigdy nie padniesz ofiarą nieszczęścia.'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: sol_f243a489b85fbbcb35d6
      kontekst: textscripts.hobocamp_fromhub:line:64
      linia: 64
      sekcja_skryptu: weather
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: Gosh.
      pl: Rety.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
