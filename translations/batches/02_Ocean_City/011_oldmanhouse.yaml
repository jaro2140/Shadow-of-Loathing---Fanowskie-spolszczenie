      linia: 23
      sekcja_skryptu: convo
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Don't trust newspapers. Nor newspaper reporters, neither.
      pl: Nie ufam gazetom. Ani dziennikarzom gazetowym, jak już o tym mowa.
