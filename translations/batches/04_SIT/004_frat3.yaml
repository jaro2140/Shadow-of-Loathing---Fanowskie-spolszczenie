      linia: 6
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: There's also some kind of weird stone... thing? It looks a bit like one of those newfangled "televisions" you've read about, except
        triangular. Somebody's science project, maybe.
      pl: Jest tu też jakaś dziwna kamienna... rzecz? Trochę przypomina jedną z tych nowomodnych „telewizji”, o których czytałeś, ale jest trójkątna. Może czyjś projekt naukowy.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
