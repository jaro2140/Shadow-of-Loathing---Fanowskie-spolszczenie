    - id: sol_ae1456bf80aaf498ee51
      kontekst: textscripts.hobocamp_codeteacher:line:57
      linia: 57
      sekcja_skryptu: letters
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: It's a system of pictographic elements that can be written unobtrusively on walls, or carved into fenceposts, et cetera. They're traditionally
        used by hobos to leave messages for other hobos -- to mark a house where the occupants are charitable, for instance, or to warn of a vicious
        guard dog, that sort of thing. I'm working on expanding the system for more general communications purposes.
      pl: To system znaków obrazkowych, które można dyskretnie zapisywać na ścianach, rzeźbić na słupkach ogrodzeń i tak dalej. Tradycyjnie włóczędzy
        zostawiają nimi wiadomości innym włóczęgom — oznaczają dom z dobroczynnymi mieszkańcami albo ostrzegają przed agresywnym psem. Pracuję
        nad rozszerzeniem systemu do bardziej ogólnych celów komunikacyjnych.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
