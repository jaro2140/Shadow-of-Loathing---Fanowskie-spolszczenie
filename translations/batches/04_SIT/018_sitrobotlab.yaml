    - id: sol_d67a6f42e5d29e937cf4
      kontekst: textscripts.sitrobotlab_simone:line:44
      linia: 44
      sekcja_skryptu: hard
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Not especially. I pretty much just picked this class out of curiosity.
      pl: Nieszczególnie. Wybrałem te zajęcia głównie z ciekawości.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: luck
    wpisy:
    - id: sol_69d546dfbc916f7d22a4
      kontekst: textscripts.sitrobotlab_simone:line:49
      linia: 49
      sekcja_skryptu: luck
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Well, you've hit a moby stroke of luck. We're supposed to work in pairs, but I was the odd one out. That's why I'm still here -- building
        the robot alone took ages.
      pl: Cóż, trafił ci się wielorybi łut szczęścia. Mamy pracować parami, ale dla mnie zabrakło partnera. Dlatego nadal tu jestem — samodzielna budowa robota trwała całe wieki.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi:
      - '[DO PÓŹNIEJSZEJ WERYFIKACJI] Zachowano osobliwy slang Simone: „moby stroke of luck” → „wielorybi łut szczęścia”.'
    - id: sol_0a101da5c5fa5aa380d6
      kontekst: textscripts.sitrobotlab_simone:line:50
      linia: 50
      sekcja_skryptu: luck
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: Oh! So we can partner up?
      pl: Och! Czyli możemy pracować razem?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: two
    wpisy:
    - id: sol_4a393e5aa4b4a1c78fe9
      kontekst: textscripts.sitrobotlab_simone:line:55
      linia: 55
      sekcja_skryptu: two
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Yup! I've finished all the construction and back-end stuff, so you can take over on programming and running the obstacle course. My
        name's Simone, by the way.
      pl: Tak! Cała konstrukcja i zaplecze są gotowe, więc możesz przejąć programowanie i obsługę toru przeszkód. A tak w ogóle, jestem Simone.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_c6940b9fdc0e54816fe5
      kontekst: textscripts.sitrobotlab_simone:line:56
      linia: 56
      sekcja_skryptu: two
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Pleased to meet you! My name's @firstname@.
      pl: Miło cię poznać! Jestem @firstname@.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - '@firstname@'
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_22c050430154e92b95d2
      kontekst: textscripts.sitrobotlab_simone:line:57
      linia: 57
      sekcja_skryptu: two
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: So where do I start with this programming business?
      pl: Od czego zacząć całe to programowanie?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_e7e017092af0943576f6
      kontekst: textscripts.sitrobotlab_simone:line:58
      linia: 58
      sekcja_skryptu: two
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: See the two machines over in front of the obstacle course? The one on the left is a punchcard printer -- just tell it what you want
        the robot to do, and it'll spit out a card for you to feed into the robot. The other machine sets up the courses and starts the robot's
        program.
      pl: Widzisz te dwie maszyny przed torem przeszkód? Ta po lewej to drukarka kart perforowanych — powiedz jej, co robot ma zrobić, a wypluje
        kartę, którą wsuniesz do robota. Druga maszyna ustawia tory i uruchamia program robota.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_a1eb5ea3d5bda6a693a9
      kontekst: textscripts.sitrobotlab_simone:line:59
      linia: 59
      sekcja_skryptu: two
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: What are these three big machines here?
      pl: Do czego służą te trzy wielkie maszyny?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: three
    wpisy:
    - id: sol_2dde6cf23d6e9cc5d2a9
      kontekst: textscripts.sitrobotlab_simone:line:64
      linia: 64
      sekcja_skryptu: three
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Those are for changing what arms or legs the robot is using -- you'll need to use different parts to solve different courses. The idea
        is to get the robot to the "GOAL" flag for each course.
      pl: Służą do zmiany ramion albo nóg robota — różne tory wymagają różnych części. Chodzi o to, by na każdym torze robot dotarł do flagi „META”.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_a11d0c70d3c9a41591c3
      kontekst: textscripts.sitrobotlab_simone:line:65
      linia: 65
      sekcja_skryptu: three
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Hmm.
      pl: Hm.
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 5
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_dd6d1fcb8a76293a0809
      kontekst: textscripts.sitrobotlab_simone:line:66
      linia: 66
      sekcja_skryptu: three
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Don't be intimidated, you don't have to get them first try or anything. Just mess around with it, and you'll figure it out.
      pl: Nie zniechęcaj się, nie musisz zaliczyć ich za pierwszym razem. Poeksperymentuj, a wszystko stanie się jasne.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi:
      - '[DO PÓŹNIEJSZEJ WERYFIKACJI] Sprawdzić, czy grafika flagi nadal pokazuje angielskie GOAL; w takim wypadku w tekście należy pozostawić
        „GOAL” albo podmienić grafikę.'
