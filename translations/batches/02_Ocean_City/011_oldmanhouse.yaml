      linia: 111
      sekcja_skryptu: talk
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Ayep, we shoot th' breeze. Relive old glories an' such.
      pl: Ano, uciąć sobie pogawędkę. Powspominać dawne triumfy i takie tam.
