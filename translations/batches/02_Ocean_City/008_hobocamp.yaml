      kontekst: textscripts.hobocamp_fromhub:line:60
      linia: 60
      sekcja_skryptu: weather
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Yes, I do my best. Can't stop a raincloud by crying, after all. And in fact, when you get right down to it, pretty much anything that
        happens to a person can be considered weather of a sort.
      pl: Tak, staram się. Płaczem nie zatrzymasz deszczowej chmury. A właściwie, jeśli się nad tym zastanowić, niemal wszystko, co przydarza
        się człowiekowi, można uznać za rodzaj pogody.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: sol_f2efecdb19db334f7a49
