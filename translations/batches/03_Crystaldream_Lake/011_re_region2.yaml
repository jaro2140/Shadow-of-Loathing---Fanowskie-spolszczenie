      linia: 23
      sekcja_skryptu: three
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Hey guys, knock it off! You don't need to do target practice with machine guns, that's crazy! You're messing up the trees and scaring
        away all the animals and making a godawful noise!
      pl: Hej, chłopaki, przestańcie! Nie musicie robić sobie strzelnicy z karabinów maszynowych, to szaleństwo! Niszczycie drzewa, płoszycie
        wszystkie zwierzęta i robicie piekielny hałas!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: true
      uwagi: []
    - id: sol_64c06adb6076cb4de68b
      kontekst: textscripts.re_region2_fight_mob3:line:24
      linia: 24
      sekcja_skryptu: three
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The mob guys squint at you, then look at each other. One of them snaps a fresh drum into his tommygun.
      pl: Mafijni goście mrużą na ciebie oczy, po czym patrzą na siebie nawzajem. Jeden z nich wpina świeży bęben w swojego thompsona.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: true
      uwagi: []
    - id: sol_ef9fca8ddf135be2a64d
      kontekst: textscripts.re_region2_fight_mob3:line:25
      linia: 25
      sekcja_skryptu: three
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: But uh, if that's what you're <i>going for</i>, okay well, great job! Way to go! Practice makes perfect!
      pl: Ale, eee, jeśli o to wam <i>chodziło</i>, to dobra, świetna robota! Tak trzymać! Trening czyni mistrza!
