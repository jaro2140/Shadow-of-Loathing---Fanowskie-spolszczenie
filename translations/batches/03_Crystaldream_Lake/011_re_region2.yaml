      linia: 5
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The first thing is a whole flock of those horrible murder-faeries, dancing around merrily and laughing in shrill little voices. The
        second is the bloody carcass of a medium-sized bear that they're hopping up and down on, and occasionally chewing.
      pl: Pierwsza rzecz to cała gromada tych okropnych wróżek-morderczyń, tańczących wesoło i śmiejących się przenikliwymi, piskliwymi głosikami.
        Druga to zakrwawione zwłoki niedźwiedzia średniej wielkości, na których podskakują i które od czasu do czasu przeżuwają.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: true
