      en: '...I ain''t recall. He was new, just signed on afore that last voyage. Didn''t talk much. Eerie fella, to be honest.'
      pl: '...Nie pamiętam. Był nowy, zaciągnął się tuż przed ostatnim rejsem. Małomówny. Upiorny facet.'
