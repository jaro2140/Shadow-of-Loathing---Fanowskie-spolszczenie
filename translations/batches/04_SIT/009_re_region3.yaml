- kolejnosc_w_danych_gry: 3379
  skrypt: re_region3_shadowcompass2
  pomieszczenie: null
  zagadka: false
  minigra_lub_feature: false
  liczba_wpisow: 12
  sekcje:
  - etykieta: start
    wpisy:
    - id: sol_535f22fe3c8bfb6e23b2
      kontekst: textscripts.re_region3_shadowcompass2:line:3
      linia: 3
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: 'You''ve run across the same poster a couple times now. "MISSING: THE OLD SIT MAKE-OUT KING." Handsome enough fellow. You can see how
        he got the crown.'
      pl: 'Natknąłeś się już parę razy na ten sam plakat. „ZAGINIONY: STARY KRÓL OBŚCISKIWANIA Z S.I.T.” Dość przystojny gość. Widać, jak zdobył koronę.'
