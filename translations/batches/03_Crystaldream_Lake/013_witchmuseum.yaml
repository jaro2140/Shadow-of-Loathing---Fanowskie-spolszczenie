      linia: 23
      sekcja_skryptu: return
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Well hello again yourself! Any questions you might still have about our little historical village, I'll be happy to answer as best I
        can!
      pl: I ponownie witam! Z przyjemnością odpowiem najlepiej, jak potrafię, na wszystkie pytania, które nadal nurtują cię w związku z naszą
        małą historyczną wioską!
