      linia: 52
      sekcja_skryptu: best
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: To heck with a sundae, you've created a whole three-day weekende.
      pl: Do diabła z deserem niedzielnym — udało ci się stworzyć cały trzydniowy lodowy weekend.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi:
      - '[DO PÓŹNIEJSZEJ WERYFIKACJI] Adaptacja ciągu sundae/Sunday/weekende; ocenić wspólnie z wcześniejszym wariantem deseru.'
