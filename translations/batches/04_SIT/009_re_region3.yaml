        quickly cleared up and forgotten about.
      pl: O, trochę Tego i trochę Owego. Możesz je sobie zatrzymać, jeśli znajdziesz dla nich Zastosowanie — mam ich mnóstwo. „Kieszonkowy” Adams, tak mnie nazywano na studiach magisterskich, wiesz. Poza krótkim okresem, kiedy nazywano mnie „Podpalaczem”, ale ten drobny incydent szybko wyjaśniono i o nim zapomniano.
