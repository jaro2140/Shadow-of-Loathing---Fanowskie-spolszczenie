      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: 'You open the bottle and pour a generous helping of hot pink #3 onto your salad. It''s thin and oily -- maybe it''s a sort of raspberry
        vinaigrette? Maybe you could pretend that?'
      pl: Otwierasz butelkę i hojnie polewasz sałatkę jaskraworóżowym sosem nr 3. Jest rzadki i oleisty — może to jakiś malinowy winegret? Może
