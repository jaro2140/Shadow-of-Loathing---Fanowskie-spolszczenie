      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: Man, I'd kill for a jellied eel. Poindexter brings these little bottles of sludge. He says -- how does it go? He says, "The point of
        eating is nutrition. Making sustenance pleasurable is a pointless waste of time and resources." Sheesh. He's a real riot at parties, that
        guy.
      pl: Za galaretowatego węgorza dałbym się zabić. Poindexter przynosi małe buteleczki szlamu. Jak on to mówi? „Celem jedzenia jest odżywianie.
        Czerpanie przyjemności z przyjmowania pokarmu stanowi bezcelowe marnotrawstwo czasu i zasobów”. Rany. Prawdziwa dusza towarzystwa.
