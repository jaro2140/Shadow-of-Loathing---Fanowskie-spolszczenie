    - id: sol_08c0c5dea7cf1fecba56
      kontekst: textscripts.lighthouse_keeper_stage2:line:56
      linia: 56
      sekcja_skryptu: askthree
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: If you can find another pre-New North compass in at least as good a condition as mine, then sure, I'll swap you. Don't really get what
        the point of that would be though, since you'd already have one.
      pl: Jeśli znajdziesz kompas sprzed Nowej Północy w stanie nie gorszym niż mój, możemy się zamienić. Nie bardzo widzę w tym sens, bo wtedy
        już będziesz mieć jeden.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_4f0ffadf87330ba550c4
      kontekst: textscripts.lighthouse_keeper_stage2:line:57
      linia: 57
      sekcja_skryptu: askthree
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Well, it's a long story.
      pl: To długa historia.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_8582c30200e33d4f63a5
      kontekst: textscripts.lighthouse_keeper_stage2:line:58
      linia: 58
      sekcja_skryptu: askthree
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Never mind, then.
      pl: W takim razie nieważne.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
