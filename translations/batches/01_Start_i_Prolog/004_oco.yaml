      en: Hey, a '17 S.I.T. ring! I've got one of these in faux emerald, but not a faux sapphire one like this. These are the ones they gave to
        the junior varsity pig skinners. Had a li'l enchantment on 'em so the kids wouldn't get quite so many concussions, probably worn off by
        now.
      pl: Pierścień S.I.T. z rocznika 1917! Mam taki ze sztucznym szmaragdem, ale nie ze sztucznym szafirem. Te dostawali juniorzy ze Świńskoskórych.
