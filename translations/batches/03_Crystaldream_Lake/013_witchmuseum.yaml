    - id: sol_af43bf2948277aa96b92
      kontekst: textscripts.witchmuseum_missputnam:line:47
      linia: 47
      sekcja_skryptu: dolls
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Ha ha, it's a little of both! I make a lot of the souvenir rag dolls we have on sale here. Oh -- do you have an interest in historical
        dolls? That would explain how you know about my great-aunt Delia!
      pl: Ha, ha, po trochu jedno i drugie! Szyję wiele szmacianych lalek, które sprzedajemy tu jako pamiątki. Och — interesują cię historyczne
        lalki? To wyjaśnia, skąd wiesz o mojej ciotecznej prababce Delii!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
