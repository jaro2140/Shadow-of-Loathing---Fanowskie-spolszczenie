      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: A head pops out of the storm drain. It must be that used textbook salesman again, because there can't be too many of these guys.
      pl: Z kratki ściekowej wyskakuje głowa. To musi być znowu ten sprzedawca używanych podręczników, bo nie może być zbyt wielu takich gości.
