      en: In a thickly overgrown and essentially sunless part of the woods, you happen across two large and burly vampires. They seem pretty ticked
        off -- they're growling menacingly, shoving each other around, and so forth. Some kind of spooky territory dispute? Or maybe one of them
        drank a tourist that the other was saving for a special occasion? The nature of their argument is unclear.
      pl: W gęsto zarośniętej i praktycznie pozbawionej słońca części lasu natykasz się na dwa wielkie, krzepkie wampiry. Wydają się dość wściekłe
        -- warczą groźnie, przepychają się nawzajem, i tak dalej. Jakiś upiorny spór o terytorium? A może jeden z nich wypił turystę, którego
        drugi zachowywał na specjalną okazję? Natura ich sporu jest niejasna.
