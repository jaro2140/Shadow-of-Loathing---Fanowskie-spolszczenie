  - etykieta: madmen
    wpisy:
    - id: sol_4b185b363972fa1b0f9c
      kontekst: textscripts.re_region2_fight_shroom2:line:118
      linia: 118
      sekcja_skryptu: madmen
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: They're staring daggers at you now. They exchange glances and muttered "wah ooh"s, then move toward you with a menacing air.
      pl: Przeszywają cię teraz wzrokiem. Wymieniają spojrzenia i mamroczą »wa uu«, po czym ruszają w twoją stronę z groźną miną.
      status: do_korekty
      wspoldzielony_rekord: false
