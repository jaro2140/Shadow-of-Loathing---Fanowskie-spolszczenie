      zagadka: false
      minigra_lub_feature: false
      uwagi:
      - '[DO PÓŹNIEJSZEJ WERYFIKACJI] Simone używa celowo dziwnego slangu („real frog”, „munging”); zachowano absurd, lecz rejestr wymaga oceny
        z całością jej dialogów.'
    - id: sol_18e16bdc5f7ed4478318
      kontekst: textscripts.sitrobotlab_simone:line:37
      linia: 37
      sekcja_skryptu: fun
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: I need to pass this course, though. What should I do?
      pl: Muszę jednak zaliczyć ten przedmiot. Co mam zrobić?
