      sekcja_skryptu: look
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: What a gruesome sight awaits you there! A skeleton, its bones polished by rats, is handcuffed to a live bomb.
      pl: Cóż za makabryczny widok tam na ciebie czeka! Szkielet, jego kości wypolerowane przez szczury, jest przykuty kajdankami do żywej bomby.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
