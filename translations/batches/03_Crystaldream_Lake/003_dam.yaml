      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: sol_d49b6ea900d7d5f786c7
      kontekst: textscripts.dam_guardblocker:line:86
