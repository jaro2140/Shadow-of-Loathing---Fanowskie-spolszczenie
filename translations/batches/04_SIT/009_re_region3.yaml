  sekcje:
  - etykieta: start
    wpisy:
    - id: sol_fb495436cb887fbd9de4
      kontekst: textscripts.re_region3_companion_obie_misc:line:3
      linia: 3
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: While wandering the S.I.T. campus, you and Obie pass a large courtyard, where a bunch of students are hanging out.
      pl: Wędrując po kampusie S.I.T., ty i Obie mijacie wielki dziedziniec, gdzie kręci się grupka studentów.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
