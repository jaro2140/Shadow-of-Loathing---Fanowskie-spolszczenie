      sekcja_skryptu: plan4
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: I am reliably informed that there is a small, sparsely-inhabited island in the eastern ocean that is somehow unaffected by the passage
        of time. My intention is to gather as many hoboes as possible, and sail there to establish a marvelous, sparkling city of total freedom,
        unimpeded by this country's laws and social mores. And I shall name that city... Hobopolis!
      pl: Z wiarygodnego źródła wiem, że na wschodnim oceanie leży mała, słabo zaludniona wyspa, na którą z jakiegoś powodu nie działa upływ czasu.
        Zamierzam zebrać jak najwięcej włóczęgów i popłynąć tam, aby założyć wspaniałe, lśniące miasto całkowitej wolności, nieskrępowane prawami
        i obyczajami społecznymi tego kraju. Nazwę je... Hobopolis!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
