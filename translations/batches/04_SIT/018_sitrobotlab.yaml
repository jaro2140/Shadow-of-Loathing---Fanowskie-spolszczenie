      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Small world! That reminds me, I've got to get back home and pick up the last of my stuff soon.
      pl: Mały świat! Właśnie, muszę niedługo wrócić do domu i zabrać resztę swoich rzeczy.
