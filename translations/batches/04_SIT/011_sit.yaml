      sekcja_skryptu: major2
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Oh, she's very clever, I'm sure you'll get on famously.
      pl: Och, jest bardzo bystra. Na pewno świetnie się dogadacie.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_335e82f8874ea02f240b
      kontekst: textscripts.sit_librarian2:line:66
      linia: 66
      sekcja_skryptu: major2
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: I don't know yet, but since you brought it up, probably.
      pl: Jeszcze nie wiem, ale skoro o tym wspominasz, to pewnie tak.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
