      mowca_lub_kanal: postac_po_lewej
      en: Dancing as in actual dancing, or as in a back-alley shootout?
      pl: Tańca w sensie prawdziwego tańca, czy w sensie strzelaniny w zaułku?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
