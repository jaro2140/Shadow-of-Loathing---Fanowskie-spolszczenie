      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: You haven't been buying your textbooks new, have you? I told you that's a scam! Buy used, always used! Speaking of... can I tempt you?
      pl: Chyba nie kupowałeś swoich podręczników nowych, co? Mówiłem ci, że to szwindel! Kupuj używane, zawsze używane! A skoro już o tym mowa...
