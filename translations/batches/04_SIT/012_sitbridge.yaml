      sekcja_skryptu: popup
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You look behind the bridge pile, and find a hobo sitting there with a fishing pole.
      pl: Zaglądasz za pal mostu i znajdujesz siedzącego tam włóczęgę z wędką.
      status: do_korekty
