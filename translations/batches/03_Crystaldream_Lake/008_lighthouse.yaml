    - id: sol_400ec4860dc034ca97a4
      kontekst: textscripts.lighthouse_keeper_stage2:line:38
      linia: 38
      sekcja_skryptu: askcompass
      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: You asked if I had an old compass, an' I said I did an' that I'd show it to you. Never said nothin' about <i>giving</i> it to you.
      pl: Pytałeś, czy mam stary kompas, a ja powiedziałem, że tak i że ci go pokażę. Nie mówiłem nic o <i>oddawaniu</i>.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
