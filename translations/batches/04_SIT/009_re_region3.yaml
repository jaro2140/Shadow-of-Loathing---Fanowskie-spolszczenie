      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You make a break for the other end of the alley, holding your breath to jump through the cloud of foul-smelling steam. The fishmen are
        unfazed by the smell, of course, but their surprise at your actions (and the fact that one of them falls down the manhole) gives you enough
        of a headstart that you manage to make your escape.
      pl: Rzucasz się na drugi koniec alejki, wstrzymując oddech, żeby przeskoczyć przez chmurę cuchnącej pary. Ryboludziom oczywiście zapach nie przeszkadza, ale ich zaskoczenie twoim zachowaniem (i fakt, że jeden z nich wpada do włazu) daje ci wystarczającą przewagę, żeby uciec.
      status: do_korekty
