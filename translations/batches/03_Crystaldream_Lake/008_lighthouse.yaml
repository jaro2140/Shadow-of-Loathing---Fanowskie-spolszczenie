    - id: sol_43061fdf23436d7acffb
      kontekst: textscripts.lighthouse_keeper_stage2:line:46
      linia: 46
      sekcja_skryptu: asktwo
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Nope, I said a <i>good</i> one. The new ones ain't any use at all.
      pl: Nie. Mówię o <i>dobrym</i>. Nowe są zupełnie bezużyteczne.
