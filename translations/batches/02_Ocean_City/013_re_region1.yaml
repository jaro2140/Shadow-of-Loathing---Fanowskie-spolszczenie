      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Ah yes, excuſe me. My Pockets are filled with Bits and Bobs, and little Packets of Things. One never knows when one might want to perform
        a little off-the-cuff Alchemy, you know. Go ahead and keep it, if you like.
      pl: Ach tak, wybacz mi. Moje Kieszenie są wypełnione Bibelotami i Drobiazgami, i małymi Paczuszkami Rzeczy. Nigdy nie wiadomo, kiedy zechce
        się wykonać odrobinę doraźnej Alchemii, wiesz. Możesz to zatrzymać, jeśli chcesz.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
