      linia: 8
      sekcja_skryptu: e
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: \"* It has been pointed out to us that this arras is unlikely to have been manufactured in the capital of the Pas-de-Calais department
        of northern France, and therefore it is merely a sparkling tapestry."
      pl: \"* Zwrócono nam uwagę, że ten arras najprawdopodobniej nie powstał w stolicy departamentu Pas-de-Calais w północnej Francji, a zatem
        jest zaledwie musującym gobelinem."
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
