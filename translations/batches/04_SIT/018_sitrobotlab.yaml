      kontekst: textscripts.sitrobotlab_simone:line:80
      linia: 80
      sekcja_skryptu: reminisce
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Really? I doubt we've met before, I grew up on a tiny little farm outside of Ocean City.
      pl: Naprawdę? Wątpię, żebyśmy się wcześniej spotkali. Dorastałam na maleńkiej farmie pod Ocean City.
      status: do_korekty
      wspoldzielony_rekord: false
