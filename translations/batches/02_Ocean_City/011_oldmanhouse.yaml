    wpisy:
    - id: sol_74b43efa50ae79ca0263
      kontekst: textscripts.oldmanhouse_thief:line:62
      linia: 62
      sekcja_skryptu: switched
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Great. So we're square, then? Everything's jake?
      pl: Świetnie. Jesteśmy kwita? Wszystko klawo?
