      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: My name's Janet. Please don't be alarmed by my visible mechanical insides. I'm in no pain.
      pl: Nazywam się Janet. Nie przejmuj się widocznymi mechanizmami w moim wnętrzu. Nic mnie nie boli.
