      sekcja_skryptu: pyramid
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Oh, honey, would that we had one to teach ya! Our archaeology professor jumped out his office window one day and never came back. Never
        graded his students' term papers. You know what that means? They're still stuck in that semester. Can't move forward. Can't go back either.
        He doomed 'em to academic limbo. You can still hear 'em in the halls some nights, wailing like banshees.
      pl: Och, skarbie, gdybyśmy tylko mieli komu zlecić te zajęcia! Nasz profesor archeologii pewnego dnia wyskoczył przez okno gabinetu i już
        nie wrócił. Nigdy nie ocenił prac semestralnych. Wiesz, co to znaczy? Studenci nadal tkwią w tamtym semestrze. Nie mogą ruszyć naprzód.
        Cofnąć się też nie mogą. Skazał ich na akademicki czyściec. W niektóre noce nadal słychać, jak zawodzą na korytarzach niczym banshee.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
