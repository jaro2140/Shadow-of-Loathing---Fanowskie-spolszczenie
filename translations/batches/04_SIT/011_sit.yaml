      mowca_lub_kanal: postac_po_prawej
      en: Mostly just the ones concerned with digestion, but I have been to visit the Chemicals department before. Did you notice the bronze statue
        in the foyer?
      pl: Głównie te związane z trawieniem, ale zdarzało mi się odwiedzać wydział Chemikaliów. Widzisz posąg z brązu w foyer?
