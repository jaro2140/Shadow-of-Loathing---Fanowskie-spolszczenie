      kontekst: textscripts.oldmanhouse_secretdoor:line:38
      linia: 38
      sekcja_skryptu: book1
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: However, since you aren't a sea captain, the notes and charts don't mean much to you. And none of them have any big black X's marking
        the site of buried treasure. Phooey.
      pl: Ponieważ jednak nie jesteś kapitanem żeglugi, notatki i mapy niewiele ci mówią. Żadna z nich nie ma też wielkiego czarnego X-a oznaczającego miejsce zakopanego skarbu. Ech.
