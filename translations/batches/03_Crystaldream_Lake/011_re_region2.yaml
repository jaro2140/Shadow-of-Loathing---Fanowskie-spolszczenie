      linia: 2
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: On the side of one of Crystaldream Lake's many trees, you see something curious.  More accurately, you see something strange, which
        makes <i>you</i> curious.
      pl: Na boku jednego z wielu drzew nad Jeziorem Kryształowych Snów widzisz coś ciekawego. Dokładniej, widzisz coś dziwnego, co wzbudza <i>twoją</i> ciekawość.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_06466c34a9c258b19f90
      kontekst: textscripts.re_region2_gather_rocks2:line:3
      linia: 3
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: It's a glob of sap that has hardened into amber, but it shouldn't be here -- it normally takes centuries for sap to harden this much,
        and this tree can't be more than a few years old.
      pl: To bryłka żywicy, która zamieniła się w bursztyn, ale nie powinno jej tu być -- normalnie żywicy zajmuje wieki, żeby aż tak stwardnieć, a to drzewo nie może mieć więcej niż parę lat.
      status: do_korekty
