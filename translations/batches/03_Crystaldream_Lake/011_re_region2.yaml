      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You pick up a softball-sized stone and hurl it into the lake with a loud <i>plonk!</i> A second, similar <i>plonk!</i> follows immediately
        after -- you turn and look at Molly, who is already looking for something bigger.
      pl: Podnosisz kamień wielkości piłki do softballa i ciskasz nim w jezioro z głośnym <i>plum!</i> Zaraz potem następuje drugie, podobne <i>plum!</i>
        -- odwracasz się i patrzysz na Molly, która już szuka czegoś większego.
