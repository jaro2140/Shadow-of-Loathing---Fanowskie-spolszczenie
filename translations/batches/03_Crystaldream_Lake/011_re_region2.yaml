      sekcja_skryptu: banish
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: What are the chances that you've gone completely bonkers and are just hallucinating all of this? Pretty high, right?
      pl: Jakie jest prawdopodobieństwo, że kompletnie oszalałeś i po prostu masz to wszystko halucynacje? Całkiem wysokie, co?
