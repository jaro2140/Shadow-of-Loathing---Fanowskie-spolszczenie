  - etykieta: whaling
    wpisy:
    - id: sol_166e8fca922b983dc8fa
      kontekst: textscripts.witchmuseum_pastlamp:line:17
      linia: 17
      sekcja_skryptu: whaling
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Okay see, sperm whale fat renders down into pretty good lamp oil, better than other whales. But, more importantly, they also have a
        reservoir full of <i>really good</i> oil in their heads -- as much as 500 gallons of it! And nobody knows why, or what it's for! So once
        people realized that sperm whales were relatively populous within sailing distance of the colonial coast, it sparked an entire industry.
      pl: Dobrze, więc tłuszcz kaszalota można wytopić na całkiem dobry olej do lamp, lepszy niż z innych wielorybów. Co ważniejsze, kaszaloty
        mają też w głowach zbiornik pełen <i>naprawdę dobrego</i> oleju — nawet 500 galonów! I nikt nie wie dlaczego ani do czego służy! Kiedy
        ludzie odkrywają, że w zasięgu statków wypływających z kolonialnego wybrzeża żyje stosunkowo dużo kaszalotów, powstaje cały przemysł.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_1deca1c79accaf517870
      kontekst: textscripts.witchmuseum_pastlamp:line:18
      linia: 18
      sekcja_skryptu: whaling
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The whaling industry in the colonies began in the 1640s, but that was a fair bit south of here. However, just two years ago in 1690,
        whalers started working out of the islands around Lieutenant Harbor (or rather, what would eventually come to be called Lieutenant Harbor
        after its accidental enlistment and promotion during the war of 1774), and within a hundred years those islands became the whaling capital
        of the world. Until, of course, the whales ran out. But, the industry was still able to flounder along until the invention of kerosene
        in the 1850s.
      pl: Wielorybnictwo w koloniach zaczęło się w latach czterdziestych XVII wieku, lecz sporo dalej na południe. Jednak zaledwie dwa lata temu, w 1690 roku, wielorybnicy rozpoczęli działalność na wyspach wokół Lieutenant Harbor — a właściwie miejsca, które dopiero później otrzyma tę nazwę po przypadkowym zaciągnięciu się do wojska i awansie podczas wojny 1774 roku — i w ciągu stulecia wyspy stały się światową stolicą wielorybnictwa. Oczywiście tylko do wyczerpania wielorybów. Mimo to branża jeszcze długo szamocze się jak ryba na brzegu, aż w latach pięćdziesiątych XIX wieku wynaleziono naftę.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_497a5e2d4745e9835601
      kontekst: textscripts.witchmuseum_pastlamp:line:19
      linia: 19
      sekcja_skryptu: whaling
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Anyway, the point being, this lamp is really state-of-the-art technology around here!
      pl: W każdym razie rzecz w tym, że ta lampa to w tej okolicy szczyt techniki!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
