      kontekst: textscripts.re_region2_companion_adams_levelup:line:14
      linia: 14
      sekcja_skryptu: next
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: I don't know what that is, but I'll be ſure to make a Note of it, thank you. Is this related to the Eyepatch?
      pl: Nie wiem, co to jest, ale na pewno to sobie zanotuję, dziękuję. Czy to ma związek z Opaską na Oko?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_ba12675a93ec9da43023
      kontekst: textscripts.re_region2_companion_adams_levelup:line:15
      linia: 15
      sekcja_skryptu: next
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Oh, this? No, this is merely for Faſhion. My intention is to prevent the neceſsity of robot Legs. They were -- will be -- <i>very</i>
        expenſive.
      pl: O, to? Nie, to wyłącznie dla Mody. Moim zamiarem jest zapobiec konieczności robotycznych Nóg. Były -- będą -- <i>bardzo</i> kosztowne.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
