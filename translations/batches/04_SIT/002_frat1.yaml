      linia: 54
      sekcja_skryptu: tellcamp
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Yeah, I heard about that! I'm saving up to buy a new hat first, though. I want to put my best foot forward, you know?
      pl: Tak, słyszałam o nim! Najpierw odkładam jednak na nowy kapelusz. Chcę zrobić dobre pierwsze wrażenie, rozumiesz?
