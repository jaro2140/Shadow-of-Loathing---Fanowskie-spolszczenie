      sekcja_skryptu: talk
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Well, that's good. But isn't the um... immobility... an issue?
      pl: To dobrze. Ale czy ta, eee... nieruchomość... nie stanowi problemu?
