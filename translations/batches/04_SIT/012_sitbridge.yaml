    - id: sol_921c5fcf21b47a361313
      kontekst: textscripts.fishnest_walterpile:line:30
      linia: 30
      sekcja_skryptu: convo
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Well hello again! What's up?
      pl: Witaj ponownie! Co słychać?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
  - etykieta: intro
    wpisy:
    - id: sol_4b7d016e37a78ebd0a8a
      kontekst: textscripts.fishnest_walterpile:line:36
      linia: 36
      sekcja_skryptu: intro
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Well hi there! You must've seen my note on the other piling. My name's Walter.
      pl: Witaj! Zapewne widziałeś moją notatkę na drugim palu. Jestem Walter.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: sol_7bb8122296a1783fecd2
      kontekst: textscripts.fishnest_walterpile:line:37
      linia: 37
      sekcja_skryptu: intro
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Hi, I'm @firstname@. Are you living under this bridge?
      pl: Cześć, jestem @firstname@. Mieszkasz pod tym mostem?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - '@firstname@'
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: sol_69fd666f1f6f97422bc7
      kontekst: textscripts.fishnest_walterpile:line:38
      linia: 38
      sekcja_skryptu: intro
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: For the moment! I'll probably move on soon, coz S.I.T. students keep throwing weird rocks down here. But it's protected from the rain,
        and the fishing is good, so it's a pretty nice spot to camp for a while.
      pl: Na razie! Pewnie niedługo ruszę dalej, bo studenci S.I.T. ciągle zrzucają tu dziwne kamienie. Ale deszcz nie pada na głowę, a ryby dobrze
        biorą, więc przez jakiś czas to całkiem dobre miejsce na obóz.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: sol_3502175378ef4adb2b50
      kontekst: textscripts.fishnest_walterpile:line:39
      linia: 39
      sekcja_skryptu: intro
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: What about the fishmen?
      pl: A ryboludzie?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: sol_e6ef6fffc97d0faa6303
      kontekst: textscripts.fishnest_walterpile:line:40
      linia: 40
      sekcja_skryptu: intro
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Those fellas with the glowing eyes? They were a bit leery of me at first, but I guess they decided I was harmless. Maybe all the raw
        fish I been handlin' rubbed off on me.
      pl: Ci goście ze świecącymi oczami? Na początku patrzyli nieufnie, ale chyba uznali mnie za nieszkodliwego. Może przesiąkłem zapachem wszystkich surowych ryb, których dotykałem.
      status: do_korekty
