      linia: 122
      sekcja_skryptu: funeral
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: This one was distinctive, there was a strange barn explosion...
      pl: Ten był charakterystyczny. Doszło do dziwnego wybuchu stodoły...
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
