        Throne. And here I am, sitting on it. <i>Ipso facto</i>, I'm the boss.
      pl: Zostałem szefem w chwili, gdy usiadłem. Powiedziałaś — siedząc tutaj! — że na Półksiężycowym Tronie może siedzieć tylko szef Blaszanych Lizzie. A oto siedzę. <i>Ipso facto</i> jestem szefem.
