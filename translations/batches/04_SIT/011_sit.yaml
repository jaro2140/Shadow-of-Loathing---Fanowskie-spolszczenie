      sekcja_skryptu: cowbook3
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The page is headed "DUKE BOVICUS", and has a drawing of the spiky symbol on that pouch you found. Apparently, Bovicus is a "Greate &
        Heavy Lourde of the Inferno", whose domains are violence and greed, and who is known for offering lopsided deals to foolish humans who
        long for power.
      pl: Strona nosi nagłówek „KSIĄŻĘ BOVICUS” i zawiera rysunek kolczastego symbolu z odnalezionej sakiewki. Najwyraźniej Bovicus to „Wielki
        y Ciężki Pan Inferna”, władający przemocą i chciwością oraz znany z proponowania nierównych układów głupim ludziom łaknącym potęgi.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
