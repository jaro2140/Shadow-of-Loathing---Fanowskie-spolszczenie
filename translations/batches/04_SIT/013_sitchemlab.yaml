      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You carefully drizzle the vellum softener on the book, rendering its pages as soft and supple as the day they were born. I mean bound.
      pl: Ostrożnie skrapiasz książkę zmiękczaczem do pergaminu, dzięki czemu strony stają się miękkie i giętkie jak w dniu narodzin. To znaczy
