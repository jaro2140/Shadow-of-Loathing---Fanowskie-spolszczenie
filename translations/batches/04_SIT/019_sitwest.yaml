      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: I could in fact use a bit of assistance, yep. At my age I'm not really supposed to be messing around down here in the mine any more,
        but I got bored. Went and twisted my fool ankle. Pretty bad, if I'm any judge.
      pl: Właściwie mogłabym skorzystać z odrobiny pomocy, tak. W moim wieku nie powinnam już właściwie tak majstrować tu w kopalni, ale się znudziłam.
