- kolejnosc_w_danych_gry: 3199
  skrypt: re_region1_companion_obie_misc
  pomieszczenie: null
  zagadka: false
  minigra_lub_feature: false
  liczba_wpisow: 19
  sekcje:
  - etykieta: start
    wpisy:
    - id: sol_dbdc75bde26f18adb718
      kontekst: textscripts.re_region1_companion_obie_misc:line:2
      linia: 2
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Obie stops and calls your attention to a small park that the two of you are walking past.
      pl: Obie zatrzymuje się i zwraca twoją uwagę na mały park, obok którego akurat przechodzicie.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_613cd2f843d471164e5c
      kontekst: textscripts.re_region1_companion_obie_misc:line:4
      linia: 4
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Look -- there's a fair number'a folks out today. Are we in a hurry?
      pl: Patrz — jest dziś na mieście niezły tłumek. Śpieszymy się gdzieś?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_87b99cae3d3b67f37d79
      kontekst: textscripts.re_region1_companion_obie_misc:line:6
      linia: 6
      sekcja_skryptu: start
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: I guess not? Why?
      pl: Chyba nie? Czemu?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_58128c718878245b03aa
      kontekst: textscripts.re_region1_companion_obie_misc:line:7
      linia: 7
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: He pulls his oboe out of its case, then drops two Meat in his hat and hands it to you.
      pl: Wyjmuje obój z futerału, po czym wrzuca dwa Mięsa do kapelusza i podaje ci go.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_b9e0e17d3fed44d6c66e
      kontekst: textscripts.re_region1_companion_obie_misc:line:8
      linia: 8
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: I'm thinkin' it's a cryin' shame to waste such an opportunity.
      pl: Myślę, że szkoda byłoby zmarnować taką okazję.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_b2657cbded3ebc8b5bf1
      kontekst: textscripts.re_region1_companion_obie_misc:line:9
      linia: 9
      sekcja_skryptu: start
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: An opportunity to sell me your hat?
      pl: Okazja, żeby sprzedać mi twój kapelusz?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_66e0442ac228b66db846
      kontekst: textscripts.re_region1_companion_obie_misc:line:10
      linia: 10
      sekcja_skryptu: start
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: Is busking legal here?
      pl: Czy granie na ulicy jest tu legalne?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_1c0f741332201a7da4ae
      kontekst: textscripts.re_region1_companion_obie_misc:line:11
      linia: 11
      sekcja_skryptu: start
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: Ooh, good idea. I'm down for a free lunch.
      pl: O, dobry pomysł. Jestem za darmowym lunchem.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: two
    wpisy:
