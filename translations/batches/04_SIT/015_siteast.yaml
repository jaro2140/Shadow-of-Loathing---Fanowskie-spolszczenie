  - etykieta: makedessert
    wpisy:
    - id: sol_8c704c6f54fe62d61378
      kontekst: textscripts.siteast_cookingstation5:line:24
      linia: 24
      sekcja_skryptu: makedessert
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You dig around in the cabinet under the ice-cold slab of marble, and find several tubs of ice cream, some miscellaneous toppings, and
        a bunch of scoops, spatulas, and other equipment. Apparently you're expected to devise some kind of ice-cream sundae.
      pl: Grzebiesz w szafce pod lodowatą marmurową płytą i znajdujesz kilka pudeł lodów, rozmaite dodatki oraz mnóstwo gałkownic, łopatek i innego
        sprzętu. Najwyraźniej masz skomponować jakiś deser lodowy.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_86fe22b1261884aa76cf
      kontekst: textscripts.siteast_cookingstation5:line:25
