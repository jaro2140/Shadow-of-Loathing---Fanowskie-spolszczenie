      linia: 4
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: As you make your way down the forest path, you hear a rustling in the bushes behind you -- jeez, what is it with forest creatures and
        their constant bush-rustling? Don't they have anything better to do?
      pl: Idąc leśną ścieżką, słyszysz szelest w krzakach za tobą -- rany, co jest z tymi leśnymi stworzeniami i ich ciągłym szeleszczeniem w
        krzakach? Nie mają nic lepszego do roboty?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: true
