      sekcja_skryptu: moving
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Naw, in the mornin'. But I went and packed my teddy bear, and forgot which box he's in. Can't sleep.
      pl: Nie, rano. Ale spakowałem misia i nie pamiętam, w którym pudle. Nie mogę spać.
      status: zatwierdzono
