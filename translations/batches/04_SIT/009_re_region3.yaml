      en: You wander into a science lab, and arrive just in time to see several experiments go berserk and break out of their beakers and petri
        dishes. Or, to put it another way, you arrive a little too late to not be in trouble.
      pl: Wędrujesz do laboratorium naukowego i przybywasz akurat na czas, żeby zobaczyć, jak kilka eksperymentów wpada w szał i wyrywa się ze
