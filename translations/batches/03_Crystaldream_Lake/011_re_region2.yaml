      kontekst: textscripts.re_region2_deliakey:line:11
      linia: 11
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Then you write "Rufus, S.I.T. Steam Tunnels" on the metal detector and stick it in a mailbox.
      pl: Potem piszesz »Rufus, Tunele Parowe S.I.T.« na wykrywaczu metalu i wtykasz go do skrzynki pocztowej.
      status: do_korekty
