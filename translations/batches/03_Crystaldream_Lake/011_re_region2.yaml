      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: I remember reading about it in a News-Paper ſome time ago... I ſuppoſe I muſt have been in my mid-twenties? All of the People in the
        Village diſsappeared overnight, it was quite a Myſtery.
      pl: Przypominam sobie, że czytałem o niej w Gazecie jakiś czas temu... przypuszczam, że miałem wtedy jakieś dwadzieścia pięć lat? Wszyscy Mieszkańcy Wioski zniknęli z dnia na dzień, to była spora Zagadka.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
