      linia: 19
      sekcja_skryptu: garlicblast
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You crank open the valve and dump about twelve gallons of pure distilled garlic juice on the floor. Wow! Even with stench protection,
        it's a nasal experience you won't soon forget.
      pl: Odkręcasz zawór i wylewasz na podłogę około dwunastu galonów czystego, destylowanego soku z czosnku. Rany! Nawet z ochroną przed smrodem
