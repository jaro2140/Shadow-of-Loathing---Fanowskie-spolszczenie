    - id: sol_e8e59d70fad11c7444dd
      kontekst: textscripts.zimmerhouse_begin:line:5
      linia: 5
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: This seems like a pretty normal house in a pretty nice neighborhood, but there's something... odd about it. Some sort of uncomfortable
        energy that makes the hair on the back of your neck stand up. Maybe it's something to do with that weird droning tone you hear coming
        from inside, like a pained inhuman moan constantly rising in pitch.
      pl: To wygląda na całkiem zwyczajny dom w całkiem przyjemnej dzielnicy, ale coś jest z nim... nie tak. Emanuje jakąś nieprzyjemną energią,
        od której włosy stają dęba. Może chodzi o dobiegający ze środka dziwny, jednostajny dźwięk — jak nieludzki jęk bólu, który bez końca przechodzi
        w coraz wyższy ton.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
