      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Okay, so -- oof -- quantum mechanics is basically a set of mathematical equations that can -- whoop -- be used to predict the results
        of experiments performed -- aah -- at the subatomic level. But it can't -- ugh -- predict the outcome definitively, only probabalistically,
        giving a range of possible outcomes, referred to as the -- hup -- wavefunction. The act of actually performing the experiment, measuring
        the system in question -- whoa -- collapses the wavefunction down to a single result. Because -- one second...
      pl: Dobrze, więc — uff — mechanika kwantowa to zasadniczo zbiór równań matematycznych, które można — hop — wykorzystać do przewidywania
        wyników eksperymentów prowadzonych — ach — na poziomie subatomowym. Nie może jednak — uch — przewidzieć wyniku definitywnie, a jedynie
        probabilistycznie, podając zakres możliwych rezultatów zwany — hup — funkcją falową. Sam akt przeprowadzenia eksperymentu, czyli pomiaru
        badanego układu — ojej — redukuje funkcję falową do jednego wyniku. Ponieważ... sekundkę...
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
