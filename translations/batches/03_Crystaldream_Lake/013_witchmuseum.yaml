      kontekst: textscripts.witchmuseum_mayor:line:29
      linia: 29
      sekcja_skryptu: hub
      typ: sayoption_once
      mowca_lub_kanal: opcja_gracza
      en: Can I go in your house?
      pl: Mogę wejść do twojego domu?
