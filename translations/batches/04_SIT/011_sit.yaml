  - etykieta: intro
    wpisy:
    - id: sol_599f880e86aa025c4b86
      kontekst: textscripts.sit_librarian1:line:14
      linia: 14
      sekcja_skryptu: intro
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Ah, hello again. Are you a student now?
      pl: Ach, witam ponownie. Jesteś już studentem?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_8b12af82b21d8eb36d09
      kontekst: textscripts.sit_librarian1:line:16
      linia: 16
      sekcja_skryptu: intro
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: I am, yep! Got my student ID and everything, see?
      pl: Tak! Mam legitymację studencką i wszystko, spójrz.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_458419e4ec721bba62b9
      kontekst: textscripts.sit_librarian1:line:18
      linia: 18
      sekcja_skryptu: intro
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Hello there. Are you a student of the Institute?
      pl: Dzień dobry. Studiujesz w Instytucie?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_0b6befe647e4733ab80d
      kontekst: textscripts.sit_librarian1:line:20
      linia: 20
      sekcja_skryptu: intro
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Yep! Here's my student ID.
      pl: Tak! Oto moja legitymacja.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_c7a321e009729807898d
      kontekst: textscripts.sit_librarian1:line:22
      linia: 22
      sekcja_skryptu: intro
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Yes, that looks to be in order. Very well then! My name is Douglas -- what can I do for you?
      pl: Tak, wszystko wygląda poprawnie. Doskonale! Nazywam się Douglas — w czym mogę pomóc?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: hub
    wpisy:
    - id: sol_061f7adfc11789ff0fe1
      kontekst: textscripts.sit_librarian1:line:30
      linia: 30
      sekcja_skryptu: hub
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: How can I assist you?
      pl: W czym mogę pomóc?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_45257a2e85ef831b3ac4
      kontekst: textscripts.sit_librarian1:line:37
      linia: 37
      sekcja_skryptu: hub
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: Nothing now, thanks.
      pl: Na razie w niczym, dzięki.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: eyeguy
    wpisy:
    - id: sol_bb1899182e6e9028f956
      kontekst: textscripts.sit_librarian1:line:42
      linia: 42
      sekcja_skryptu: eyeguy
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: He's quite a sight, isn't he? Please don't be alarmed.
      pl: Niezły z niego widok, prawda? Proszę się nie niepokoić.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_5b858a977c53fe54e7e8
      kontekst: textscripts.sit_librarian1:line:43
      linia: 43
      sekcja_skryptu: eyeguy
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: I'm more confused, to be honest.
      pl: Szczerze mówiąc, jestem raczej zdezorientowany.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_4805b24244f48464bd2b
      kontekst: textscripts.sit_librarian1:line:44
      linia: 44
      sekcja_skryptu: eyeguy
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Ted and I -- and our colleague Janet, over there to my right -- share a, shall we say, unusual past.
      pl: Ted i ja — oraz nasza koleżanka Janet, tam po mojej prawej — mamy, powiedzmy, niezwykłą przeszłość.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_c0a3b53dc5bcfeaf8c33
      kontekst: textscripts.sit_librarian1:line:45
      linia: 45
      sekcja_skryptu: eyeguy
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: What happened?
      pl: Co się stało?
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 5
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_c9397ad902b3e635ee0e
      kontekst: textscripts.sit_librarian1:line:46
      linia: 46
      sekcja_skryptu: eyeguy
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: We worked in a circus sideshow together. That was more than thirty years ago, now.
      pl: Pracowaliśmy razem w cyrkowym gabinecie osobliwości. To było już ponad trzydzieści lat temu.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_4e893618a30140fddd58
      kontekst: textscripts.sit_librarian1:line:47
      linia: 47
      sekcja_skryptu: eyeguy
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: You don't seem like sideshow material.
      pl: Nie wyglądasz na materiał do gabinetu osobliwości.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: eyeguy2
    wpisy:
    - id: sol_d668c095d96e88395385
      kontekst: textscripts.sit_librarian1:line:52
      linia: 52
      sekcja_skryptu: eyeguy2
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: 'Perhaps not! But regard:'
      pl: 'Być może! Ale spójrz:'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_c40023e9133d160b5664
      kontekst: textscripts.sit_librarian1:line:53
      linia: 53
      sekcja_skryptu: eyeguy2
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: He stands up, and turns to face the wall.
      pl: Wstaje i odwraca się twarzą do ściany.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_ece46d6d658e9baec1bc
      kontekst: textscripts.sit_librarian1:line:54
      linia: 54
      sekcja_skryptu: eyeguy2
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: But, he's still looking right at you. His entire back is identical to his front, with another face on the back of his head, and all
        of his clothes tailored to match.
      pl: 'Ale nadal patrzy prosto na ciebie. Całe plecy są identyczne z przodem: z tyłu głowy znajduje się druga twarz, a wszystkie ubrania skrojono
        tak, by do niej pasowały.'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_9121fbccb48199b893ee
      kontekst: textscripts.sit_librarian1:line:55
      linia: 55
      sekcja_skryptu: eyeguy2
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: '...<i>What.</i>'
      pl: '...<i>Co.</i>'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_72425b2bebcab72292a1
      kontekst: textscripts.sit_librarian1:line:56
      linia: 56
      sekcja_skryptu: eyeguy2
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Ah-haha. Please excuse me, but I do always enjoy the reactions of new students.
      pl: Ach, ha, ha. Proszę wybaczyć, ale zawsze bawią mnie reakcje nowych studentów.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_54f253f4365670a2f11f
      kontekst: textscripts.sit_librarian1:line:57
      linia: 57
      sekcja_skryptu: eyeguy2
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: He sits back down to a chorus of <i>cracks</i> and <i>pops</i> as his joints reverse into new positions.
      pl: Siada z powrotem przy akompaniamencie <i>trzasków</i> i <i>strzyknięć</i>, gdy jego stawy odwracają się do nowych pozycji.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_9cd1b3b2a8879d278842
      kontekst: textscripts.sit_librarian1:line:58
      linia: 58
      sekcja_skryptu: eyeguy2
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: Holy jeez.
      pl: Rany boskie.
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: eyeguy3
    wpisy:
    - id: sol_f158616ee3f27fb0bc0d
      kontekst: textscripts.sit_librarian1:line:63
      linia: 63
      sekcja_skryptu: eyeguy3
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Oh, don't worry, it sounds much worse than it feels. A regimen of stretching exercises keeps me fit as a fiddle.
      pl: Och, bez obaw. Brzmi znacznie gorzej, niż się czuje. Regularne ćwiczenia rozciągające utrzymują mnie w doskonałej formie.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_70a6cbfec2b8e33455ca
      kontekst: textscripts.sit_librarian1:line:64
      linia: 64
      sekcja_skryptu: eyeguy3
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Anyway, after the three of us escaped the circus, we headed east. The Institute took us in, out of scientific curiosity, and gave us
        work as librarians.
      pl: W każdym razie po ucieczce z cyrku całą trójką ruszyliśmy na wschód. Instytut przyjął nas z naukowej ciekawości i dał nam pracę bibliotekarzy.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_44a8feee9b0a84524019
      kontekst: textscripts.sit_librarian1:line:66
      linia: 66
      sekcja_skryptu: eyeguy3
