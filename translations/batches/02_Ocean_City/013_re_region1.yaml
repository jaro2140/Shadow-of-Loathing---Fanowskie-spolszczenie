      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You find your path unexpectedly blocked by a huge pile of junk -- a broken-down car, a busted lamppost, a couch with the springs poking
        out of it, and a wide variety of other assorted trash.
      pl: Twoją drogę nieoczekiwanie blokuje wielka sterta śmieci — rozbity samochód, złamana latarnia, kanapa z wystającymi sprężynami i szeroki wybór innych rozmaitych odpadków.
