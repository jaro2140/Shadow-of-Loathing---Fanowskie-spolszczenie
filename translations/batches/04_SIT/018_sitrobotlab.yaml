      linia: 36
      sekcja_skryptu: fun
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: It's a real frog, all right. Budget cuts are munging the department's lab resources pretty badly.
      pl: No, prawdziwa żaba. Cięcia budżetowe paskudnie kaszanią zasoby laboratoryjne wydziału.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
