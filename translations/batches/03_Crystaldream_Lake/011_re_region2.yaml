      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You hear a high-pitched buzzing sound from a nearby ditch, and take a brief detour to investigate it.
      pl: Słyszysz wysoki, brzęczący dźwięk z pobliskiego rowu i robisz krótki objazd, żeby to zbadać.
