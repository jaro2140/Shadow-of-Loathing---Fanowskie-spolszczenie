      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Listen, you gals are going about this all wrong. You'll get much more useable parts off this jalopy if you take it back to your garage
        first, instead of trying to strip it quick-and-dirty on the street before a cop shows up.
      pl: Słuchajcie, dziewczyny, robicie to zupełnie źle. Uzyskacie dużo więcej użytecznych części z tego gruchota, jeśli najpierw zabierzecie
        go do garażu, zamiast próbować obedrzeć go na szybko i brudno na ulicy, zanim pojawi się glina.
      status: do_korekty
      wspoldzielony_rekord: false
