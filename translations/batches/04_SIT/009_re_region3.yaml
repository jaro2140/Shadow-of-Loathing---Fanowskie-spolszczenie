      kontekst: textscripts.re_region3_shadowcompass2:line:4
      linia: 4
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The needle of the cursed compass flickers into action. The needle directs you west, towards the dorms.
      pl: Igła przeklętego kompasu ożywa migotliwie. Igła kieruje cię na zachód, w stronę akademików.
