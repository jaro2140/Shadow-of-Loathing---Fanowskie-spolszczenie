      linia: 5
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Or they were, until you made that huge racket getting in here. Now they're staring knives at you, and also pointing knives at you. And
        they're <i>bread</i> knives, which are serrated, so you really don't want to get stabbed with one.
      pl: A raczej kręcili się, dopóki nie narobiłeś przy wejściu takiego rumoru. Teraz przeszywają cię wzrokiem jak nożami — a do tego mierzą w ciebie prawdziwymi. I to nożami <i>do chleba</i>, czyli ząbkowanymi, więc naprawdę nie chcesz oberwać którymś z nich.
      status: do_korekty
      wspoldzielony_rekord: false
