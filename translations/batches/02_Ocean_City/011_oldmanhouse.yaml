      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Oh wait, that's this? There's a little pamphlet stuffed in the back.
      pl: Ach, chwila, a to co? Z tyłu wetknięto jakąś małą broszurkę.
