      sekcja_skryptu: intro
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Sorry for intruding, but I heard the... "music," and I guess I have an intrusive nature.
      pl: Przepraszam za wtargnięcie, ale słychać było tę... „muzykę”, a wścibstwo leży chyba w mojej naturze.
