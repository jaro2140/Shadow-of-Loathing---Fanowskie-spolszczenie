      linia: 5
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You turn around to admonish them, and come face-to-sternum with two massive tusked shadow brutes, who have somehow become jammed shoulder-to-shoulder
        between two large trees. I guess they were too busy stalking you to pay attention to their surroundings.
      pl: Odwracasz się, żeby je zbesztać, i stajesz twarzą w twarz -- a raczej twarzą w mostek -- z dwoma masywnymi, kłowatymi cienistymi brutalami,
        którzy jakimś sposobem zakleszczyli się ramię w ramię między dwoma wielkimi drzewami. Chyba byli zbyt zajęci śledzeniem cię, żeby zwracać
        uwagę na otoczenie.
      status: do_korekty
      wspoldzielony_rekord: false
