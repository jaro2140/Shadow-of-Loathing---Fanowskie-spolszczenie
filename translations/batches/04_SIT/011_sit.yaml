      linia: 63
      sekcja_skryptu: major2
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Yeah, me and a girl I met named Simone.
      pl: Tak, razem z poznaną tam dziewczyną, Simone.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
