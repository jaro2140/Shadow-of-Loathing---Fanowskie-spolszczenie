    - id: sol_bd563b23fc62c2eb8176
      kontekst: textscripts.re_region2_deliakey:line:23
      linia: 23
      sekcja_skryptu: failtofind
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You spend a little time poking around in the woods near Sandwich Village, hoping to find Delia's lost house key. You give up quickly,
        though, as finding a 230-year-old needle in a haystack miles wide seems... unlikely. Maybe you'll come across something later that will
        help? Some kind of... lost metal finding device? Until then, this is clearly a wild goose chase.
      pl: Spędzasz trochę czasu, szukając w lasach koło Wioski Sandwich, mając nadzieję znaleźć zgubiony klucz do domu Delii. Szybko się jednak
        poddajesz, bo znalezienie 230-letniej igły w stogu siana szerokim na wiele mil wydaje się... mało prawdopodobne. Może natkniesz się później
        na coś, co pomoże? Jakieś... urządzenie do wykrywania zgubionego metalu? Do tego czasu to najwyraźniej szukanie wiatru w polu.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
