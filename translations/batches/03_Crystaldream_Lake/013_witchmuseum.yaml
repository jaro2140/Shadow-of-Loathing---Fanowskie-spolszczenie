      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Oh yeah, it totally would! In that case, yes, I do.
      pl: O tak, to wyjaśniałoby wszystko! W takim razie owszem, interesują.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
