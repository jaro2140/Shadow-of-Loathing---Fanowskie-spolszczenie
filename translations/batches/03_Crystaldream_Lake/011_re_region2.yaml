      kontekst: textscripts.re_region2_fight_faerie2:line:11
      linia: 11
      sekcja_skryptu: start
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Run away
      pl: Uciekaj
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 10
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: true
      uwagi: *id014
  - etykieta: distract
    wpisy:
    - id: sol_b41ab1b8e06b45e5ce26
      kontekst: textscripts.re_region2_fight_faerie2:line:16
      linia: 16
      sekcja_skryptu: distract
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You give a can of seltzer a quick shake and hurl it at the fairies. They flit out of the way easily, but the can hits a tree and bursts,
        sending glittering shrapnel and sparkling water into the air. The faeries are sufficiently distracted by the spectacle that you manage
        to get away from them and hide in the underbrush.
      pl: Potrząsasz szybko puszką wody sodowej i ciskasz nią we wróżki. Z łatwością uskakują, ale puszka trafia w drzewo i pęka, wysyłając w powietrze błyszczące odłamki i skrzącą wodę. Wróżki są na tyle rozproszone tym widowiskiem, że udaje ci się od nich uciec i schować w zaroślach.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: true
      uwagi: []
    - id: sol_1715cb957ee842e79cb8
      kontekst: textscripts.re_region2_fight_faerie2:line:17
      linia: 17
      sekcja_skryptu: distract
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: After they get bored of looking for you and leave (which doesn't take long), you crawl out of your hiding place and poke around the
        area a little. The badger doesn't seem interested in any of the trash the faeries left behind, so it's all yours.
      pl: Gdy nudzi im się szukanie ciebie i odchodzą (co nie trwa długo), wypełzasz z kryjówki i trochę rozglądasz się po okolicy. Borsuk nie
        wydaje się zainteresowany żadnymi śmieciami, które zostawiły po sobie wróżki, więc wszystkie są twoje.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: true
      uwagi: []
    - id: sol_b83d23c5a465d64f93fa
