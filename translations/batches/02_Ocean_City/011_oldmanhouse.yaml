      linia: 49
      sekcja_skryptu: book2
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: And they say never to judge a book by its cover.
      pl: A podobno nie należy oceniać książki po okładce.
