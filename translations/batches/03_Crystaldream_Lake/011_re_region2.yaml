      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: A sudden loud <i>VOIP!</i> sound causes you and Dr. Adams to turn around, as a second Dr. Adams steps out of a glowing blue wormhole.
      pl: Nagły, głośny dźwięk <i>ŁUP!</i> sprawia, że ty i dr Adams odwracacie się, gdy z rozświetlonego niebieskiego tunelu czasoprzestrzennego
        wychodzi drugi dr Adams.
