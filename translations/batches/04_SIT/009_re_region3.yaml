      uwagi: []
  - etykieta: two
    wpisy:
    - id: sol_b4cb48c515ab68254c12
      kontekst: textscripts.re_region3_fight_mob2:line:12
      linia: 12
      sekcja_skryptu: two
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You sprint down the street, legs windmilling and little puffs of dust shooting out behind you, but the mob goons aren't far behind,
        and they're slowly gaining on you.
      pl: Pędzisz ulicą, nogi jak wiatrak, małe kłębki kurzu wystrzeliwują za tobą, ale mafijni oprychowie nie są daleko w tyle i powoli cię doganiają.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: true
      uwagi: []
    - id: sol_d041a2857152aebbf1c6
      kontekst: textscripts.re_region3_fight_mob2:line:13
      linia: 13
      sekcja_skryptu: two
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: One of them pulls out a guitar and starts playing "Flight of the Bumblebee", which seems really difficult -- especially running -- and
        would certainly be worth some applause if you could afford to stop and appreciate it for a second.
      pl: Jeden z nich wyciąga gitarę i zaczyna grać „Lot Trzmiela”, co wygląda na naprawdę trudne — zwłaszcza podczas biegu — i z pewnością zasługiwałoby na brawa, gdybyś mógł sobie pozwolić, żeby się zatrzymać i to docenić choć przez chwilę.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: true
      uwagi: []
    - id: sol_c307a6ed0160b02c78df
