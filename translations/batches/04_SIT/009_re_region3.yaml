    - id: sol_65722a74bff3e5123c89
      kontekst: textscripts.re_region3_companion_obie_misc:line:14
      linia: 14
      sekcja_skryptu: next
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Obie gets an impromptu jam session going -- in any group of college students, there's always one with a guitar -- and the two of you
