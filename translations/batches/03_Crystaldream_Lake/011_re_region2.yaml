      linia: 5
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You happen upon a small rest stop-type area just off of the path, with a rickety old picnic bench and a square brick bunker that is
        presumably a public toilet -- although a sign on the door says "out of order," and the sound of flies buzzing inside doesn't incline you
        toward testing that claim.
      pl: Natykasz się na małe miejsce przypominające przystanek odpoczynkowy, tuż przy ścieżce, z rozklekotaną starą ławką piknikową i kwadratowym
        ceglanym bunkrem, który jest prawdopodobnie publiczną toaletą -- choć tabliczka na drzwiach głosi »nieczynne«, a dźwięk brzęczących w
        środku much nie zachęca cię do sprawdzenia tego twierdzenia.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_5cd89a204b1e7c2e6473
      kontekst: textscripts.re_region2_salesman1:line:6
      linia: 6
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: There's also a Meat-operated Blue Cola cooler, which still has a couple cans of soda in it, although judging by the rust, it doesn't
        look to have actually cooled anything in a while.
      pl: Jest tam też chłodziarka Niebieskiej Coli zasilana Mięsem, wciąż z kilkoma puszkami napoju w środku, choć sądząc po rdzy, nie wygląda,
        żeby faktycznie coś chłodziła od dawna.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
