      linia: 52
      sekcja_skryptu: return
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Not that it's any business of yours, but I'm perfecting my recipe for bread golems. Soon I'm gonna be running this town!
      pl: Nie żeby to był twój interes, ale udoskonalam przepis na chlebowe golemy. Wkrótce całe miasto będzie moje!
