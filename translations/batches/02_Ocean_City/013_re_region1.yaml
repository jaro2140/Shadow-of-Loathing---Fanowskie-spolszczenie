      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: They <i>will</i> hassle ya for tryin'a get a jam session goin' with the organist, though, so be cool.
      pl: <i>Będą</i> się jednak czepiać, jak spróbujesz zorganizować jam session z organistą, więc zachowaj spokój.
      status: do_korekty
