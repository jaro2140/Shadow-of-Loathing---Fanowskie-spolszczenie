      en: The Doughboys are clearly less aggressive than other street gangs, in that they're glaring at you and muttering angrily to each other
        instead of already having attacked you. However, it's also clear that you aren't getting past them without a fight.
      pl: Ciastochłopcy są wyraźnie mniej agresywni niż inne uliczne gangi — zamiast od razu zaatakować, tylko łypią spode łba i mamroczą coś
        gniewnie między sobą. Równie wyraźnie widać jednak, że bez walki się obok nich nie przejdzie.
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
