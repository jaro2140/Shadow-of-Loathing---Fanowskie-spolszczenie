    - id: sol_10862f41d45a931e24f3
      kontekst: textscripts.dam_guardblocker:line:74
      linia: 74
      sekcja_skryptu: fight
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Hmm. Are you sure? I can think of two reasons not to fight this guy.
      pl: Hm. Na pewno? Przychodzą mi do głowy dwa powody, żeby nie walczyć z tym facetem.
      status: do_korekty
      wspoldzielony_rekord: false
