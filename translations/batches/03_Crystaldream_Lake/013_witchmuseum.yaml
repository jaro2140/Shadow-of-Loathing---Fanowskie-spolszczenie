      sekcja_skryptu: patricia
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: How did things turn out for Delia and Patricia and the rest of the kids? Did her diaries say?
      pl: Jak potoczyły się losy Delii, Patricii i reszty dzieci? Pisała o tym w pamiętnikach?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_6b95b2c178df18218bdb
      kontekst: textscripts.witchmuseum_missputnam:line:57
      linia: 57
      sekcja_skryptu: patricia
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Umm, let me think... Great-aunt Delia made a lot of dolls and eventually married a travelling trader. Sometimes she went out on his
        route with him. Patricia got married to a big six from one of the outlying farms and they moved north to start a ranch. Tom Danforth became
        a judge like his pop, and "Doody Head" Peter became mayor, though it was basically by default. Nothing super interesting, but you know,
        nothing much <i>was</i> back then. They all did well enough for themselves.
      pl: Eee, niech pomyślę... Cioteczna prababka Delia robiła mnóstwo lalek, a w końcu poślubiła wędrownego kupca. Czasem ruszała z nim w trasę.
        Patricia wyszła za rosłego sześciostopowca z jednej z odległych farm i razem przenieśli się na północ, żeby założyć ranczo. Tom Danforth
        został sędzią jak jego ojciec, a Peter „Kupogłowa” Proctor burmistrzem, choć właściwie tylko dlatego, że nikt inny nim nie został. Nic
        szczególnie ciekawego, ale wiesz — w tamtych czasach mało co <i>było</i> szczególnie ciekawe. Każde z nich jakoś sobie poradziło.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi:
      - '[DO PÓŹNIEJSZEJ WERYFIKACJI] Zwrot „a big six” zinterpretowano kontekstowo jako rosłego sześciostopowca; wymaga porównania z ewentualnym
        żartem lub terminem świata gry.'
