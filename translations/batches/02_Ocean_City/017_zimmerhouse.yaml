      sekcja_skryptu: intro
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Well, I am Ernst Zimmer. Forgive me for not stopping, but it is vital that I continue playing.
      pl: A ja jestem Ernst Zimmer. Wybacz, że nie przerywam, lecz dalsza gra jest sprawą najwyższej wagi.
