        bar down at the Outback Sizzler.
      pl: 'Może nie wyraziłem się jasno: mowa o zestawie roślin, który w połowie jest zgniłą breją, a w połowie pulsującymi żyłami. To nie bar sałatkowy w Outback Sizzler.'
