      kontekst: textscripts.witchmuseum_journal:line:3
      linia: 3
      sekcja_skryptu: popup
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Take a look
      pl: Przyjrzyj się
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 5
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: &id025 []
  - etykieta: read
    wpisy:
    - id: sol_3995e5ea20c277423fa7
      kontekst: textscripts.witchmuseum_journal:line:9
      linia: 9
      sekcja_skryptu: read
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: It appears to be someone's diary... Oh, yeah -- the little description on the front of the plinth says "Diary of Delia Putnam." So that
        confirms that.
      pl: Wygląda na czyjś pamiętnik... Och, tak — mała tabliczka z przodu postumentu głosi „Pamiętnik Delii Putnam”. To rozstrzyga sprawę.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_a0f7f99298521637baa7
      kontekst: textscripts.witchmuseum_journal:line:10
      linia: 10
      sekcja_skryptu: read
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Mostly it doesn't look interesting enough to be worth deciphering the archaic handwriting and spelling, so you flip ahead to the last
        page.
      pl: Większość nie wygląda na dość ciekawą, by męczyć się z rozszyfrowywaniem archaicznego pisma i ortografii, więc przechodzisz od razu
        do ostatniej strony.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_789cc5693fba43d8c3d0
      kontekst: textscripts.witchmuseum_journal:line:13
      linia: 13
      sekcja_skryptu: read
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Oh, look at that -- the last page has been torn out. By some history-hating scoundrel, no doubt.
      pl: O, proszę — ostatnią stronę wyrwano. Bez wątpienia zrobił to jakiś nienawidzący historii łotr.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_613e5732dc3ee1a0183d
      kontekst: textscripts.witchmuseum_journal:line:16
      linia: 16
      sekcja_skryptu: read
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: \"6th of March, 1692. Ugh, I hate that Peter Proctor <i>so much</i>! He thinks he can just go around being as mean as he wants to everybody,
        just because he has lots of money and lives in a big house and all! I should have used a much stronger curse, it would have been worth
        the trouble!"
      pl: \"6 marca 1692. Uch, jak ja <i>nienawidzę</i> tego Petera Proctora! Myśli, że skoro ma mnóstwo pieniędzy i mieszka w wielkim domu, może być tak podły dla wszystkich, jak tylko chce! Powinnam była użyć znacznie mocniejszej klątwy. Byłoby warto się pomęczyć!"
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_7954e0e612e45e802297
      kontekst: textscripts.witchmuseum_journal:line:19
      linia: 19
      sekcja_skryptu: read
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Wait a minute. This handwriting matches the graffiti from the outhouses!
      pl: Chwila. Ten charakter pisma pasuje do napisu na wychodku!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_a4a3e31504c870e7490f
      kontekst: textscripts.witchmuseum_journal:line:21
      linia: 21
      sekcja_skryptu: read
      typ: option
      mowca_lub_kanal: opcja_gracza
