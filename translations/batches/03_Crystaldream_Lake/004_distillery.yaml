      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: \"That's @p|him,her,them@!" the door-guard says, pointing at you. "That's @p|him,her,them@ right there!\"
      pl: „To @p|him,her,them@!” — mówi strażniczka, wskazując na ciebie. „To @p|him,her,them@, właśnie tutaj!”
