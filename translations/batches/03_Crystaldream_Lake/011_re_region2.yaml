      linia: 4
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You are in a clearing. At the end of a long wooden table sits an eight-foot skeleton on a mossy throne, wearing a crown of sticks and
        leaves.
      pl: Jesteś na polanie. Na końcu długiego drewnianego stołu siedzi szkielet mierzący osiem stóp na omszałym tronie, w koronie z patyków i liści.
