      kontekst: textscripts.oldmanhouse_oldman:line:97
      linia: 97
      sekcja_skryptu: urns2
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: He was a member of the crew right an' proper though, so he got as much right ta be here as any of em.
      pl: Ale był członkiem załogi jak się patrzy, więc ma takie samo prawo tu być jak każdy z nich.
