      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: sol_e0746e7d13876082c5c9
      kontekst: textscripts.dam_guardblocker:line:85
      linia: 85
      sekcja_skryptu: fight3
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
