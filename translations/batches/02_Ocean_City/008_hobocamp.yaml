      sekcja_skryptu: weather
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: So you're the kind of guy that's comfortable in any sort of weather, eh?
      pl: Czyli dobrze czujesz się przy każdej pogodzie?
