      sekcja_skryptu: start
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Are you a religious guy, Obie?
      pl: Jesteś religijnym gościem, Obie?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
      uwagi: []
    - id: sol_7c80f7f7129e82690fc0
      kontekst: textscripts.re_region1_companion_obie_mapunlock:line:6
      linia: 6
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Nah, well, I was raised that way but I don't follow it much these days. Only thing I practice is the oboe. I just mention it 'coz it's
        a nice place to have a quiet sit-down, and they don't hassle ya for bein' broke.
      pl: Nie, no, wychowano mnie w tym duchu, ale nie praktykuję zbyt wiele w dzisiejszych czasach. Jedyne, co praktykuję, to obój. Wspominam
        o tym tylko, bo to miłe miejsce na spokojne posiedzenie, i nie czepiają się ciebie za to, że jesteś spłukany.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: true
      minigra_lub_feature: false
