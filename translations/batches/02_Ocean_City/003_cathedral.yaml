      linia: 132
      sekcja_skryptu: funeral2
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: It was a nice funeral, though quite small -- only a few neighbors. I heard someone grumble about the couple's daughter not attending,
        but that isn't so unusual. Poor girl must have been distraught, I assume.
      pl: Pogrzeb był ładny, choć niewielki — przyszło tylko kilku sąsiadów. Ktoś narzekał, że córka zmarłych się nie zjawiła, ale to nic niezwykłego. Biedna dziewczyna musiała być zdruzgotana.
      status: do_korekty
