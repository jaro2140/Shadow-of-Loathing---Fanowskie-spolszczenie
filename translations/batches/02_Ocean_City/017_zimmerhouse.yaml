- kolejnosc_w_danych_gry: 4768
  skrypt: zimmerhouse_exit
  pomieszczenie:
    id: zimmerhouse_floor1
    nazwa_en: '@map1_name_zimmerhouse@ (Ground Floor)'
  zagadka: false
  minigra_lub_feature: false
  liczba_wpisow: 9
  sekcje:
  - etykieta: crystal
    wpisy:
    - id: sol_13d3f89b7df509270a99
      kontekst: textscripts.zimmerhouse_exit:line:11
      linia: 11
      sekcja_skryptu: crystal
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: As you start to leave the house, something tells you that it would be bad to take that weird crystal out of here.
      pl: Kiedy zbierasz się do wyjścia, coś podpowiada ci, że wynoszenie stąd tego dziwnego kryształu to zły pomysł.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_c4ed8bc0fbe72e0b7544
      kontekst: textscripts.zimmerhouse_exit:line:12
      linia: 12
      sekcja_skryptu: crystal
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: That something is definitely not the crystal, because it's a really great crystal, and you're deriving great satisfaction from owning
        it.
      pl: Tym czymś zdecydowanie nie jest kryształ, bo to naprawdę świetny kryształ, a posiadanie go daje ci ogromną satysfakcję.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: heytho
    wpisy:
    - id: sol_8f3be53ee32c8311df33
      kontekst: textscripts.zimmerhouse_exit:line:20
      linia: 20
      sekcja_skryptu: heytho
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Although I definitely can't fault your instincts, it might be a bad idea to leave without fixing whatever's going wrong in this place?
        Or at least finding out what that is?
      pl: Choć zdecydowanie nie można mieć pretensji do twojego instynktu, może jednak nie warto wychodzić bez naprawienia tego, co jest z tym
        miejscem nie tak? Albo przynajmniej ustalenia, co to takiego?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: areyousure
    wpisy:
    - id: sol_18e968ee22b8228bf7ba
      kontekst: textscripts.zimmerhouse_exit:line:25
      linia: 25
      sekcja_skryptu: areyousure
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Just reminding you that this house has an active dimensional rift in the basement, and it might be a real bad idea to leave without
        fixing that? Especially since it's kind of your fault, at least a little bit.
      pl: Tylko przypominam, że w piwnicy tego domu znajduje się aktywna szczelina wymiarowa i wyjście bez jej naprawienia może być naprawdę kiepskim
        pomysłem. Zwłaszcza że to poniekąd twoja wina. Przynajmniej troszeczkę.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: destroy
    wpisy:
    - id: sol_47c9cf3172e715807950
      kontekst: textscripts.zimmerhouse_exit:line:30
      linia: 30
      sekcja_skryptu: destroy
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You pull a hammer out of your inventory (or if you don't actually have a hammer, whatever object would be the most hammer-adjacent)
        and give the crystal a solid thwack. It makes a sound like a baby being torn in half and bursts into glittering shards that quickly vaporize.
      pl: Wyciągasz z ekwipunku młotek — albo, jeśli nie masz młotka, przedmiot najbardziej zbliżony do młotka — i porządnie uderzasz kryształ.
        Wydaje dźwięk podobny do rozdzieranego na pół niemowlęcia, po czym rozpada się na lśniące odłamki, które szybko wyparowują.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_a005951be242f2c022dd
      kontekst: textscripts.zimmerhouse_exit:line:35
      linia: 35
      sekcja_skryptu: destroy
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The furniture settles down as the house's extremely haunted atmosphere dissipates.
      pl: Meble uspokajają się, gdy skrajnie nawiedzona atmosfera domu opada.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_9e4e4e3ad9b523eeecb9
