      kontekst: textscripts.oldmanhouse_oldman:line:89
      linia: 89
      sekcja_skryptu: urns
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Crew's bodies washed ashore after a time. Didn't figger they'd want a sea burial after what happened, so I had 'em cremated. Well, except...
      pl: Ciała załogi po jakimś czasie wyrzuciło na brzeg. Uznałem, że po tym, co się stało, nie chcieliby morskiego pogrzebu, więc kazałem ich skremować. No, poza...
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_3c8c0f48a70056eeda3e
      kontekst: textscripts.oldmanhouse_oldman:line:90
      linia: 90
      sekcja_skryptu: urns
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: '...Except?'
      pl: '...Poza?'
      status: do_korekty
