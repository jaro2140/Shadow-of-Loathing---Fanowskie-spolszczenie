    - id: sol_3b17a4766e07e3860b29
      kontekst: textscripts.lighthouse_keeper_stage2:line:39
      linia: 39
      sekcja_skryptu: askcompass
      typ: leftspeak
      mowca_lub_kanal: postac_po_lewej
      en: Oh. Well, I really need it...
      pl: Aha. Ale naprawdę go potrzebuję...
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_658d67f0e009ec7675c4
      kontekst: textscripts.lighthouse_keeper_stage2:line:40
      linia: 40
      sekcja_skryptu: askcompass
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: So do I. I gotta calibrate this lamp to the north star every so often, and I need a good compass to show me which one is the north one.
      pl: Ja też. Co jakiś czas muszę kalibrować lampę według Gwiazdy Polarnej, a dobry kompas pokazuje, która z nich jest północna.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_cd25ca90c017b6beae69
      kontekst: textscripts.lighthouse_keeper_stage2:line:41
      linia: 41
      sekcja_skryptu: askcompass
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: What if I get you a new one?
      pl: A jeśli zdobędę nowy?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
