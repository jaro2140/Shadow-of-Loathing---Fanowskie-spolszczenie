    - id: sol_26505b23024ee7ab387d
      kontekst: textscripts.oldmanhouse_secretdoor:line:48
      linia: 48
      sekcja_skryptu: book2
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: As advertised, it's a thorough guide to the various kinds of ropes and knots used on ships. With lots of diagrams, although none of
        it is particularly useful to you personally.
      pl: Zgodnie z zapowiedzią to szczegółowy przewodnik po rozmaitych rodzajach lin i węzłów używanych na statkach. Z mnóstwem schematów, choć żaden z nich nie jest ci osobiście do czegokolwiek potrzebny.
