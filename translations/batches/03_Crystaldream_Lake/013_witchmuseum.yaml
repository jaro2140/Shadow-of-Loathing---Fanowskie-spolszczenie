      linia: 22
      sekcja_skryptu: e
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The code reads $message$.  You check inside the stone, and there is indeed some treasure!
      pl: Kod głosi $message$. Zaglądasz do wnętrza kamienia i rzeczywiście znajdujesz skarb!
