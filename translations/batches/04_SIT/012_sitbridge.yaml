      linia: 5
      sekcja_skryptu: popup
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You check behind the bridge pile, but Walter has packed up and left.
      pl: Zaglądasz za pal mostu, ale Walter spakował rzeczy i odszedł.
      status: do_korekty
      wspoldzielony_rekord: false
