      sekcja_skryptu: brag
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You smash the lock open with your weapon or whatever. This whole Chemicals class was puzzley enough already without adding to your problems.
      pl: Rozwalasz zamek bronią czy czym tam. Zajęcia z Chemikaliów miały już dość zagadek i bez dokładania ci kolejnych problemów.
