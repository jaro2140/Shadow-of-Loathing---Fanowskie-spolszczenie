      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: take
    wpisy:
    - id: sol_71868040f68415a33a14
      kontekst: textscripts.sit_rufus_arcanehotplate:line:10
      linia: 10
      sekcja_skryptu: take
      typ: leftspeak
      mowca_lub_kanal: postac_po_lewej
      en: Can I have one of these hot plates?
      pl: Mogę dostać jedną z tych płyt grzejnych?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
