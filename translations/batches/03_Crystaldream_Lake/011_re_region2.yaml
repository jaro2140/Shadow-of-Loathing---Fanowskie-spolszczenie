      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: These guys are really big, so this is gonna take a lot of power. You raise your arms in the air and call on all the living people and
        animals in the forest to lend you their life energy. A glowing aura of positivity and hope surrounds you, and you focus it through the
        ring to destroy the monsters with a blazing-white spear of concentrated light.
      pl: Ci goście są naprawdę wielcy, więc to zajmie mnóstwo mocy. Unosisz ramiona w powietrze i wzywasz wszystkich żywych ludzi i zwierzęta
        w lesie, żeby pożyczyli ci swoją energię życiową. Otacza cię świecąca aura pozytywności i nadziei, a ty skupiasz ją przez pierścień, żeby
        zniszczyć potwory oślepiająco białą włócznią skoncentrowanego światła.
