      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The rat sniffs the gator cheese and retches a little bit.  You didn't even know rats had a gag reflex.  He raises an eyebrow at you
        in protest, but eventually drags the cheese into his hole and emerges with a ring for you.
      pl: Szczur wącha ser kajmański i lekko się krztusi. Nawet nie wiedziałeś, że szczury mają odruch wymiotny. Unosi brew w ramach protestu, ale ostatecznie wciąga ser do nory i wraca z pierścionkiem dla ciebie.
