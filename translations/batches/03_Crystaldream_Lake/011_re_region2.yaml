      linia: 7
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You wander off of the main path and stroll along among the trees for a bit. It's nice to get out in nature for a bit, at least until
        you walk into an invisible spiderweb and it gets all tangled in your hair.
      pl: Schodzisz z głównej ścieżki i przez chwilę spacerujesz między drzewami. Miło jest wyjść na łono natury, przynajmniej dopóki nie wejdziesz
        w niewidzialną pajęczynę i nie zaplącze ci się cała we włosach.
      status: do_korekty
