      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: What's this?
      pl: Co to?
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 3
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: three
