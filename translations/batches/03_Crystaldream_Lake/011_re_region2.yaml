      linia: 16
      sekcja_skryptu: next
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The two Dr. Adamses shake hands, and you continue on your way.
      pl: Obaj doktorzy Adamsowie ściskają sobie dłonie, a wy ruszacie w dalszą drogę.
