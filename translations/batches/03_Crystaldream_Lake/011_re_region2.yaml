      sekcja_skryptu: win
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You won! The badger seems grateful, or at least as grateful as a badger can seem, which isn't very much to be honest. Faerie loot makes
