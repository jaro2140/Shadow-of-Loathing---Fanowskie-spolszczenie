      linia: 52
      sekcja_skryptu: efix2
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Oh, it's trivial. Just pop open the little panel on the side and you'll see a slot for it. It's like replacing a fuse.
      pl: Och, to banalne. Otwórz mały panel z boku, a zobaczysz odpowiednie gniazdo. Zupełnie jak wymiana bezpiecznika.
