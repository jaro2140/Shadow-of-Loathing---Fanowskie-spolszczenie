      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: As you're walking down a hallway in one of S.I.T.'s many and various science buildings, a lab door suddenly bursts open and a wild-eyed
        lab-coated man runs out with two large fizzing test tubes in his hands.
      pl: Kiedy idziesz korytarzem w jednym z licznych i rozmaitych budynków naukowych S.I.T., drzwi laboratorium nagle się otwierają i wybiega z nich mężczyzna w kitlu z dzikim wzrokiem, trzymając w rękach dwie duże, syczące probówki.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
