      sekcja_skryptu: popup
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: He wasn't even particularly hiding. Weird that you didn't see him before.
      pl: Nawet specjalnie się nie chował. Dziwne, że wcześniej go nie dostrzegłeś.
      status: do_korekty
