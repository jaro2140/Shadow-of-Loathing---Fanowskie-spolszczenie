      linia: 47
      sekcja_skryptu: asktwo
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Why not?
      pl: Dlaczego?
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 2
