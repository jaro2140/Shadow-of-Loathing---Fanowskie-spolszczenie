      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_df249a49e9cc6dea0416
      kontekst: textscripts.boardwalk_mobquest:line:29
      linia: 29
      sekcja_skryptu: three
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: The details of your specific role, salary, and et cetera are still to be determined -- you will be contactifinated in a week or so with
        further information. In the meantime, howsoever, wearing this ring will guarantee you the aid of one of our operatives whenever you find
        yourself embroiled in an altercation, whether mêlée or gunwise.
      pl: Szczegóły konkretnej roli, płacy i tak dalej pozostają jeszcze do określenia — kontaktowizacja z dalszymi informacjami nastąpi za około
        tydzień. Tymczasowóż noszenie pierścienia gwarantuje pomoc jednego z naszych agentów, ilekroć uwikłasz się w potyczkę, czy to wręczną,
        czy strzeleckawą.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
