    - id: sol_b05b9343596298740297
      kontekst: textscripts.cathedral_vicar:line:123
      linia: 123
      sekcja_skryptu: funeral
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Oh! I <i>do</i> know the one you mean! I got into an argument with the man who printed the memorial cards for me. They all came out
        smudged, but he swore his type was in perfect condition. "You'd better stick to <i>fonts</i>, Father, and leave the <i>fonts</i> to me,"
        he said. I nearly succumbed to the cardinal sin of Wrath.
      pl: Och! <i>Wiem</i>, o który chodzi! Pokłóciłem się z drukarzem kart pamiątkowych. Wszystkie wyszły rozmazane, ale zarzekał się, że jego
        czcionki są w idealnym stanie. „Niech ojciec trzyma się <i>chrzcielnic</i>, a <i>czcionki</i> zostawi mnie”, powiedział. O mało nie uległem
        kardynalnemu grzechowi Gniewu.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
