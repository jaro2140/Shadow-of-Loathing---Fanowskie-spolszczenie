    - id: sol_968f07207103410de076
      kontekst: textscripts.re_region2_fight_faerie3:line:6
      linia: 6
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: 'Oh, here''s a third thing: all of the fairies stopping what they''re doing, and turning to look at you. One of them pulls out a revolver
        and giggles. Another flips open a straight-razor and makes a noise that sounds a lot like a confused and dying bear.'
      pl: 'O, a oto trzecia rzecz: wszystkie wróżki przerywają to, co robiły, i odwracają się, żeby na ciebie popatrzeć. Jedna z nich wyciąga
        rewolwer i chichocze. Inna otwiera brzytwę i wydaje dźwięk bardzo przypominający zdezorientowanego, umierającego niedźwiedzia.'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: true
