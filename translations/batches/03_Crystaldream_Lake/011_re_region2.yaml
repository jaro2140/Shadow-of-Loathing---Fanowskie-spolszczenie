      kontekst: textscripts.re_region2_fight_shroom2:line:119
      linia: 119
      sekcja_skryptu: madmen
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: It looks like they're fed up with your nonsense and have decided to teach you a lesson you're more able to comprehend.
      pl: Wygląda na to, że mają dość twoich bzdur i postanowili nauczyć cię lekcji, którą łatwiej zrozumiesz.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: true
