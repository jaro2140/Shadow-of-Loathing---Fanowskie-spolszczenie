      linia: 34
      sekcja_skryptu: fun
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Yeah, I love it! Unfortunately, you got here pretty late, and all the parts have been used up.
      pl: Tak, uwielbiam to! Niestety trochę późno tu trafiłeś i wszystkie części zostały już wykorzystane.
