      sekcja_skryptu: major3
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: My goodness! Well, if you still need help with your Chemicals assignment, he's the one to ask!
      pl: Wielkie nieba! Jeśli nadal potrzebujesz pomocy z zadaniem z Chemikaliów, najlepiej zapytać właśnie jego!
