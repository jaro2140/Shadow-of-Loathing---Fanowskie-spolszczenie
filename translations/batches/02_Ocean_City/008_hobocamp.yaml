      linia: 156
      sekcja_skryptu: plan2
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: I admit, you've been quite helpful. You, at first a total stranger, have gone out of your way to help hoboes when the other people of
        this country, and even the government itself, would not. This is the crux of the problem, that hoboes are looked down upon, when not overlooked
        entirely. I seek to remedy this.
      pl: 'Przyznaję, że sporo nam pomogłeś. Jako ktoś początkowo zupełnie obcy dobrowolnie pomagałeś włóczęgom, gdy inni mieszkańcy kraju, a nawet sam rząd, tego nie robią. W tym sedno problemu: włóczęgami się gardzi, o ile nie są całkiem ignorowani. Zamierzam temu zaradzić.'
      status: do_korekty
      wspoldzielony_rekord: false
