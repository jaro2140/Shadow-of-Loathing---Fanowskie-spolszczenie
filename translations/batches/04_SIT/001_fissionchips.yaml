      mowca_lub_kanal: postac_po_prawej
      en: I like how you didn't phrase that as a question. You're a cool customer, kid -- I get what Donny Thesaurus sees in ya. Put 'er there.
      pl: Podoba mi się, że to nie jest pytanie. Zimną krew masz, dzieciaku — już rozumiem, co Donny Thesaurus w tobie widzi. Przybij piątkę.
