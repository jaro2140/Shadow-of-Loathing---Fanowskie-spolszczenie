      linia: 92
      sekcja_skryptu: salad6a
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You tip the bowl to pour the things onto your salad. It takes a little while -- they stick together and slowly ooze out of the bowl,
        tumbling and landing on your salad <i>plop plop plop</i>, trailing thin threads of clear slime that stick to the bowl's rim.
      pl: Przechylasz miskę, by wysypać zawartość na sałatkę. Trochę to trwa — kulki są posklejane i powoli wyciekają, spadając <i>plask, plask,
        plask</i> oraz ciągnąc za sobą cienkie nitki przezroczystego śluzu przywierające do brzegu miski.
      status: do_korekty
      wspoldzielony_rekord: false
