- kolejnosc_w_danych_gry: 2828
  skrypt: park_crickettalk
  pomieszczenie:
    id: park
    nazwa_en: Goldthwait Park
  zagadka: false
  minigra_lub_feature: false
  liczba_wpisow: 40
  sekcje:
  - etykieta: start
    wpisy:
    - id: sol_94629f1709dfeee48c2c
      kontekst: textscripts.park_crickettalk:line:4
      linia: 4
      sekcja_skryptu: start
      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: <i>Our mistake, human.  We... do not wish to speak with you.</i>
      pl: <i>Nasz błąd, człowieku. Nie... nie chcemy z tobą rozmawiać.</i>
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_8d139debe700c82f2fb0
      kontekst: textscripts.park_crickettalk:line:6
      linia: 6
      sekcja_skryptu: start
      typ: leftsayshadow
      mowca_lub_kanal: postac_po_lewej_cien
      en: (%sf_sentence1%)
      pl: (%sf_sentence1%)
      status: zablokowane
      wspoldzielony_rekord: true
      liczba_wystapien: 41
      tokeny_techniczne:
      - '%sf_sentence1%'
      zagadka: false
      minigra_lub_feature: false
      uwagi:
      - '[DO PÓŹNIEJSZEJ WERYFIKACJI] Widoczna wypowiedź jest składana przez makro języka Cienia. Token pozostawiono bez zmian; sprawdzić lokalizację
        generatora makra.'
    - id: sol_f55b2499791a96b63bc1
      kontekst: textscripts.park_crickettalk:line:7
      linia: 7
      sekcja_skryptu: start
      typ: rightspeak
      mowca_lub_kanal: postac_po_prawej
      en: <i>Yes.  This is precisely why.</i>
      pl: <i>Tak. Właśnie dlatego.</i>
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_827a2ba74686c6d48263
      kontekst: textscripts.park_crickettalk:line:8
      linia: 8
      sekcja_skryptu: start
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Leave the cricket
      pl: Zostaw świerszcza
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_c46448cd796ccd20d55d
      kontekst: textscripts.park_crickettalk:line:13
      linia: 13
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: <i>Do not be alarmed, human. Neither you nor your colorful pets will be harmed. We merely seek information on this location and your
        people.</i>
      pl: <i>Nie lękaj się, człowieku. Ani tobie, ani twoim barwnym zwierzętom nic nie grozi. Szukamy jedynie informacji o tym miejscu i o twoim ludzie.</i>
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_128bf0543f44c1305764
      kontekst: textscripts.park_crickettalk:line:14
      linia: 14
      sekcja_skryptu: start
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Huh. Okay. I was not expecting a cricket to be this articulate. Or psychic. Or man-sized, but I was already kind of getting over that.
      pl: Hm. Dobrze. Nie spodziewałem się, że świerszcz będzie aż tak elokwentny. Ani telepatyczny. Ani wielkości człowieka, choć z tym ostatnim
        zaczynałem się już oswajać.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_2bd424d36b26f85a0247
      kontekst: textscripts.park_crickettalk:line:15
      linia: 15
      sekcja_skryptu: start
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: <i>We are from a different planet, very far from here in both space and time.</i>
      pl: <i>Pochodzimy z innej planety, bardzo odległej w przestrzeni i czasie.</i>
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_8bc93742105d1f2ea2d0
      kontekst: textscripts.park_crickettalk:line:16
      linia: 16
      sekcja_skryptu: start
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: Ohh, <i>alien</i> crickets.
      pl: Och, świerszcze <i>kosmici</i>.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: two
    wpisy:
    - id: sol_a28849b680e83ae63f63
      kontekst: textscripts.park_crickettalk:line:20
      linia: 20
      sekcja_skryptu: two
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Ohh, <i>alien</i> crickets. Okay, that makes a lot more sense.
      pl: Och, <i>kosmiczne</i> świerszcze. Dobra, to ma o wiele więcej sensu.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_4dcaa62f206016121a81
      kontekst: textscripts.park_crickettalk:line:21
      linia: 21
      sekcja_skryptu: two
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: <i>Ah, I have been unclear, I apologize. These 'crickets', as you call them, are not our true form. We are projecting our wills into
        your time, and comandeering the bodies of these creatures for our mission.</i>
      pl: <i>Ach, wyraziłem się niejasno, przepraszam. Te „świerszcze”, jak je nazywasz, nie są naszą prawdziwą postacią. Rzutujemy naszą wolę w wasz czas i przejmujemy ciała tych stworzeń na potrzeby misji.</i>
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_4bc33a2466e5877c7191
      kontekst: textscripts.park_crickettalk:line:22
      linia: 22
      sekcja_skryptu: two
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: '...So you''re saying there are giant man-sized crickets just running around here normally?'
      pl: ...Czyli mówisz, że gigantyczne świerszcze wielkości człowieka normalnie sobie tu biegają?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_0353ede20e008fb49b98
      kontekst: textscripts.park_crickettalk:line:23
      linia: 23
      sekcja_skryptu: two
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: <i>Yes. Is that news to you? That's very interesting, I will add it to the data.</i>
      pl: <i>Tak. To dla ciebie nowość? To bardzo interesujące, dodam to do danych.</i>
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_fed98b660caf943f1c69
      kontekst: textscripts.park_crickettalk:line:24
      linia: 24
      sekcja_skryptu: two
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Ask about their mission
      pl: Zapytaj o misję
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_cadf6d5634115389efd7
      kontekst: textscripts.park_crickettalk:line:25
      linia: 25
      sekcja_skryptu: two
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Ask them to leave
      pl: Poproś, by odeszli
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: mission
    wpisy:
    - id: sol_f01589b31e69afc2d2be
      kontekst: textscripts.park_crickettalk:line:29
      linia: 29
      sekcja_skryptu: mission
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: What kind of information are you looking for?
      pl: Jakiego rodzaju informacji szukacie?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_0e12d9e4d733c6e489a9
      kontekst: textscripts.park_crickettalk:line:30
      linia: 30
      sekcja_skryptu: mission
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: <i>Ultimately, we seek a certain person. One who has great power, due to the decisions they will make now and in the near future. One
        who has the power to save this world, and perhaps also our own.</i>
      pl: <i>Ostatecznie szukamy pewnej osoby. Kogoś o wielkiej mocy, wynikającej z decyzji, które podejmie teraz i w najbliższej przyszłości. Kogoś, kto ma moc ocalić ten świat, a być może i nasz.</i>
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_19be3e6e480beec40b12
      kontekst: textscripts.park_crickettalk:line:31
      linia: 31
      sekcja_skryptu: mission
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: What, like a destined, prophesied hero, that sort of thing?
      pl: Co, taki przeznaczony bohater z przepowiedni i te sprawy?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_91732a9b2c54b4b6dc7a
      kontekst: textscripts.park_crickettalk:line:32
      linia: 32
      sekcja_skryptu: mission
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: <i>Not in the sense you mean. There is no divine bloodline or mystical inevitability at work here. Merely an ordinary person, who will
        happen to be in the right place at the right time, and therefore have the opportunity to choose.</i>
      pl: <i>Nie w tym sensie, w jakim myślisz. Nie ma tu żadnej boskiej krwi ani mistycznej nieuchronności. Po prostu zwykły człowiek, który przypadkiem znajdzie się we właściwym miejscu o właściwej porze i dzięki temu dostanie możliwość wyboru.</i>
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_e6064f09c319d5785015
      kontekst: textscripts.park_crickettalk:line:33
      linia: 33
      sekcja_skryptu: mission
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: <i>We call this person... The Protagonist.</i>
      pl: <i>Nazywamy tę osobę... Protagonistą.</i>
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_2dcd7744e765257a18ad
      kontekst: textscripts.park_crickettalk:line:36
      linia: 36
      sekcja_skryptu: mission
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: I have a bad feeling that you might be talking about me.
      pl: Mam złe przeczucie, że mówicie właśnie o mnie.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_24250dc7a26be13173c8
      kontekst: textscripts.park_crickettalk:line:37
      linia: 37
      sekcja_skryptu: mission
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: Oh yeah, that's me. That's so totally me.
      pl: Tak, to ja. Zdecydowanie ja.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: askleave
    wpisy:
    - id: sol_2cec9a43528ca5ae45a5
