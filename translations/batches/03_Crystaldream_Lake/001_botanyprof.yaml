  - etykieta: salad3
    wpisy:
    - id: sol_cf510b22d9e0deb926da
      kontekst: textscripts.botanyprof_fridge:line:33
      linia: 33
      sekcja_skryptu: salad3
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: <i>Sigh...</i> All right, well, I guess there's no point in fighting you on it. I know how this goes.
      pl: <i>Ech...</i> No dobrze, chyba nie ma sensu z tobą walczyć. Wiem, jak to się kończy.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_8277a100046692cceb03
      kontekst: textscripts.botanyprof_fridge:line:34
      linia: 34
      sekcja_skryptu: salad3
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You poke around the ruins of the kitchen until you find an intact salad bowl, and wipe it off with your sleeve.
      pl: Grzebiesz w ruinach kuchni, aż znajdujesz całą miskę na sałatkę, i wycierasz ją rękawem.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_fd4921fc65e894158a0d
      kontekst: textscripts.botanyprof_fridge:line:35
      linia: 35
      sekcja_skryptu: salad3
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Let's see. A salad would typically start with a bed of lettuce. The nearest equivalent you see here would be either some glistening
        green-brown sludge that is just barely holding together into leaf-like sheets, or some broad, shiny green leaves dotted with blood-red
        splotches.
      pl: Zobaczmy. Sałatka zwykle zaczyna się od warstwy sałaty. Najbliższy odpowiednik tutaj to lśniąca zielonobrązowa maź, ledwie trzymająca
        się w kształcie liści, albo szerokie, błyszczące zielone liście upstrzone krwistoczerwonymi plamami.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_a1b520addd38f3614aa5
      kontekst: textscripts.botanyprof_fridge:line:36
      linia: 36
      sekcja_skryptu: salad3
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: The gross brown sludge
      pl: Obrzydliwa brązowa maź
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_e00d28f65ec549d9e27a
      kontekst: textscripts.botanyprof_fridge:line:37
      linia: 37
      sekcja_skryptu: salad3
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: The weird splotchy leaves
      pl: Dziwne plamiste liście
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: salad3a
    wpisy:
    - id: sol_f9d9e9d789c8c48f1049
      kontekst: textscripts.botanyprof_fridge:line:41
      linia: 41
      sekcja_skryptu: salad3a
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You fish a handful of rotting leaves out of the bottom of the fridge and splap them into your bowl. That's the sound it makes, <i>splap</i>.
        The slime sticks to your hand like a thick coat of vaseline and motor oil, which is also more or less what it smells like.
      pl: 'Wyławiasz garść gnijących liści z dna lodówki i wślapujesz je do miski. Właśnie taki wydają dźwięk: <i>ślap</i>. Szlam przylega do dłoni jak gruba warstwa wazeliny z olejem silnikowym i mniej więcej tak samo pachnie.'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: salad3b
    wpisy:
    - id: sol_da1a13efc81c2aca93d1
      kontekst: textscripts.botanyprof_fridge:line:46
      linia: 46
      sekcja_skryptu: salad3b
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You pick a handful of the leaves and arrange them in the bottom of your bowl. It seems like the red spots are migrating toward where
        your hands touched the leaves, so you try not to do that too much, or let the spots actually touch your skin.
      pl: Zrywasz garść liści i układasz je na dnie miski. Czerwone plamy chyba wędrują ku miejscom dotkniętym przez dłonie, więc starasz się
        ograniczyć kontakt i nie pozwolić im dotknąć skóry.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: salad4
    wpisy:
    - id: sol_8bf290d6f73d5c6b81f9
      kontekst: textscripts.botanyprof_fridge:line:51
      linia: 51
      sekcja_skryptu: salad4
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: What next... maybe some sliced cucumber? You do see something in here that looks like maybe it used to be a cucumber, but it's mostly
        dissolved and leaked away, leaving behind a long blob of empty and blackened cucumber skin -- like a deflated, slime-leaking party balloon.
      pl: Co dalej... może plasterki ogórka? Jest tu coś, co chyba kiedyś było ogórkiem, ale w większości rozpuściło się i wyciekło, zostawiając
        długi płat pustej, poczerniałej skórki — jak sflaczały imprezowy balon ociekający śluzem.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_65d79b397a6572f07994
      kontekst: textscripts.botanyprof_fridge:line:52
      linia: 52
      sekcja_skryptu: salad4
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Alternately, you could take a vegetable that is sort of long and round like a cucumber, but it's yellow like a squash, with rippling
        and bulging bright-green veins.
      pl: Można też wziąć warzywo podłużne i okrągłe jak ogórek, ale żółte jak kabaczek i pokryte falującymi, nabrzmiałymi, jaskrawozielonymi
        żyłami.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_c5c0df994c0a0c38816f
      kontekst: textscripts.botanyprof_fridge:line:53
      linia: 53
      sekcja_skryptu: salad4
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: The cucumber skin
      pl: Skórka ogórka
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_573bffee0dcd38b90c41
      kontekst: textscripts.botanyprof_fridge:line:54
      linia: 54
      sekcja_skryptu: salad4
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: The weird vegetable
      pl: Dziwne warzywo
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: salad4a
    wpisy:
    - id: sol_413819d7e9c39db4f75a
      kontekst: textscripts.botanyprof_fridge:line:58
      linia: 58
      sekcja_skryptu: salad4a
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The cucumber skin makes a damp slurping sound as you peel it off of the fridge shelf. It probably doesn't make any sense to slice it,
        so you just drape it along the edge of the bowl as a horrible garnish.
      pl: Skórka ogórka wydaje wilgotne siorbnięcie, gdy odklejasz ją od półki. Krojenie chyba nie ma sensu, więc po prostu przewieszasz ją przez
        brzeg miski jako upiorną dekorację.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: salad4b
    wpisy:
    - id: sol_96256e9bf67e02482d21
      kontekst: textscripts.botanyprof_fridge:line:63
      linia: 63
      sekcja_skryptu: salad4b
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You take the weird squash-like thing and find a rusty kitchen knife to slice it with. Neon green juice spritzes out with surprising
        force as you do, narrowly missing your eyes and tingling fiercely where it gets on your skin. The inner flesh of the vegetable is black
        with an oily purple sheen, and it smells like a brand-new car tire. That a cat peed on.
      pl: Bierzesz dziwne kabaczkowate coś i znajdujesz zardzewiały nóż. Podczas krojenia neonowozielony sok tryska z zaskakującą siłą, ledwie
        omijając oczy i dotkliwie szczypiąc skórę. Miąższ jest czarny, oleiście fioletowy i pachnie jak nowa opona samochodowa. Obsikana przez
        kota.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_9ec73d4fca83c5a257c1
      kontekst: textscripts.botanyprof_fridge:line:64
      linia: 64
      sekcja_skryptu: salad4b
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You arrange the slices neatly in your bowl.
      pl: Równo układasz plasterki w misce.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: salad5
    wpisy:
    - id: sol_db956a99e04621a89ec9
      kontekst: textscripts.botanyprof_fridge:line:69
      linia: 69
      sekcja_skryptu: salad5
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The next thing you find while rooting around in the fridge is a surprisingly intact-looking onion. Next to it is a thing of similar
        shape and size, but more of a puce color. And twitching slightly.
      pl: Następną rzeczą znalezioną podczas grzebania w lodówce jest zaskakująco zdrowo wyglądająca cebula. Obok leży coś o podobnym kształcie i rozmiarze, ale raczej w kolorze brunatnofioletowym. I lekko drga.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_a2347bf4446b348e3ac0
      kontekst: textscripts.botanyprof_fridge:line:70
      linia: 70
      sekcja_skryptu: salad5
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: The onion
      pl: Cebula
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_ade5282618f4f1cc5a80
      kontekst: textscripts.botanyprof_fridge:line:71
      linia: 71
      sekcja_skryptu: salad5
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: The... other thing
      pl: '...To drugie'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: salad5a
    wpisy:
    - id: sol_990c0c857eda55df381b
      kontekst: textscripts.botanyprof_fridge:line:75
      linia: 75
      sekcja_skryptu: salad5a
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: When you go to slice the onion, it turns out to be entirely hollow, having rotted from the inside-out as onions sometimes do. Brown
        juice squirts out everywhere, and although I was trying to avoid an explicit callback here, I can't think of any way to describe the juice
        except as being exactly like the contents of a spittoon in every way. You shake the juice off of the remains of the onion, and add it
        to your salad.
      pl: Przy próbie krojenia okazuje się, że cebula jest całkiem pusta, bo jak to czasem bywa, zgniła od środka. Brązowy sok tryska wszędzie
        i choć próbowano uniknąć jawnego nawiązania, nie da się go opisać inaczej niż jako identyczny pod każdym względem z zawartością spluwaczki.
        Strząsasz sok z resztek cebuli i dodajesz je do sałatki.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: salad5b
    wpisy:
    - id: sol_c377eaf59478c4af177c
      kontekst: textscripts.botanyprof_fridge:line:80
      linia: 80
      sekcja_skryptu: salad5b
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: As soon as your knife pierces the skin of the puce-colored vegetable, it bursts open, and thousands of tiny pink mites pour out of it,
        scampering everywhere on long spiderlike legs. They vanish quickly, finding various crevices throughout the kitchen to hide in. Hopefully,
        none of those crevices belong to you. You calmly slice what's left of the vegetable, and add it to your salad.
      pl: Gdy nóż przebija skórę brunatnofioletowego warzywa, ono pęka, wypuszczając tysiące maleńkich różowych roztoczy, które rozbiegają się na długich, pajęczych nogach. Szybko znikają w kuchennych szczelinach. Oby żadna z nich nie należała do ciebie. Spokojnie kroisz pozostałość warzywa i dodajesz ją do sałatki.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: salad6
    wpisy:
    - id: sol_e6e3b454473b341e2455
      kontekst: textscripts.botanyprof_fridge:line:85
      linia: 85
      sekcja_skryptu: salad6
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The perfect thing to top off a salad is, in my opinion, some nice fresh cherry tomatoes. You do find a small bowl of round things that
        might be grayish-green cherry tomatoes? Or rotting grapes. Or old pickled quail eggs? Or maybe just green olives? Ugh, I hate green olives.
      pl: Idealnym zwieńczeniem sałatki są moim zdaniem świeże pomidorki koktajlowe. Znajdujesz małą miskę szarozielonych kulek, które mogą być
        pomidorkami? Albo gnijącymi winogronami. Albo starymi jajkami przepiórczymi w zalewie? Albo po prostu zielonymi oliwkami? Uch, nie znoszę
        zielonych oliwek.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_a55cedca425fb2d79b12
      kontekst: textscripts.botanyprof_fridge:line:86
