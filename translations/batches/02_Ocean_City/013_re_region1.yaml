      kontekst: textscripts.re_region1_companion_obie_misc:line:15
      linia: 15
      sekcja_skryptu: two
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: An opportunity to sell me your hat?  Anyway, you got it backwards -- I'm supposed to pay you.
      pl: Okazja, żeby sprzedać mi twój kapelusz? W każdym razie masz to na odwrót — to ja mam ci zapłacić.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_59e507a63de5854fe77f
      kontekst: textscripts.re_region1_companion_obie_misc:line:16
      linia: 16
      sekcja_skryptu: two
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: '...Are you jivin'' me?'
      pl: '...Nabijasz się ze mnie?'
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_4bf96c40f1f7237391d4
      kontekst: textscripts.re_region1_companion_obie_misc:line:17
      linia: 17
      sekcja_skryptu: two
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Ha ha, yeah. Just kidding.
      pl: Ha ha, ta. Tylko żartowałem.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
