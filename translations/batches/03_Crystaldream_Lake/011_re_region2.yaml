  - etykieta: failtofind
    wpisy:
    - id: sol_3e3f7dc0090aa280e1a9
      kontekst: textscripts.re_region2_deliakey:line:19
      linia: 19
      sekcja_skryptu: failtofind
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You continue trying to search around the woods near Sandwich Village, hoping to find Delia's lost house key. And again you give up after
        a short while. Finding a tiny 230-year-old key in many square miles of forest wide seems... unlikely. Maybe you'll come across something
        later that will help? Some kind of... lost metal finding device? Until then, this is clearly a wild goose chase.
      pl: Nadal próbujesz szukać w lasach koło Wioski Sandwich, mając nadzieję znaleźć zgubiony klucz do domu Delii. I znowu poddajesz się po
        krótkiej chwili. Znalezienie maleńkiego 230-letniego klucza w wielu milach kwadratowych lasu wydaje się... mało prawdopodobne. Może natkniesz
        się później na coś, co pomoże? Jakieś... urządzenie do wykrywania zgubionego metalu? Do tego czasu to najwyraźniej szukanie wiatru w polu.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
