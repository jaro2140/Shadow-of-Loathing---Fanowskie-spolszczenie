      linia: 4
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: You decide to take a shortcut between two of the university buildings. It's a little dark and spooky in there, but nothing to be scared
        of, really.
      pl: Postanawiasz skrócić sobie drogę między dwoma budynkami uniwersyteckimi. Jest tam trochę ciemno i upiornie, ale w sumie nie ma się czego
        bać, naprawdę.
