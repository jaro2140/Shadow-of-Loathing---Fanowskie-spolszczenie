      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: It turns out that this garbage dump is much deeper and older than it initially appeared -- huge rooms and tunnels have been carved out
        of the trash, like the worst archaeological dig imaginable.
      pl: Okazuje się, że wysypisko jest znacznie głębsze i starsze, niż początkowo się zdawało. W śmieciach wydrążono ogromne komnaty i tunele,
        niczym w najgorszym wyobrażalnym wykopalisku archeologicznym.
