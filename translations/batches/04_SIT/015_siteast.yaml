      sekcja_skryptu: makedessert
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Toss some ice cream in a bowl
      pl: Wrzuć trochę lodów do miski
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
