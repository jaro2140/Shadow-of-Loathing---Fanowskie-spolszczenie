  pomieszczenie:
    id: boardinghouse_floor1
    nazwa_en: Ms. Brewster's (Ground Floor)
  zagadka: false
  minigra_lub_feature: false
  liczba_wpisow: 12
  sekcje:
  - etykieta: start
    wpisy:
    - id: sol_15355a5e53cca874e575
      kontekst: textscripts.boardinghouse_enter:line:6
      linia: 6
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: As you enter the boarding house, you discover some kind of hullabaloo, or perhaps a kerfuffle -- a stern-looking middle-aged lady is
        surrounded by six agitated men, all talking over each other.
      pl: Po wejściu do pensjonatu trafiasz na jakieś zamieszanie, a być może rejwach — surowo wyglądającą kobietę w średnim wieku otacza sześciu wzburzonych mężczyzn, którzy przekrzykują się nawzajem.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_f48426500151fd9c0a95
      kontekst: textscripts.boardinghouse_enter:line:7
      linia: 7
      sekcja_skryptu: start
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Listen in
      pl: Podsłuchaj
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 3
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: two
    wpisy:
    - id: sol_99955276b6950da232c8
      kontekst: textscripts.boardinghouse_enter:line:12
      linia: 12
      sekcja_skryptu: two
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Gentlemen, I insist you settle down at once! We won't get to the bottom of this with you all acting like panicked schoolchildren!
      pl: Panowie, nalegam, żebyście natychmiast się uspokoili! Nie rozwiążemy tej sprawy, jeśli będziecie zachowywać się jak spanikowane dzieciaki!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_4a945a238106367d20f1
      kontekst: textscripts.boardinghouse_enter:line:14
      linia: 14
      sekcja_skryptu: two
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Ms. Brewster, you've got to call the cops!
      pl: Pani Brewster, musi pani wezwać policję!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_ab35fd92502e14906288
      kontekst: textscripts.boardinghouse_enter:line:15
      linia: 15
      sekcja_skryptu: two
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Hah! What this town calls police, I wouldn't trust to solve a jigsaw puzzle, let alone a serious crime! And I won't have those hooligans
        turning my house upside-down!
      pl: Ha! Temu, co w tym mieście uchodzi za policję, nie powierzyłabym układanki dla dzieci, a co dopiero poważnego przestępstwa! I nie pozwolę
        tym chuliganom wywrócić mojego domu do góry nogami!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_84a7a85218ef3ac2f9f7
      kontekst: textscripts.boardinghouse_enter:line:17
      linia: 17
      sekcja_skryptu: two
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: But there's been a m-m-m-murder! Somebody has to do something!
      pl: Ale doszło do m-m-m-morderstwa! Ktoś musi coś zrobić!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_3b6ca8f268cb3e15d653
      kontekst: textscripts.boardinghouse_enter:line:18
      linia: 18
      sekcja_skryptu: two
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: What <i>you</i> can all do is go to your rooms, and let me think! Good gracious!
      pl: A <i>wy</i> możecie wrócić do pokoi i pozwolić mi pomyśleć! Wielkie nieba!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_5345614ed2879950965b
      kontekst: textscripts.boardinghouse_enter:line:19
      linia: 19
      sekcja_skryptu: two
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The men file up the stairs, abashed but still fidgeting nervously.
      pl: Mężczyźni gęsiego wchodzą po schodach, zawstydzeni, ale wciąż nerwowo się wiercąc.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_69e91594e14afccff26d
      kontekst: textscripts.boardinghouse_enter:line:20
      linia: 20
      sekcja_skryptu: two
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Talk to the woman
      pl: Porozmawiaj z kobietą
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_a8d3fafc4e368ac7c358
      kontekst: textscripts.boardinghouse_enter:line:21
      linia: 21
      sekcja_skryptu: two
      typ: option
