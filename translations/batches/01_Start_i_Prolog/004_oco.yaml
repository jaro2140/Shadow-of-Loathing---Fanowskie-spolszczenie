      pl: Po jej wyjeździe pękła rurka czegośtam i zrobiło się agresywne. Znam się na maszynach, ale przy nowomodnej elektryce równie dobrze mógłbym być psem próbującym czytać Platona. Zamknąłem to w stodole.
