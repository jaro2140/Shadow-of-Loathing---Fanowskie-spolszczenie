      linia: 91
      sekcja_skryptu: urns
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: That fifth feller weren't never found. I ain't... I ain't recall how that urn got here.
      pl: Piątego nigdy nie znaleziono. Nie... nie pamiętam, skąd się tu wzięła ta urna.
