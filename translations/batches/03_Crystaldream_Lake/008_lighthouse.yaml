      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_fa63fc8f3ef37d259a0a
      kontekst: textscripts.lighthouse_keeper_stage2:line:48
      linia: 48
      sekcja_skryptu: asktwo
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: '''Coz of how they changed ''em.'
      pl: Bo je zmienili.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_e31b7992ecf73e1f6e1c
      kontekst: textscripts.lighthouse_keeper_stage2:line:49
      linia: 49
      sekcja_skryptu: asktwo
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: What? Changed the compasses?
      pl: Co? Zmienili kompasy?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_41cda845cff376953ced
      kontekst: textscripts.lighthouse_keeper_stage2:line:50
      linia: 50
      sekcja_skryptu: asktwo
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: They didn't teach you that in school? Folks got short memories, it was only 'round about the turn of the century. Some atlas company
        bought the patent on west an' rebranded it as New North. Then they did a recall on all the compasses and issued new ones. They all point
        <i>west</i> now, an' that's useless for my purposes.
      pl: Nie uczono tego w szkole? Ludzie mają krótką pamięć, to było dopiero na przełomie wieków. Jakaś firma produkująca atlasy kupiła patent na zachód i przemianowała go na Nową Północ. Potem wydawnictwo wycofało wszystkie kompasy i wydali nowe. Wszystkie wskazują teraz <i>zachód</i>, a do moich celów to bezużyteczne.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_849a567bc7c21e999e21
      kontekst: textscripts.lighthouse_keeper_stage2:line:51
      linia: 51
      sekcja_skryptu: asktwo
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: Okay...
      pl: Dobrze...
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 3
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
