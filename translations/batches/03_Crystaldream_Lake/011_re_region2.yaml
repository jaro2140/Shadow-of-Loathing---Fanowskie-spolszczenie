      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: A squirrel chatters angrily at you from a nearby hollow tree -- presumably trying to scare you away from its stash? A real tactical
        mistake on its part, since now you know where its stash is.
      pl: Wiewiórka gniewnie skrzeczy na ciebie z pobliskiego dziuplastego drzewa -- pewnie próbując cię odstraszyć od swojej skrytki? Prawdziwy
        błąd taktyczny z jej strony, bo teraz wiesz, gdzie jest jej skrytka.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_139f351a24a924b03da8
      kontekst: textscripts.re_region2_treasure1:line:4
      linia: 4
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: It scampers away as you peer into the hole -- you find, not just the expected nuts, but also several wallets? Huh, has this squirrel
        been mugging hikers?
      pl: Umyka, gdy zaglądasz do dziupli -- znajdujesz nie tylko spodziewane orzechy, ale też kilka portfeli? Ha, czy ta wiewiórka napadała na
        turystów?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_8b68a1eabc9c0e1d33e7
      kontekst: textscripts.re_region2_treasure1:line:5
      linia: 5
      sekcja_skryptu: start
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Maybe you should get out of here before it comes back with a knife.
      pl: Może powinieneś się stąd zabrać, zanim wróci z nożem.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
