      linia: 113
      sekcja_skryptu: jbrag
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: What you're doing is <i>suspicious</i>, old man! And me and Lefty <i>(you kiss your left bicep)</i> and Righty <i>(you kiss your right
        bicep)</i> are getting sick and tired of looking up all this junk in dusty old books and newspaper archives! We think you're mixed up
        in all this weird shadow stuff that's going on, and we want answers!
      pl: To, co robisz, jest <i>podejrzane</i>, staruszku! A mnie oraz Lewemu <i>(całujesz lewy biceps)</i> i Prawemu <i>(całujesz prawy biceps)</i>
        po dziurki w nosie wyszukiwania tych bzdur w zakurzonych książkach i archiwach gazet! Uważamy, że masz związek z całą tą dziwną sprawą
        Cienia, i żądamy odpowiedzi!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
