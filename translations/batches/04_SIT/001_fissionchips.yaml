      linia: 23
      sekcja_skryptu: intro
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: They get this mean look on their faces, too. A sort of pitying sneer. Like they think I'm super dumb and these must be dumb pencils
        that only write dumb answers, or something.
      pl: Robią też takie wredne miny. Coś w rodzaju litościwego szyderstwa. Jakby uważali mnie za kompletnego głupka, a te ołówki miały pisać
        tylko głupie odpowiedzi czy coś.
