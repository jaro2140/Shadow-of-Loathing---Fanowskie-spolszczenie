      en: Now you just need a way to escape the rotting sewer smell clinging to your clothes and hair and skin.
      pl: Teraz potrzebujesz tylko sposobu, żeby pozbyć się zapachu gnijącej kanalizacji, który przywarł ci do ubrania, włosów i skóry.
