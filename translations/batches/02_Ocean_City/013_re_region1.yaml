      linia: 5
      sekcja_skryptu: start
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: You've dropped something, Professor.
      pl: Coś pan upuścił, profesorze.
      status: do_korekty
      wspoldzielony_rekord: false
