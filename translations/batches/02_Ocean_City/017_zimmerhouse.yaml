    wpisy:
    - id: sol_99cafb9c7a790e9fe987
      kontekst: textscripts.zimmerhouse_puddle:line:71
      linia: 71
      sekcja_skryptu: top
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: The top shelf has a few old tins of varnish, and a big bucket of tar. As you watch, a drip of tar slowly leaks out of a hole in the
        bottom of the bucket and plops into the puddle below.
      pl: Na górnej półce stoi kilka starych puszek lakieru i wielkie wiadro smoły. Na twoich oczach kropla smoły powoli przeciska się przez dziurę
        w dnie wiadra i plumka do kałuży poniżej.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_a1fc63eefe3e36d21157
      kontekst: textscripts.zimmerhouse_puddle:line:72
      linia: 72
      sekcja_skryptu: top
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: Well, there you go. Mystery solved.
      pl: No proszę. Zagadka rozwiązana.
