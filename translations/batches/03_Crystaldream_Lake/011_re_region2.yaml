      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: I ſay, ſomething has juſt occurred to me. Are you familiar with a Village nearby, by the name of Sandwich?
      pl: Powiem, coś mi właśnie przyszło do głowy. Czy jest panu znana pobliska Wioska o nazwie Sandwich?
