      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: It's like watching someone try to scrape just one more sandwich worth of meat out of a leftover turkey carcass.
      pl: To jak oglądanie kogoś, kto próbuje wyskrobać z resztek indyczego szkieletu mięso na jeszcze jedną kanapkę.
