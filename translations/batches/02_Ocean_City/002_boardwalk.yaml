        the organization, with all the privileges therein to which you are hereby entitled.
      pl: To, mój nowoawansowany @p|comrade,comradess,comrade@, jest pieczęciowatością naszego Szefa. Pierścień identyfikacjonuje cię jako caporegime
        organizacji wraz ze wszystkimi przywilejami, do których niniejszym nabywasz uprawnioność.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - '@p|comrade,comradess,comrade@'
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
