      kontekst: textscripts.sitwest_geologysign3:line:11
      linia: 11
      sekcja_skryptu: read
      typ: say
      mowca_lub_kanal: narrator_lub_wypowiedz_ogolna
      en: \"A hexrock sample of the correct composition and sufficient mass can exert an influence over the non-thaumomorphic (viz. ordinary and
        boring) rocks in its vicinity. This property is referred to as 'charisma.'"
      pl: \"Próbka heksokamienia o odpowiednim składzie i wystarczającej masie potrafi wywierać wpływ na pobliskie skały nietaumomorficzne (to
        jest zwyczajne i nudne). Właściwość tę nazywa się „charyzmą”."
      status: do_korekty
