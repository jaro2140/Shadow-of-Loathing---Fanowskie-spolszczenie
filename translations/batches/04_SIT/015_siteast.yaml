- kolejnosc_w_danych_gry: 3791
  skrypt: siteast_astronomyteacher
  pomieszczenie:
    id: siteast_astronomyroom
    nazwa_en: S.I.T. (Astronomy Classroom)
  zagadka: false
  minigra_lub_feature: false
  liczba_wpisow: 42
  sekcje:
  - etykieta: popup
    wpisy:
    - id: sol_cad7888ea96f401ad618
      kontekst: textscripts.siteast_astronomyteacher:line:4
      linia: 4
      sekcja_skryptu: popup
      typ: option
      mowca_lub_kanal: opcja_gracza
      en: Talk
      pl: Porozmawiaj
      status: do_korekty
      wspoldzielony_rekord: true
      liczba_wystapien: 4
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: intro
    wpisy:
    - id: sol_bc22e7f31d9a7e5a8efe
      kontekst: textscripts.siteast_astronomyteacher:line:17
      linia: 17
      sekcja_skryptu: intro
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Oh, hello. Are you taking my astrology course?
      pl: O, dzień dobry. Chodzisz na moje zajęcia z astrologii?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_8a3b896cda2e7364ded4
      kontekst: textscripts.siteast_astronomyteacher:line:19
      linia: 19
      sekcja_skryptu: intro
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: Astrology? I thought this was supposed to be astronomy. Astrology is kind of unscientific for S.I.T., isn't it?
      pl: Astrologii? Myślałem, że to miała być astronomia. Astrologia jest trochę mało naukowa jak na S.I.T., prawda?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_8a3dfe98cf8b858e4c43
      kontekst: textscripts.siteast_astronomyteacher:line:20
      linia: 20
      sekcja_skryptu: intro
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: Hmph, yes, well. <i>Some</i> take that narrow, pedestrian view, certainly. Such as the dean. And the grant committee.
      pl: Hm, owszem. <i>Niektórzy</i> z pewnością prezentują ten ciasny, przyziemny pogląd. Na przykład dziekan. I komisja grantowa.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne:
      - <i>
      - </i>
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_9283bc4adb42b822a2d0
      kontekst: textscripts.siteast_astronomyteacher:line:21
      linia: 21
      sekcja_skryptu: intro
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: But I suppose if you're just here for astronomy I can give you the edited version of the course.
      pl: Ale jeśli jesteś tu wyłącznie z powodu astronomii, mogę chyba przedstawić ci okrojoną wersję kursu.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_d3090a924c2be3e74040
      kontekst: textscripts.siteast_astronomyteacher:line:22
      linia: 22
      sekcja_skryptu: intro
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: I am actually in a hurry, so that'd be great.
      pl: Właściwie to się spieszę, więc byłoby świetnie.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_22c0b5b5146f73c65a8a
      kontekst: textscripts.siteast_astronomyteacher:line:23
      linia: 23
      sekcja_skryptu: intro
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: I have fifteen constellations diagrammed on the blackboard behind me; only twelve of them are genuine. All you have to do is mark the
        three false ones.
      pl: Na tablicy za mną rozrysowałem piętnaście gwiazdozbiorów; tylko dwanaście z nich jest prawdziwych. Wystarczy, że zaznaczysz trzy fałszywe.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_02edc9fbb9a43647ed0a
      kontekst: textscripts.siteast_astronomyteacher:line:24
      linia: 24
      sekcja_skryptu: intro
      typ: sayoption
      mowca_lub_kanal: opcja_gracza
      en: That seems pretty straightforward.
      pl: Brzmi dość prosto.
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
  - etykieta: two
    wpisy:
    - id: sol_5a2c0cb1db39cffeb380
      kontekst: textscripts.siteast_astronomyteacher:line:28
      linia: 28
      sekcja_skryptu: two
      typ: leftsay
      mowca_lub_kanal: postac_po_lewej
      en: That seems pretty straightforward. How do I find out which are which?
      pl: Brzmi dość prosto. Jak odróżnić jedne od drugich?
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
      minigra_lub_feature: false
      uwagi: []
    - id: sol_ba9133d262dd46e42d3c
      kontekst: textscripts.siteast_astronomyteacher:line:29
      linia: 29
      sekcja_skryptu: two
      typ: rightsay
      mowca_lub_kanal: postac_po_prawej
      en: By exploring the heavens themselves!
      pl: Badając same niebiosa!
      status: do_korekty
      wspoldzielony_rekord: false
      liczba_wystapien: 1
      tokeny_techniczne: []
      zagadka: false
